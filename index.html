  function squash() {
    if (!landing || reduced) return null;
    const p = landing.t / 230;
    if (p >= 1) return null;
    const a = (p < .4 ? .2 * Math.sin(Math.PI * p / .4) : -.07 * Math.sin(Math.PI * (p - .4) / .6)) * landing.power;
    return { sx: 1 + a * .7, sy: 1 - a };
  }
  // Drawn under the pieces: the instant-drop trail.
  function drawUnder(ctx, cell) {
    if (!trail) return;
    const q = trail.t / 260;
    ctx.save();
    ctx.globalAlpha = 1 - q;
    for (const s of trail.streaks) {
      const top = s.y0 * cell, bottom = s.y1 * cell + cell * .5;
      if (bottom <= top) continue;
      const gr = ctx.createLinearGradient(0, top, 0, bottom);
      gr.addColorStop(0, 'rgba(255, 255, 255, 0)');
      gr.addColorStop(.7, trail.color);
      gr.addColorStop(1, '#fff');
      ctx.fillStyle = gr;
      const w = cell * (.62 - .3 * q), x = s.x * cell + (cell - w) / 2;
      ctx.beginPath(); ctx.moveTo(x + w / 2, top);
      ctx.lineTo(x + w, bottom); ctx.lineTo(x, bottom); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function starPath(ctx, r) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, rad = i % 2 ? r * .38 : r;
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
  }
  function draw(ctx, cell) {
    if (flash) {
      const q = flash.t / CONFIG.clearDelay;
      ctx.fillStyle = `rgba(255, 255, 255, ${(.85 * Math.abs(Math.sin(q * Math.PI * 2))).toFixed(3)})`;
      for (const y of flash.rows) ctx.fillRect(0, y * cell, Game.state.cols * cell, cell);
    }
    for (const p of parts) {
      const q = p.life / p.max, r = p.size * cell;
      ctx.save();
      ctx.translate(p.x * cell, p.y * cell); ctx.rotate(p.rot);
      if (p.kind === 'dust') {
        ctx.globalAlpha = .8 * (1 - q); ctx.fillStyle = '#FFF7E3';
        ctx.beginPath(); ctx.arc(0, 0, r * (1 + q), 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === 'spark') {
        ctx.globalAlpha = 1 - q * q; ctx.fillStyle = p.color;
        starPath(ctx, r * (1.2 - q * .5)); ctx.fill();
      } else {
        ctx.globalAlpha = q > .7 ? (1 - q) / .3 : 1;
        ctx.fillStyle = p.color; ctx.strokeStyle = '#2E2152'; ctx.lineWidth = Math.max(1, r * .28);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, .6)';
        ctx.beginPath(); ctx.arc(-r * .3, -r * .3, r * .3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }
  Events.on('hardDrop', onHardDrop); // fires just before 'lock'
  Events.on('lock', onLock);
  Events.on('rowsFull', onRowsFull);
  Events.on('lines', () => { landing = null; }); // lines moved – the landed piece may be gone
  Events.on('start', reset);
  return { update, draw, drawUnder, squash, landing: () => landing, shaking: () => shake > 0 };
})();

/* ---------- 8. Scene ---------- */
// World backgrounds, painted in code: a static picture plus a few gently
// moving things (petals, dust, bubbles, snow, twinkling stars).
const Scene = (() => {
  const TAU = Math.PI * 2;
  const seeded = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function vgrad(g, H, stops) {
    const gr = g.createLinearGradient(0, 0, 0, H);
    stops.forEach(([o, c]) => gr.addColorStop(o, c));
    return gr;
  }
  function puff(g, x, y, r, color) { // a soft cartoon cloud
    g.fillStyle = color;
    for (const [dx, dy, k] of [[0, 0, 1], [-.9, .25, .7], [.9, .25, .72], [-.45, -.3, .75], [.45, -.35, .7]]) {
      g.beginPath(); g.arc(x + dx * r, y + dy * r, r * k, 0, TAU); g.fill();
    }
  }
  function hill(g, W, H, y0, y1, bump, fill) {
    g.beginPath(); g.moveTo(0, y0);
    g.bezierCurveTo(W * .3, y0 - bump, W * .6, y1 + bump * .4, W, y1);
    g.lineTo(W, H); g.lineTo(0, H); g.closePath();
    g.fillStyle = fill; g.fill();
  }
  function flower(g, x, y, r, petal) {
    g.fillStyle = petal;
    for (let i = 0; i < 5; i++) { const a = i * TAU / 5; g.beginPath(); g.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * .75, 0, TAU); g.fill(); }
    g.fillStyle = '#FFB000'; g.beginPath(); g.arc(x, y, r * .6, 0, TAU); g.fill();
  }
  function sun(g, x, y, r, inner, outer, glow) {
    const gl = g.createRadialGradient(x, y, r * .5, x, y, r * 3);
    gl.addColorStop(0, glow); gl.addColorStop(1, 'rgba(255, 255, 255, 0)');
    g.fillStyle = gl; g.beginPath(); g.arc(x, y, r * 3, 0, TAU); g.fill();
    const s = g.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r);
    s.addColorStop(0, inner); s.addColorStop(1, outer);
    g.fillStyle = s; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }

  const PAINT = [
    function meadow(g, W, H, R) {
      g.fillStyle = vgrad(g, H, [[0, '#3FB4FF'], [.55, '#A5E2FF'], [1, '#E2F7FF']]); g.fillRect(0, 0, W, H);
      const u = Math.min(W, 420);
      sun(g, W * .82, Math.min(H * .1, 90), u * .09, '#FFFBD0', '#FFC93C', 'rgba(255, 236, 140, .75)');
      for (let i = 0; i < 4 + H / 300; i++) puff(g, R() * W, H * (.06 + R() * .5), u * (.05 + R() * .04), 'rgba(255, 255, 255, .95)');
      hill(g, W, H, H * .7, H * .64, H * .05, '#8FE36A');
      hill(g, W, H, H * .8, H * .77, H * .04, vgrad(g, H, [[.75, '#62D646'], [1, '#2F9E2A']]));
      const petals = ['#FF6FB1', '#FFFFFF', '#FFD23F', '#B57CFF', '#FF8A3D'];
      for (let i = 0; i < 26 + W / 12; i++) flower(g, R() * W, H * (.8 + R() * .19), 3 + R() * 4, petals[i % petals.length]);
      g.strokeStyle = '#2F9E2A'; g.lineWidth = 2; g.lineCap = 'round';
      for (let i = 0; i < 30; i++) { const x = R() * W, y = H * (.72 + R() * .27); g.beginPath(); g.moveTo(x, y); g.lineTo(x - 3, y - 8); g.moveTo(x, y); g.lineTo(x + 3, y - 9); g.stroke(); }
    },
    function kingdom(g, W, H, R) {
      g.fillStyle = vgrad(g, H, [[0, '#FF5E8A'], [.35, '#FF8F4D'], [.62, '#FFC85A'], [.7, '#FFE08A']]); g.fillRect(0, 0, W, H);
      const u = Math.min(W, 420);
      sun(g, W * .5, H * .66, u * .2, '#FFF6C0', '#FFA23A', 'rgba(255, 200, 90, .7)');
      g.fillStyle = 'rgba(196, 80, 110, .75)'; g.beginPath(); g.moveTo(0, H * .67);
      for (let x = 0; x <= W; x += W / 6) g.quadraticCurveTo(x + W / 12, H * (.6 + R() * .04), x + W / 6, H * .67);
      g.lineTo(W, H); g.lineTo(0, H); g.fill();
      g.fillStyle = vgrad(g, H, [[.66, '#F6BC52'], [1, '#C9792B']]); g.fillRect(0, H * .68, W, H * .32);
      g.strokeStyle = '#A85E1E'; g.lineWidth = 2; g.lineCap = 'round';
      for (let i = 0; i < 40; i++) { const x = R() * W, y = H * (.7 + R() * .29); g.beginPath(); g.moveTo(x, y); g.lineTo(x + 2, y - 7); g.stroke(); }
      for (const [fx, fy, k] of [[.18, .72, 1], [.8, .76, 1.25], [.55, .7, .7]]) { // acacia trees
        const x = W * fx, y = H * fy, s = u * .11 * k;
        g.strokeStyle = '#5A2E1A'; g.lineWidth = s * .14;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - s * 1.1); g.lineTo(x - s * .5, y - s * 1.6); g.moveTo(x, y - s * 1.1); g.lineTo(x + s * .55, y - s * 1.65); g.stroke();
        g.fillStyle = '#3F6B1F'; g.beginPath(); g.ellipse(x, y - s * 1.75, s * 1.2, s * .32, 0, 0, TAU); g.fill();
        g.fillStyle = '#5E8F2A'; g.beginPath(); g.ellipse(x - s * .1, y - s * 1.85, s * 1.0, s * .22, 0, 0, TAU); g.fill();
      }
      g.strokeStyle = 'rgba(110, 40, 60, .8)'; g.lineWidth = 2;
      for (let i = 0; i < 4; i++) { const x = W * (.2 + R() * .6), y = H * (.12 + R() * .3); g.beginPath(); g.moveTo(x - 6, y - 3); g.quadraticCurveTo(x - 3, y - 6, x, y); g.quadraticCurveTo(x + 3, y - 6, x + 6, y - 3); g.stroke(); }
    },
    function ocean(g, W, H, R) {
      g.fillStyle = vgrad(g, H, [[0, '#3FDAF5'], [.4, '#1593D6'], [1, '#0A3E85']]); g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(255, 255, 255, .1)';
      for (let i = 0; i < 5; i++) { const x = W * (i / 5 + R() * .1); g.beginPath(); g.moveTo(x, 0); g.lineTo(x + W * .08, 0); g.lineTo(x + W * .25, H * .8); g.lineTo(x + W * .1, H * .8); g.fill(); }
      g.strokeStyle = 'rgba(255, 255, 255, .45)'; g.lineWidth = 1.5;
      for (let i = 0; i < 18; i++) { g.beginPath(); g.arc(R() * W, R() * H * .8, 2 + R() * 6, 0, TAU); g.stroke(); }
      const coral = (x, y, len, ang, w, color, depth) => {
        if (depth === 0) return;
        const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
        g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
        coral(x2, y2, len * .72, ang - .45, w * .72, color, depth - 1);
        coral(x2, y2, len * .72, ang + .4, w * .72, color, depth - 1);
      };
      const u = Math.min(W, 420);
      g.strokeStyle = '#2FCB6E'; g.lineWidth = 6; g.lineCap = 'round';
      for (let i = 0; i < 6; i++) { const x = R() * W, y = H; g.beginPath(); g.moveTo(x, y); for (let k = 1; k <= 5; k++) g.quadraticCurveTo(x + (k % 2 ? 10 : -10), y - k * 18 + 9, x, y - k * 18); g.stroke(); }
      g.fillStyle = vgrad(g, H, [[.85, '#F7D98B'], [1, '#E3B05A']]);
      g.beginPath(); g.moveTo(0, H * .9); g.quadraticCurveTo(W * .3, H * .86, W * .55, H * .9); g.quadraticCurveTo(W * .8, H * .93, W, H * .88); g.lineTo(W, H); g.lineTo(0, H); g.fill();
      const colors = ['#FF6F91', '#FF9F43', '#B57CFF', '#FF4F8B'];
      for (let i = 0; i < 6; i++) coral(W * (.08 + i * .17 + R() * .05), H * .92, u * .07, -Math.PI / 2 + (R() - .5) * .5, 7, colors[i % 4], 4);
      for (let i = 0; i < 3; i++) { const x = W * (.2 + i * .3), y = H * .93; g.fillStyle = '#FF8FB1'; g.beginPath(); g.arc(x, y, u * .035, Math.PI, 0); g.fill(); }
      for (let i = 0; i < 3; i++) { // little fish
        const x = W * (.15 + R() * .7), y = H * (.25 + R() * .45), s = 8 + R() * 6, dir = R() > .5 ? 1 : -1;
        g.fillStyle = ['#FFD23F', '#FF8A3D', '#FF6FB1'][i];
        g.beginPath(); g.ellipse(x, y, s, s * .6, 0, 0, TAU); g.fill();
        g.beginPath(); g.moveTo(x - dir * s * .8, y); g.lineTo(x - dir * s * 1.6, y - s * .6); g.lineTo(x - dir * s * 1.6, y + s * .6); g.fill();
        g.fillStyle = '#2E2152'; g.beginPath(); g.arc(x + dir * s * .45, y - s * .1, s * .14, 0, TAU); g.fill();
      }
    },
    function snow(g, W, H, R) {
      g.fillStyle = vgrad(g, H, [[0, '#7CC6FF'], [.6, '#CDEAFF'], [1, '#F3FAFF']]); g.fillRect(0, 0, W, H);
      const peaks = (base, height, n, body, shadowC, capC) => {
        for (let i = 0; i <= n; i++) {
          const x = (i / n) * W + (R() - .5) * W * .08, top = base - height * (.7 + R() * .3), half = W / n * .75;
          g.fillStyle = body; g.beginPath(); g.moveTo(x - half, base); g.lineTo(x, top); g.lineTo(x + half, base); g.fill();
          g.fillStyle = shadowC; g.beginPath(); g.moveTo(x, top); g.lineTo(x + half, base); g.lineTo(x + half * .2, base); g.fill();
          g.fillStyle = capC; g.beginPath(); g.moveTo(x - half * .3, top + (base - top) * .3); g.lineTo(x, top); g.lineTo(x + half * .3, top + (base - top) * .3);
          g.lineTo(x + half * .1, top + (base - top) * .38); g.lineTo(x - half * .08, top + (base - top) * .28); g.closePath(); g.fill();
        }
      };
      peaks(H * .72, H * .3, 3, '#9FBFE6', '#86A8D6', '#FFFFFF');
      peaks(H * .84, H * .28, 2, '#E6F0FF', '#C3D7F2', '#FFFFFF');
      g.fillStyle = '#FFFFFF'; g.beginPath(); g.moveTo(0, H * .86); g.quadraticCurveTo(W * .5, H * .82, W, H * .87); g.lineTo(W, H); g.lineTo(0, H); g.fill();
      for (let i = 0; i < 7; i++) { // pine trees with snow
        const x = R() * W, y = H * (.86 + R() * .12), s = 12 + R() * 12;
        g.fillStyle = '#2E7D6B';
        for (let k = 0; k < 3; k++) { g.beginPath(); g.moveTo(x, y - s * (1.6 + k * .55)); g.lineTo(x + s * (.8 - k * .18), y - s * (.4 + k * .55)); g.lineTo(x - s * (.8 - k * .18), y - s * (.4 + k * .55)); g.fill(); }
        g.fillStyle = '#FFFFFF'; g.beginPath(); g.moveTo(x, y - s * 2.7); g.lineTo(x + s * .22, y - s * 2.35); g.lineTo(x - s * .22, y - s * 2.35); g.fill();
      }
      g.fillStyle = 'rgba(255, 255, 255, .8)';
      for (let i = 0; i < 40; i++) { g.beginPath(); g.arc(R() * W, R() * H * .8, 1 + R() * 2, 0, TAU); g.fill(); }
    },
    function candy(g, W, H, R) {
      g.fillStyle = vgrad(g, H, [[0, '#1E1450'], [.45, '#4B2A8C'], [.8, '#B455B6'], [1, '#FF9AC8']]); g.fillRect(0, 0, W, H);
      for (let i = 0; i < 70; i++) { g.fillStyle = `rgba(255, 255, 255, ${.4 + R() * .6})`; g.beginPath(); g.arc(R() * W, R() * H * .7, .6 + R() * 1.6, 0, TAU); g.fill(); }
      const u = Math.min(W, 420), mx = W * .78, my = Math.min(H * .1, 90), mr = u * .07;
      sun(g, mx, my, mr, '#FFFBE0', '#FFE58A', 'rgba(255, 240, 180, .35)');
      g.fillStyle = '#251856'; g.beginPath(); g.arc(mx + mr * .45, my - mr * .25, mr * .85, 0, TAU); g.fill(); // crescent
      const pastel = ['#FFB8E1', '#B8F5E1', '#D7C2FF', '#FFD8B0', '#A8E6FF'];
      for (let i = 0; i < 10 + H / 200; i++) puff(g, R() * W, H * (.55 + R() * .45), u * (.06 + R() * .05), pastel[i % pastel.length]);
      for (let i = 0; i < 4; i++) puff(g, R() * W, H * (.15 + R() * .35), u * .04, 'rgba(215, 194, 255, .6)');
    },
  ];
  function paint(g, w, W, H) { PAINT[w % PAINT.length](g, W, H, seeded(w * 7919 + 17)); }

  // The animated full-screen background behind the game screen.
  let canvas, ctx, world = 0, look = 0, layer = null, W = 0, H = 0, dpr = 1, parts = [];
  function init() { canvas = document.getElementById('scene'); ctx = canvas.getContext('2d'); }
  function setWorld(w) { world = w; look = w % PAINT.length; resize(); } // look: which moving things to show
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    layer = document.createElement('canvas');
    layer.width = canvas.width; layer.height = canvas.height;
    const g = layer.getContext('2d'); g.scale(dpr, dpr);
    paint(g, world, W, H);
    parts = [];
    const R = Math.random;
    for (let i = 0; i < 34; i++) parts.push({ x: R() * W, y: R() * H, r: 1 + R() * 3, s: .3 + R() * .7, ph: R() * TAU });
    draw(0);
  }
  function update(dt) {
    if (reduced) return;
    const s = dt / 1000;
    for (const p of parts) {
      p.ph += s * 2;
      if (look === 0) { p.x += (14 + p.s * 18) * s; p.y += Math.sin(p.ph) * 12 * s + 6 * s; }   // drifting petals
      else if (look === 1) { p.y -= (6 + p.s * 10) * s; p.x += Math.sin(p.ph) * 8 * s; }       // golden dust
      else if (look === 2) { p.y -= (18 + p.s * 30) * s; p.x += Math.sin(p.ph) * 10 * s; }     // bubbles
      else if (look === 3) { p.y += (20 + p.s * 30) * s; p.x += Math.sin(p.ph) * 14 * s; }     // snow
      if (p.x > W + 10) p.x = -10; if (p.x < -10) p.x = W + 10;
      if (p.y > H + 10) p.y = -10; if (p.y < -10) p.y = H + 10;
    }
  }
  function draw() {
    if (!layer) return;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(layer, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const p of parts) {
      if (look === 0) { ctx.fillStyle = p.s > .6 ? 'rgba(255, 140, 190, .85)' : 'rgba(255, 255, 255, .9)'; ctx.beginPath(); ctx.ellipse(p.x, p.y, p.r * 1.6, p.r, p.ph, 0, TAU); ctx.fill(); }
      else if (look === 1) { ctx.fillStyle = `rgba(255, 230, 150, ${.35 + .35 * Math.sin(p.ph)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * .8, 0, TAU); ctx.fill(); }
      else if (look === 2) { ctx.strokeStyle = 'rgba(255, 255, 255, .6)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 1.6, 0, TAU); ctx.stroke(); }
      else if (look === 3) { ctx.fillStyle = 'rgba(255, 255, 255, .95)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
      else { const a = .5 + .5 * Math.sin(p.ph * 1.5); ctx.fillStyle = `rgba(255, 245, 190, ${a.toFixed(2)})`; const r = p.r * 1.4; ctx.beginPath(); ctx.moveTo(p.x, p.y - r * 2); ctx.lineTo(p.x + r * .5, p.y - r * .5); ctx.lineTo(p.x + r * 2, p.y); ctx.lineTo(p.x + r * .5, p.y + r * .5); ctx.lineTo(p.x, p.y + r * 2); ctx.lineTo(p.x - r * .5, p.y + r * .5); ctx.lineTo(p.x - r * 2, p.y); ctx.lineTo(p.x - r * .5, p.y - r * .5); ctx.fill(); }
    }
  }
  return { init, paint, setWorld, resize, update, draw };
})();

/* ---------- 9. Render ---------- */
const Render = (() => {
  let board, ctx, next, nctx, frame, bg = null, cell = 24, dpr = 1, shook = false;
  // Logical → screen mapping in cells: sx = a·x + c·y + e, sy = b·x + d·y + f.
  let view = { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
  const NEXT_W = 56, NEXT_H = 36;
  const CHROME = 34, FRAME_SHADOW = 12; // frame padding + borders, frame drop shadow

  function viewFor(S) {
    if (S.gravity === 'right') return { a: 0, b: -1, c: 1, d: 0, e: 0, f: S.cols }; // logical down → screen right
    if (S.gravity === 'left') return { a: 0, b: 1, c: -1, d: 0, e: S.rows, f: 0 };  // logical down → screen left
    return { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };
  }
  function init() {
    board = document.getElementById('board'); ctx = board.getContext('2d');
    next = document.getElementById('next'); nctx = next.getContext('2d');
    frame = document.getElementById('frame');
  }
  function resize() {
    const S = Game.state;
    view = viewFor(S);
    const sideways = S.gravity !== 'down';
    const sc = sideways ? S.rows : S.cols, sr = sideways ? S.cols : S.rows; // screen columns / rows
    const play = document.getElementById('play');
    const cs = getComputedStyle(play);
    const w = play.clientWidth - CHROME;
    const h = play.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - CHROME - FRAME_SHADOW;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cell = Math.max(10, Math.floor(Math.min(w / sc, h / sr)));
    const W = cell * sc, H = cell * sr;
    board.style.width = W + 'px'; board.style.height = H + 'px';
    board.width = Math.round(W * dpr); board.height = Math.round(H * dpr);
    next.width = Math.round(NEXT_W * dpr); next.height = Math.round(NEXT_H * dpr);
    Art.clear();
    // Pre-draw the empty board in the world's colors: gradient, soft checker,
    // dots, and an inner shadow on the side the pieces come from.
    const theme = WORLDS[Levels.world(S.level)];
    bg = document.createElement('canvas');
    bg.width = board.width; bg.height = board.height;
    const b = bg.getContext('2d');
    b.scale(dpr, dpr);
    const grad = b.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, theme.board[0]); grad.addColorStop(1, theme.board[1]);
    b.fillStyle = grad; b.fillRect(0, 0, W, H);
    b.fillStyle = 'rgba(255, 255, 255, .05)';
    for (let y = 0; y < sr; y++) for (let x = 0; x < sc; x++) if ((x + y) % 2) b.fillRect(x * cell, y * cell, cell, cell);
    b.fillStyle = 'rgba(255, 255, 255, .15)';
    for (let y = 1; y < sr; y++) for (let x = 1; x < sc; x++) {
      b.beginPath(); b.arc(x * cell, y * cell, Math.max(1, cell * .06), 0, Math.PI * 2); b.fill();
    }
    const entry = S.gravity === 'right' ? [0, 0, cell, 0] : S.gravity === 'left' ? [W, 0, W - cell, 0] : [0, 0, 0, cell];
    const sh = b.createLinearGradient(...entry);
    sh.addColorStop(0, 'rgba(16, 8, 40, .45)'); sh.addColorStop(1, 'rgba(16, 8, 40, 0)');
    b.fillStyle = sh; b.fillRect(0, 0, W, H);
    const vig = b.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
    vig.addColorStop(0, 'rgba(16, 8, 40, 0)'); vig.addColorStop(1, 'rgba(16, 8, 40, .4)');
    b.fillStyle = vig; b.fillRect(0, 0, W, H);
  }
  // Draw screen-upright content centered on logical cell (x, y), so shading
  // and shadows always fall the same way even on a turned board.
  function atCell(x, y, fn) {
    ctx.save();
    ctx.translate((x + .5) * cell, (y + .5) * cell);
    if (view.a !== 1) ctx.transform(view.a, view.c, view.b, view.d, 0, 0); // undo the board turn
    fn();
    ctx.restore();
  }
  function cellShadow(x, y) { // soft shadow under a tile
    atCell(x, y, () => {
      const r = cell * .26, px = -cell * .4, py = -cell * .34, s = cell * .9;
      ctx.fillStyle = 'rgba(16, 8, 40, .38)';
      ctx.beginPath(); ctx.moveTo(px + r, py);
      ctx.arcTo(px + s, py, px + s, py + s, r); ctx.arcTo(px + s, py + s, px, py + s, r);
      ctx.arcTo(px, py + s, px, py, r); ctx.arcTo(px, py, px + s, py, r);
      ctx.fill();
    });
  }
  function tile(c, x, y, mood) {
    if (Game.state.key) atCell(x, y, () => ctx.drawImage(Art.gem(c.t, cell), -cell / 2, -cell / 2, cell, cell));
    else Art.drawCell(ctx, c.t, c.r, c.lx, c.ly, x * cell, y * cell, cell, mood);
  }
  function drawPiece(p, y, alpha) {
    const cells = SHAPES[p.t][p.r].filter(([, ly]) => y + ly >= 0);
    ctx.globalAlpha = alpha;
    if (alpha === 1) for (const [lx, ly] of cells) cellShadow(p.x + lx, y + ly);
    for (const [lx, ly] of cells) tile({ t: p.t, r: p.r, lx, ly }, p.x + lx, y + ly);
    ctx.globalAlpha = 1;
  }
  function drawNext(S) {
    nctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    nctx.clearRect(0, 0, NEXT_W, NEXT_H);
    if (!S.next) return;
    if (!S.key) { Art.drawCentered(nctx, S.next, S.next === 'I' ? 13 : 16, NEXT_W, NEXT_H); return; }
    // Gems, turned the way the piece will appear on the sideways board.
    const pts = SHAPES[S.next][0].map(([x, y]) => [view.a * x + view.c * y, view.b * x + view.d * y]);
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const w = Math.max(...xs) - Math.min(...xs) + 1, h = Math.max(...ys) - Math.min(...ys) + 1;
    const s = Math.min(14, NEXT_W / w, NEXT_H / h);
    const ox = (NEXT_W - w * s) / 2, oy = (NEXT_H - h * s) / 2;
    for (const [x, y] of pts) nctx.drawImage(Art.gem(S.next, s), ox + (x - Math.min(...xs)) * s, oy + (y - Math.min(...ys)) * s, s, s);
  }
  function draw() {
    const S = Game.state;
    if (!bg || !S.board) return;
    const shaking = Effects.shaking();
    if (shaking || shook) { // a quick board shake for big clears
      frame.style.transform = shaking ? `translate(${(Math.random() * 5 - 2.5).toFixed(1)}px, ${(Math.random() * 5 - 2.5).toFixed(1)}px)` : '';
      shook = shaking;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(dpr * view.a, dpr * view.b, dpr * view.c, dpr * view.d, dpr * cell * view.e, dpr * cell * view.f);
    Effects.drawUnder(ctx, cell);
    const land = Effects.landing();
    const landed = (x, y) => land && land.set.has(y * S.cols + x);
    for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) {
      if (S.board[y][x] && !landed(x, y)) cellShadow(x, y);
    }
    for (let y = 0; y < S.rows; y++) for (let x = 0; x < S.cols; x++) {
      const c = S.board[y][x];
      if (c && !landed(x, y)) tile(c, x, y);
    }
    if (land) { // the piece that just landed: squash & bounce, happy face
      const sq = Effects.squash(), cells = [];
      for (const k of land.set) {
        const x = k % S.cols, y = (k - x) / S.cols;
        if (S.board[y][x]) cells.push([x, y, S.board[y][x]]);
      }
      ctx.save();
      if (sq) {
        const ax = land.cx * cell, ay = land.by * cell;
        ctx.translate(ax, ay); ctx.scale(sq.sx, sq.sy); ctx.translate(-ax, -ay);
      }
      for (const [x, y] of cells) cellShadow(x, y);
      for (const [x, y, c] of cells) tile(c, x, y, 'happy');
      ctx.restore();
    }
    if (S.piece) {
      drawPiece(S.piece, Game.ghostY(), .28);
      drawPiece(S.piece, S.piece.y, 1);
    }
    Effects.draw(ctx, cell);
    drawNext(S);
  }
  return { init, resize, draw, cellSize: () => cell, view: () => view };
})();

/* ---------- 10. Input ---------- */
// Gestures are turned into the logical frame first, so on sideways key levels
// "along the fall" and "across the fall" work exactly like down and left/right.
// Every player action is announced as Events 'input' { action, via } so the
// Phase 2 tutorial can watch which control mode the player succeeds with.
const Input = (() => {
  let g = null; // current gesture
  let modeOverride = null; // Phase 2: the tutorial may pick the mode for level 1
  const mode = () => modeOverride || Store.get().settings.control;
  const playing = () => Game.state.status === 'playing' && Game.state.piece;
  const act = (action, ok) => { if (ok !== false) Events.emit('input', { action, via: mode() }); return ok; };
  const toLogical = (sx, sy) => { const v = Render.view(); return [v.a * sx + v.b * sy, v.c * sx + v.d * sy]; };

  function onDown(e) {
    if (!playing() || g) return;
    if (e.target.closest('button, .overlay')) return; // HUD buttons keep working
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const now = performance.now(), [x, y] = toLogical(e.clientX, e.clientY);
    g = {
      id: e.pointerId, x0: x, y0: y, t0: now,
      col: 0, pieceId: Game.state.pieceId,
      moved: false, done: false, fast: false, refY: y, peakY: y,
      samples: [[x, y, now]],
    };
  }
  // A flick = a short, quick stroke mostly along the fall direction with the
  // finger still moving fast when it lifts. All four must hold, so a slow
  // swipe or a held finger (fast fall) never turns into an instant drop.
  function isFlick(gest, x, y) {
    const cell = Render.cellSize();
    const dx = x - gest.x0, dy = y - gest.y0, dt = performance.now() - gest.t0;
    if (dt > CONFIG.flick.maxTime) return false;
    if (dy < Math.max(CONFIG.flick.minPx, cell * CONFIG.flick.minCells)) return false;
    if (dy < Math.abs(dx) * 2) return false;
    const s = gest.samples, last = s[s.length - 1];
    let first = s[0];
    for (const smp of s) if (last[2] - smp[2] <= 80) { first = smp; break; }
    const v = last[2] > first[2] ? (last[1] - first[1]) / (last[2] - first[2]) : 0;
    return v >= CONFIG.flick.minSpeed;
  }
  function fastFall(on) {
    if (g.fast === on) return;
    g.fast = on;
    Game.setFastFall(on);
    if (on) act('fast-fall');
  }
  function onMove(e) {
    if (!g || e.pointerId !== g.id) return;
    e.preventDefault();
    if (g.done || !playing()) return;
    if (Game.state.pieceId !== g.pieceId) { g.done = true; return; } // a new piece arrived – finish this gesture
    const [x, y] = toLogical(e.clientX, e.clientY);
    const dx = x - g.x0, dy = y - g.y0;
    g.samples.push([x, y, performance.now()]);
    if (g.samples.length > 10) g.samples.shift();
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) g.moved = true;
    const cell = Render.cellSize();
    if (mode() === 'drag') dragMove(dx, y, cell); else swipeMove(dx, dy, cell);
  }
  // Free drag: the piece follows the finger across the fall direction cell by
  // cell, relative to where the finger started, and stops flush against walls
  // and other pieces. Moving the finger along the fall turns on fast fall (the
  // piece does not follow it); moving back or lifting returns to normal speed.
  function dragMove(dx, y, cell) {
    const col = Math.round(dx / cell);
    for (let i = col - g.col; i > 0 && Game.move(1, 0); i--) act('move');
    for (let i = col - g.col; i < 0 && Game.move(-1, 0); i++) act('move');
    g.col = col;
    const th = Math.max(24, cell * .8);
    if (!g.fast) {
      g.refY = Math.min(g.refY, y); // measure from the farthest-back point since the last stop
      if (y - g.refY > th) { g.peakY = y; fastFall(true); }
    } else {
      g.peakY = Math.max(g.peakY, y);
      if (g.peakY - y > th * .6) { g.refY = y; fastFall(false); }
    }
  }
  // Swipes: across the fall moves one column right away; along the fall =
  // fast fall for as long as the finger stays on the screen.
  function swipeMove(dx, dy, cell) {
    if (g.fast) return;
    const th = Math.max(24, cell * .8);
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax > ay && ax >= th) { g.done = true; act('move', Game.move(dx > 0 ? 1 : -1, 0)); }
    else if (ay > ax && dy >= th) fastFall(true);
  }
  function onUp(e) {
    if (!g || e.pointerId !== g.id) return;
    const gest = g; g = null;
    if (gest.fast) Game.setFastFall(false); // lifting the finger: back to normal speed
    if (gest.done || !playing() || Game.state.pieceId !== gest.pieceId) return;
    const [x, y] = toLogical(e.clientX, e.clientY);
    gest.samples.push([x, y, performance.now()]);
    if (!gest.moved && performance.now() - gest.t0 < 350) act('rotate', Game.rotate());
    else if (isFlick(gest, x, y)) act('hard-drop', Game.hardDrop());
  }
  function onCancel(e) {
    if (!g || e.pointerId !== g.id) return;
    if (g.fast) Game.setFastFall(false);
    g = null;
  }

  // Arrows follow the board: across the fall = move, toward the fall = fast
  // fall while held, against the fall = rotate. Space = instant drop.
  const KEY_VEC = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  function onKey(e) {
    if (UI.current !== 'game') return;
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { UI.togglePause(); e.preventDefault(); return; }
    if (!playing()) return;
    if (KEY_VEC[e.key]) {
      const [x, y] = toLogical(...KEY_VEC[e.key]);
      if (x) Game.move(x, 0);
      else if (y > 0) Game.setFastFall(true);
      else Game.rotate();
    } else if (e.key === 'x' || e.key === 'X') Game.rotate();
    else if (e.key === ' ') { if (!e.repeat) Game.hardDrop(); } // holding space never drops twice
    else return;
    e.preventDefault();
  }
  function onKeyUp(e) {
    if (KEY_VEC[e.key] && toLogical(...KEY_VEC[e.key])[1] > 0) Game.setFastFall(false);
  }
  function init() {
    const area = document.getElementById('game'); // the whole game screen is the touch area
    area.addEventListener('pointerdown', onDown);
    area.addEventListener('pointermove', onMove);
    area.addEventListener('pointerup', onUp);
    area.addEventListener('pointercancel', onCancel);
    area.addEventListener('touchmove', e => e.preventDefault(), { passive: false }); // stop iOS scroll/bounce
    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', onKeyUp);
  }
  return { init, setModeOverride: m => { modeOverride = m; } };
})();

/* ---------- 11. UI ---------- */
const UI = (() => {
  const $ = id => document.getElementById(id);
  const STAR_PATH = 'M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z';
  const star = on => `<svg class="star${on ? ' on' : ''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_PATH}"/><ellipse class="glint" cx="9.6" cy="9" rx="1.6" ry="1" transform="rotate(-35 9.6 9)"/></svg>`;
  const LOCK = '<svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  const KEY = '<svg class="key-ico" viewBox="0 0 48 48" aria-hidden="true"><path d="M21 21 39 39M32 32l4-4M37 37l4-4" fill="none" stroke="#2E2152" stroke-width="9" stroke-linecap="round"/><path d="M21 21 39 39M32 32l4-4M37 37l4-4" fill="none" stroke="url(#keyGold)" stroke-width="4" stroke-linecap="round"/><circle cx="15" cy="15" r="10" fill="url(#keyGold)" stroke="#2E2152" stroke-width="3.5"/><circle cx="15" cy="15" r="3.6" fill="#2E2152"/><ellipse cx="12" cy="11" rx="3" ry="1.6" fill="#fff" opacity=".8" transform="rotate(-35 12 11)"/></svg>';
  const ui = { current: null };

  function show(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === name));
    document.body.classList.toggle('in-game', name === 'game');
    ui.current = name;
    if (name === 'home') renderHome();
    if (name === 'map') renderMap();
    if (name === 'settings') renderSettings();
    if (name === 'game') requestAnimationFrame(() => { Scene.resize(); Render.resize(); Render.draw(); });
  }

  // ----- Home -----
  function renderHome() {
    const cast = $('cast');
    cast.innerHTML = '';
    const size = Math.max(18, Math.min(30, Math.floor(window.innerWidth / 15)));
    const tilts = [-6, 4, -3, 6, -5, 3, -2];
    TYPES.forEach((t, i) => {
      const fig = document.createElement('figure');
      fig.style.setProperty('--tilt', tilts[i] + 'deg');
      fig.appendChild(Art.pieceCanvas(t, size));
      const cap = document.createElement('figcaption');
      cap.textContent = PIECES[t].name;
      fig.appendChild(cap);
      cast.appendChild(fig);
    });
    const total = Store.totalStars(), high = Store.get().highScore;
    $('homeStars').innerHTML = total
      ? `${star(true)}<span>${total}</span><svg class="trophy" viewBox="0 0 24 24" aria-label="High score"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg><span>${high}</span>`
      : '';
  }

  // ----- Map -----
  // Five world sections, each with its own painted background and a banner.
  // Painted backgrounds are kept and reused while the width stays the same.
  const mapArt = new Map();
  function worldCanvas(w, W, H) {
    const k = `${w}@${W}x${H}`;
    if (!mapArt.has(k)) {
      const c = document.createElement('canvas');
      c.width = W; c.height = H;
      Scene.paint(c.getContext('2d'), w, W, H);
      c.className = 'world-bg';
      mapArt.set(k, c);
    }
    return mapArt.get(k);
  }
  function renderMap() {
    const data = Store.get();
    $('mapStars').innerHTML = `${star(true)}<span>${Store.totalStars()}</span>`;
    const wrap = $('mapPath');
    wrap.innerHTML = '';
    const W = Math.round(wrap.clientWidth || 360), gap = 100, BANNER = 120, per = CONFIG.worldSize;
    const secH = BANNER + per * gap;
    wrap.style.height = WORLDS.length * secH + 'px';

    WORLDS.forEach((wd, w) => {
      const c = worldCanvas(w, W, secH);
      c.style.top = w * secH + 'px';
      wrap.appendChild(c);
      if (!Levels.worldUnlocked(w)) { // a locked world is dimmed
        const veil = document.createElement('div');
        veil.className = 'world-veil';
        veil.style.top = w * secH + 'px'; veil.style.height = secH + 'px';
        wrap.appendChild(veil);
      }
    });

    const pts = [];
    for (let L = 1; L <= CONFIG.levelCount; L++) {
      const w = Levels.world(L), i = (L - 1) % per;
      pts.push([W / 2 + Math.sin(L * 1.15) * W * .27, w * secH + BANNER + i * gap + gap / 2]);
    }
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], my = (y0 + y1) / 2;
      d += ` C${x0},${my} ${x1},${my} ${x1},${y1}`;
    }
    wrap.insertAdjacentHTML('beforeend',
      `<svg class="road" viewBox="0 0 ${W} ${WORLDS.length * secH}" preserveAspectRatio="none" aria-hidden="true">
        <path d="${d}" fill="none" stroke="rgba(46,33,82,.25)" stroke-width="26" stroke-linecap="round"/>
        <path d="${d}" fill="none" stroke="#FFF7E3" stroke-width="9" stroke-dasharray="1 20" stroke-linecap="round"/>
      </svg>`);

    WORLDS.forEach((wd, w) => { // world banners: name and stars, or a lock with progress
      const open = Levels.worldUnlocked(w);
      const b = document.createElement('div');
      b.className = 'world-banner' + (open ? '' : ' locked');
      b.style.top = (w * secH + BANNER / 2) + 'px';
      if (open) {
        b.innerHTML = `<b>${wd.name}</b><span class="count">${star(true)}${Levels.worldStars(w)}/${per * 3}</span>`;
        b.setAttribute('aria-label', `${wd.name}, ${Levels.worldStars(w)} stars`);
      } else {
        const p = Levels.unlockProgress(w);
        b.innerHTML = `${LOCK}<b>${wd.name}</b><span class="count">${p.have}/${p.need}${star(true)}</span>`;
        b.setAttribute('aria-label', `${wd.name}, locked. ${p.have} of ${p.need} stars from the world before`);
      }
      wrap.appendChild(b);
    });

    let current = 0, scrollY = 0;
    for (let L = 1; L <= CONFIG.levelCount && !current; L++) if (Levels.unlocked(L) && !Levels.stars(L)) current = L;
    pts.forEach(([x, y], i) => {
      const level = i + 1, got = data.stars[level] || 0;
      const locked = !Levels.unlocked(level), key = Levels.isKey(level);
      const btn = document.createElement('button');
      btn.className = 'node' + (key ? ' key' : '') + (locked ? ' locked' : '') + (level === current ? ' current' : '');
      btn.style.left = x + 'px'; btn.style.top = y + 'px';
      const stars = got ? `<span class="mini">${star(got >= 1)}${star(got >= 2)}${star(got >= 3)}</span>` : '';
      const kind = key ? 'Key level' : 'Level';
      if (key) btn.innerHTML = KEY + `<span class="num">${level}</span>` + stars;
      else btn.innerHTML = (locked ? LOCK : `<span>${level}</span>`) + stars;
      if (locked) {
        btn.setAttribute('aria-label', `${kind} ${level}, locked`);
        btn.disabled = true;
      } else {
        btn.setAttribute('aria-label', `${kind} ${level}` + (got ? `, ${got} stars` : ''));
        btn.addEventListener('click', () => startLevel(level));
      }
      wrap.appendChild(btn);
      if (level === data.lastLevel) scrollY = y;
      if (level === current) { // a little panda waits next to the level to play
        const buddy = Art.pieceCanvas('O', 22);
        buddy.className = 'map-buddy';
        buddy.style.left = (x + (x > W / 2 ? -1 : 1) * 74) + 'px';
        buddy.style.top = y + 'px';
        wrap.appendChild(buddy);
      }
    });
    requestAnimationFrame(() => { // open the map where the player last played
      const sc = $('mapScroll');
      sc.scrollTop = scrollY - sc.clientHeight / 2;
    });
  }

  // ----- Settings -----
  function renderSettings() {
    const m = Store.get().settings.control;
    document.querySelectorAll('[data-control]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.control === m)));
    const r = $('resetBtn');
    r.classList.remove('armed');
    r.textContent = 'Erase all progress';
  }

  // ----- Game -----
  let lastLevel = 1, introTimer = 0;
  function applyWorld(w) {
    const f = WORLDS[w].frame, game = $('game');
    game.style.setProperty('--f1', f[0]); game.style.setProperty('--f2', f[1]); game.style.setProperty('--f3', f[2]);
    Scene.setWorld(w);
  }
  function startLevel(level) {
    if (!Levels.unlocked(level)) return;
    lastLevel = level;
    Store.setLastLevel(level);
    ['pauseOverlay', 'winOverlay', 'overOverlay'].forEach(id => { $(id).hidden = true; });
    show('game');
    applyWorld(Levels.world(level));
    Game.start(level);
    Render.resize();
    updateHud();
    showDirection();
  }
  // Key levels: a short arrow shows which way pieces fall; the game waits for it.
  function showDirection() {
    const S = Game.state, intro = $('dirIntro');
    clearTimeout(introTimer);
    if (!S.key) { intro.hidden = true; return; }
    intro.className = 'dir-intro ' + S.gravity;
    intro.hidden = false;
    intro.firstElementChild.style.animation = 'none';
    void intro.offsetWidth; // restart the CSS animation
    intro.firstElementChild.style.animation = '';
    Game.freeze(true);
    introTimer = setTimeout(() => { intro.hidden = true; Game.freeze(false); }, 1400);
  }
  function updateHud() {
    const S = Game.state;
    $('hudLevel').innerHTML = (S.key ? KEY : '') + S.level;
    $('hudLevelBox').classList.toggle('key', S.key);
    $('hudScore').textContent = S.score;
    const rows = $('rows');
    if (!rows.children.length) {
      for (let i = 0; i < CONFIG.rowsPerLevel; i++) {
        const pip = document.createElement('i');
        pip.style.setProperty('--c', PIECES[TYPES[i % TYPES.length]].color);
        rows.appendChild(pip);
      }
    }
    [...rows.children].forEach((pip, i) => pip.classList.toggle('on', i < S.lines));
    const what = S.key ? 'Columns' : 'Rows';
    rows.setAttribute('aria-label', `${what}: ${Math.min(S.lines, CONFIG.rowsPerLevel)} of ${CONFIG.rowsPerLevel}`);
  }
  function togglePause() {
    const S = Game.state;
    if (S.status === 'playing') { Game.pause(); $('pauseOverlay').hidden = false; }
    else if (S.status === 'paused') { Game.resume(); $('pauseOverlay').hidden = true; }
  }
  function onLevelComplete({ level, score, base }) {
    const got = Game.stars(base);
    Store.recordLevel(level, got, score);
    updateHud();
    $('winStars').innerHTML = star(got >= 1) + star(got >= 2) + star(got >= 3);
    $('winScore').textContent = score;
    const next = level + 1, nextOpen = next <= CONFIG.levelCount && Levels.unlocked(next);
    $('nextLevelBtn').hidden = !nextOpen;
    // At the end of a world whose next world is still locked: show the star progress.
    const lockNote = $('winLock');
    if (!nextOpen && next <= CONFIG.levelCount) {
      const p = Levels.unlockProgress(Levels.world(next));
      lockNote.innerHTML = `${LOCK}<span>${p.have}/${p.need}</span>${star(true)}`;
      lockNote.setAttribute('aria-label', `Next world locked: ${p.have} of ${p.need} stars`);
      lockNote.hidden = false;
    } else lockNote.hidden = true;
    setTimeout(() => { $('winOverlay').hidden = false; }, 350);
  }
  function onGameOver({ score }) {
    Store.recordScore(score);
    const buddy = $('overBuddy'); // a smiling animal, never a scary screen
    buddy.innerHTML = '';
    buddy.appendChild(Art.pieceCanvas('O', 52));
    setTimeout(() => { $('overOverlay').hidden = false; }, 350);
  }

  function init() {
    document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));
    document.querySelectorAll('[data-control]').forEach(b => b.addEventListener('click', () => {
      Store.setControl(b.dataset.control); renderSettings();
    }));
    $('resetBtn').addEventListener('click', e => {
      const btn = e.currentTarget;
      if (btn.classList.contains('armed')) { Store.reset(); btn.classList.remove('armed'); btn.textContent = 'Progress erased'; }
      else { btn.classList.add('armed'); btn.textContent = 'Sure? Tap again to erase'; }
    });
    $('pauseBtn').addEventListener('click', togglePause);
    $('resumeBtn').addEventListener('click', togglePause);
    $('pauseRestart').addEventListener('click', () => startLevel(lastLevel));
    $('pauseMap').addEventListener('click', () => { $('pauseOverlay').hidden = true; show('map'); });
    $('nextLevelBtn').addEventListener('click', () => startLevel(lastLevel + 1));
    $('winRetry').addEventListener('click', () => startLevel(lastLevel));
    $('winMap').addEventListener('click', () => { $('winOverlay').hidden = true; show('map'); });
    $('overRetry').addEventListener('click', () => startLevel(lastLevel));
    $('overMap').addEventListener('click', () => { $('overOverlay').hidden = true; show('map'); });

    Events.on('lines', updateHud);
    Events.on('levelComplete', onLevelComplete);
    Events.on('gameOver', onGameOver);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && Game.state.status === 'playing') togglePause();
    });
    window.addEventListener('resize', () => {
      if (ui.current === 'game') { Scene.resize(); Render.resize(); }
      else if (ui.current === 'map') renderMap();
      else if (ui.current === 'home') renderHome();
    });
  }
  return Object.assign(ui, { init, show, togglePause, startLevel });
})();

/* ---------- 12. Boot ---------- */
(function boot() {
  Scene.init();
  Render.init();
  Input.init();
  UI.init();
  UI.show('home');
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, now - last);
    last = now;
    if (UI.current === 'game') { Game.update(dt); Effects.update(dt); Scene.update(dt); Scene.draw(); Render.draw(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
