<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="בלוקי חיות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFD84D">
<title>בלוקי חיות</title>
<style>
/* =========================================================
   DESIGN TOKENS
   Sunny yellow page, deep plum "ink" for outlines & text,
   chunky glossy toy-like buttons and panels with depth.
   The animals bring the color.
   ========================================================= */
:root {
  --sun: #FFD84D;
  --sun-deep: #F2BE2A;
  --ink: #2E2152;
  --ink-soft: #5A4A8F;
  --board: #3A2C6B;
  --cream: #FFF7E3;
  --berry: #E8336D;
  --star: #FFB400;
  /* glossy surfaces: light top, deeper bottom */
  --gloss-cream: linear-gradient(180deg, #FFFFFF 0%, #FFF4D6 46%, #F5D994 100%);
  --gloss-berry: linear-gradient(180deg, #FF8DB2 0%, #F2477C 46%, #C91D57 100%);
  --gloss-plum: linear-gradient(180deg, #9A83EA 0%, #6D55C4 45%, #4B3896 100%);
  /* depth: top highlight, bottom inner shade, solid ink base, soft drop shadow */
  --depth: inset 0 3px 0 rgba(255, 255, 255, .85), inset 0 -5px 0 rgba(46, 33, 82, .16), 0 6px 0 var(--ink), 0 12px 18px rgba(46, 33, 82, .28);
  --depth-pressed: inset 0 3px 0 rgba(255, 255, 255, .6), inset 0 -2px 0 rgba(46, 33, 82, .16), 0 2px 0 var(--ink), 0 4px 8px rgba(46, 33, 82, .25);
  --font: "Rubik", "Varela Round", "Arial Rounded MT Bold", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed; inset: 0;
  background-color: var(--sun);
  background-image:
    radial-gradient(ellipse 90% 55% at 50% 0%, rgba(255, 250, 215, .9), rgba(255, 250, 215, 0) 70%),
    radial-gradient(ellipse 80% 50% at 50% 110%, rgba(242, 160, 40, .35), rgba(242, 160, 40, 0) 70%),
    radial-gradient(circle at 2px 2px, rgba(46, 33, 82, .07) 2px, transparent 2.6px);
  background-size: 100% 100%, 100% 100%, 24px 24px;
  color: var(--ink);
  font-family: var(--font);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

/* ---------- Screens ---------- */
.screen {
  position: absolute; inset: 0;
  max-width: 520px; margin: 0 auto;
  display: none; flex-direction: column;
  padding: calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 12px);
}
.screen.active { display: flex; }

/* ---------- Buttons ---------- */
.btn, .icon-btn {
  position: relative; overflow: hidden; isolation: isolate;
  background: var(--gloss-cream); color: var(--ink);
  border: 4px solid var(--ink);
  box-shadow: var(--depth);
  transition: transform .08s, box-shadow .08s;
}
/* the glossy shine across the top of every button */
.btn::before, .icon-btn::before {
  content: ""; position: absolute; left: 14%; right: 14%; top: 4px; height: 36%;
  border-radius: 999px; pointer-events: none; z-index: -1;
  background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0));
}
.btn:active, .icon-btn:active { transform: translateY(4px); box-shadow: var(--depth-pressed); }
.btn {
  font-weight: 900; font-size: 1.3rem; line-height: 1.1;
  border-radius: 999px; padding: .75em 1.5em; min-height: 58px;
}
.btn.primary { background: var(--gloss-berry); color: #fff; text-shadow: 0 2px 0 rgba(46, 33, 82, .45); }
.btn.primary::before { background: linear-gradient(180deg, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0)); }
.btn.big { font-size: 1.75rem; padding: .7em 2.4em; min-height: 70px; }
.btn.small { font-size: 1.05rem; padding: .6em 1.1em; min-height: 48px; }
.btn.quiet { background: transparent; box-shadow: none; border-style: dashed; border-width: 3px; font-size: 1rem; }
.btn.quiet::before { display: none; }
.btn.quiet:active { transform: none; }
.btn.quiet.armed { background: var(--gloss-berry); color: #fff; border-style: solid; }

.icon-btn {
  width: 54px; height: 54px; flex: none;
  display: grid; place-items: center;
  border-radius: 18px;
}
.icon-btn svg { position: relative; width: 26px; height: 26px; stroke: var(--ink); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Top bar (map / settings) ---------- */
.bar { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; }
.bar h2 { flex: 1; font-size: 1.6rem; font-weight: 900; }
.star-count { display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 1.15rem; }
.star-count svg { width: 26px; height: 26px; }

/* ---------- Stars ---------- */
.star path { fill: #F1E4C0; stroke: var(--ink); stroke-width: 1.7; stroke-linejoin: round; }
.star.on path { fill: url(#starGloss); }
.star .glint { fill: #fff; opacity: 0; }
.star.on .glint { opacity: .85; }

/* ---------- Home ---------- */
#home { align-items: center; justify-content: space-between; text-align: center; }
#home .settings-btn { align-self: flex-end; }
.title {
  display: flex; flex-direction: column; align-items: center;
  font-weight: 900; line-height: .9; letter-spacing: -.02em;
  color: var(--cream);
  -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
  text-shadow: 0 7px 0 var(--ink);
}
.title span:first-child { font-size: clamp(3.4rem, 19vw, 5.6rem); transform: rotate(-4deg); }
.title span:last-child { font-size: clamp(4rem, 23vw, 6.6rem); color: var(--berry); transform: rotate(3deg); margin-top: -.08em; }
.cast {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end;
  gap: 14px 18px; max-width: 360px;
}
.cast figure { display: flex; flex-direction: column; align-items: center; gap: 6px; transform: rotate(var(--tilt, 0deg)); }
.cast figcaption { font-weight: 800; font-size: .95rem; }
.cast canvas, .map-buddy, .buddy canvas { filter: drop-shadow(0 4px 2px rgba(46, 33, 82, .3)); }
.home-foot { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.home-stars { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1.05rem; min-height: 1.5em; }
.home-stars svg { width: 24px; height: 24px; }
.home-stars .trophy { margin-inline-start: 14px; fill: var(--star); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }

/* ---------- Map ---------- */
.map-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; touch-action: pan-y; }
.map-path { position: relative; width: 100%; }
.map-path svg.road { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node {
  position: absolute; transform: translate(-50%, -50%);
  width: 66px; height: 66px; border-radius: 50%;
  border: 4px solid var(--ink); background: var(--gloss-cream);
  box-shadow: var(--depth);
  font-weight: 900; font-size: 1.5rem;
}
.node:active { box-shadow: var(--depth-pressed); margin-top: 3px; }
.node.current { width: 80px; height: 80px; font-size: 1.9rem; background: var(--gloss-berry); color: #fff; text-shadow: 0 2px 0 rgba(46, 33, 82, .45); animation: hop 1.4s ease-in-out infinite; }
.node.locked { background: linear-gradient(180deg, #FBEFC4, #EBD38A); color: rgba(46, 33, 82, .4); border-color: rgba(46, 33, 82, .35); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .6), 0 5px 0 rgba(46, 33, 82, .2); }
.node .mini { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); display: flex; gap: 1px; margin-top: 6px; }
.node .mini svg { width: 18px; height: 18px; }
.node .lock { width: 22px; height: 22px; stroke: currentColor; stroke-width: 3; fill: none; }
.map-buddy { position: absolute; pointer-events: none; transform: translate(-50%, -50%) rotate(-8deg); }
@keyframes hop { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }

/* ---------- Settings ---------- */
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.option {
  position: relative; aspect-ratio: 1;
  background: var(--gloss-cream); border: 4px solid var(--ink); border-radius: 30px;
  padding: 12px; box-shadow: var(--depth);
}
.option[aria-checked="true"] { outline: 5px solid var(--berry); outline-offset: 4px; }
.option svg { width: 100%; height: 100%; display: block; }
.option .tick { position: absolute; top: -12px; inset-inline-start: -12px; width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--ink); background: var(--cream); display: grid; place-items: center; }
.option[aria-checked="true"] .tick { background: var(--berry); }
.option[aria-checked="true"] .tick::after { content: ""; width: 12px; height: 7px; border: solid #fff; border-width: 0 0 4px 4px; transform: translateY(-2px) rotate(-45deg); }
.hand-outline { fill: var(--ink); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
.hand-fill { fill: var(--cream); }
.settings-foot { margin-top: auto; display: flex; justify-content: center; padding-top: 20px; }

/* ---------- Game ---------- */
#game { padding-left: 10px; padding-right: 10px; touch-action: none; }
/* Top bar: solid game panels with a plum name tab on top */
.hud { display: flex; align-items: stretch; gap: 8px; height: 64px; flex: none; margin-top: 8px; }
.hud-box {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--gloss-cream); border: 4px solid var(--ink); border-radius: 18px;
  box-shadow: var(--depth);
  padding: 6px 12px 2px; min-width: 64px;
}
.hud-box.grow { flex: 1; }
.hud-label {
  position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
  background: var(--gloss-plum); color: #fff; border: 2.5px solid var(--ink); border-radius: 999px;
  font-size: .72rem; font-weight: 900; line-height: 1; padding: 3px 9px; white-space: nowrap;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35);
}
.hud-box b {
  font-size: 1.65rem; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums;
  color: var(--ink); text-shadow: 0 2px 0 rgba(255, 255, 255, .9);
}
.hud-box.next { padding: 8px 8px 2px; }
#next { width: 56px; height: 36px; display: block; }
.hud .icon-btn { height: 64px; width: 56px; }
.play {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  padding: 12px 0 14px; touch-action: none;
}
/* Board frame: a chunky plum toy frame with golden bolts in the corners */
.frame {
  position: relative; padding: 10px; border-radius: 28px;
  border: 4px solid var(--ink);
  background:
    radial-gradient(circle at 11px 11px, #FFE780 2.5px, #C98A00 3.5px, var(--ink) 4.5px, transparent 5px),
    radial-gradient(circle at calc(100% - 11px) 11px, #FFE780 2.5px, #C98A00 3.5px, var(--ink) 4.5px, transparent 5px),
    radial-gradient(circle at 11px calc(100% - 11px), #FFE780 2.5px, #C98A00 3.5px, var(--ink) 4.5px, transparent 5px),
    radial-gradient(circle at calc(100% - 11px) calc(100% - 11px), #FFE780 2.5px, #C98A00 3.5px, var(--ink) 4.5px, transparent 5px),
    var(--gloss-plum);
  box-shadow: inset 0 4px 0 rgba(255, 255, 255, .4), inset 0 -6px 0 rgba(20, 10, 50, .25), 0 7px 0 var(--ink), 0 14px 24px rgba(46, 33, 82, .35);
}
#board {
  display: block; border: 3px solid var(--ink); border-radius: 16px; background: #3A2C6B;
}
.rows { display: flex; justify-content: center; gap: 6px; flex: none; height: 24px; direction: ltr; }
.rows i {
  width: 22px; height: 22px; border-radius: 8px; border: 3px solid var(--ink);
  background: linear-gradient(180deg, #F3E6C2, #E2CD92);
  box-shadow: inset 0 2px 3px rgba(46, 33, 82, .25);
}
.rows i.on {
  background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, .15)), var(--c);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6), 0 2px 0 var(--ink);
}

/* ---------- Overlays ---------- */
.overlay {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  background: rgba(46, 33, 82, .55); padding: 20px;
}
.overlay[hidden] { display: none; }
.panel {
  width: 100%; max-width: 360px; text-align: center;
  background: var(--gloss-cream); border: 4px solid var(--ink); border-radius: 32px;
  box-shadow: inset 0 4px 0 #fff, inset 0 -6px 0 rgba(46, 33, 82, .12), 0 8px 0 var(--ink), 0 18px 30px rgba(20, 10, 50, .35);
  padding: 26px 22px 28px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.panel h2 { font-size: 2.1rem; font-weight: 900; line-height: 1.1; }
.panel p { font-size: 1.1rem; font-weight: 700; line-height: 1.4; }
.panel .hint { font-size: .98rem; font-weight: 600; color: var(--ink-soft); }
.panel .btn { width: 100%; }
.panel .row { display: flex; gap: 10px; width: 100%; }
.panel .row .btn { flex: 1; }
.big-stars { display: flex; gap: 6px; align-items: flex-end; }
.big-stars svg { width: 76px; height: 76px; }
.big-stars svg:nth-child(2) { width: 92px; height: 92px; }
.panel .panel-score { font-size: 1.6rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.btn.icon-only { display: grid; place-items: center; padding: .5em; }
.ico { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.big .ico { width: 40px; height: 40px; }
.ico.fill { fill: currentColor; stroke: none; }
.buddy { margin-top: -70px; transform: rotate(-6deg); }

/* Portrait only: on a phone held sideways, ask to turn it */
.turn-phone { display: none; }
@media (orientation: landscape) and (max-height: 500px) {
  .turn-phone { display: grid; place-items: center; position: fixed; inset: 0; z-index: 50; background: var(--sun); }
  .turn-phone svg { width: 120px; height: 120px; }
}

@media (prefers-reduced-motion: reduce) {
  .node.current { animation: none; }
  .btn, .icon-btn { transition: none; }
}
</style>
</head>
<body>

<!-- Shared icon shapes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hand" viewBox="0 0 40 48">
    <rect x="12" y="2" width="10" height="28" rx="5"/>
    <rect x="6" y="20" width="28" height="26" rx="10"/>
    <circle cx="27" cy="23" r="5"/>
    <circle cx="33" cy="27" r="4.5"/>
    <ellipse cx="7" cy="31" rx="4.5" ry="8" transform="rotate(-28 7 31)"/>
  </symbol>
  <linearGradient id="starGloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE780"/><stop offset=".5" stop-color="#FFC21A"/><stop offset="1" stop-color="#F08C00"/>
  </linearGradient>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4v4h4"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5 9 4l6 2.5L20.5 4v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol>
</svg>

<!-- Shown only when a phone is held sideways -->
<div class="turn-phone" aria-label="סובבו את הטלפון">
  <svg viewBox="0 0 96 96" aria-hidden="true">
    <rect x="30" y="12" width="36" height="64" rx="8" fill="#FFF7E3" stroke="#2E2152" stroke-width="4"/>
    <circle cx="48" cy="66" r="3" fill="#2E2152"/>
    <path d="M14 56a34 34 0 0 1 6-30m-6 1 6-1 1 6" fill="none" stroke="#2E2152" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<!-- ============ HOME ============ -->
<section class="screen" id="home">
  <button class="icon-btn settings-btn" data-go="settings" aria-label="הגדרות">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></svg>
  </button>
  <h1 class="title"><span>בלוקי</span><span>חיות</span></h1>
  <div class="cast" id="cast"></div>
  <div class="home-foot">
    <p class="home-stars" id="homeStars"></p>
    <button class="btn primary big" data-go="map">לשחק</button>
  </div>
</section>

<!-- ============ MAP ============ -->
<section class="screen" id="map">
  <header class="bar">
    <button class="icon-btn" data-go="home" aria-label="חזרה">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <h2>מפת השלבים</h2>
    <span class="star-count" id="mapStars"></span>
  </header>
  <div class="map-scroll" id="mapScroll"><div class="map-path" id="mapPath"></div></div>
</section>

<!-- ============ SETTINGS ============ -->
<section class="screen" id="settings">
  <header class="bar">
    <button class="icon-btn" data-go="home" aria-label="חזרה">
      <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <h2>הגדרות</h2>
  </header>
  <div class="choice" role="radiogroup" aria-label="איך מזיזים את החיות">
    <!-- Mode 1: dragging hand -->
    <button class="option" role="radio" data-control="drag" aria-label="גרירה חופשית">
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <rect x="3" y="3" width="90" height="90" rx="24" fill="#43C46E"/>
        <path d="M12 58h24M60 58h24" fill="none" stroke="#FFF7E3" stroke-width="5" stroke-dasharray="0.5 9" stroke-linecap="round"/>
        <rect x="44" y="12" width="24" height="24" rx="7" fill="#FFB33C" stroke="#2E2152" stroke-width="3"/>
        <circle cx="52" cy="22" r="2.4" fill="#2E2152"/><circle cx="60" cy="22" r="2.4" fill="#2E2152"/>
        <use href="#hand" x="36" y="32" width="40" height="48" class="hand-outline"/>
        <use href="#hand" x="36" y="32" width="40" height="48" class="hand-fill"/>
      </svg>
      <i class="tick" aria-hidden="true"></i>
    </button>
    <!-- Mode 2: swiping hand -->
    <button class="option" role="radio" data-control="swipe" aria-label="החלקות">
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <rect x="3" y="3" width="90" height="90" rx="24" fill="#4C8DF6"/>
        <path d="M36 26H14m7-7-7 7 7 7M60 26h22m-7-7 7 7-7 7" fill="none" stroke="#FFF7E3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M22 50h10M18 60h12M20 70h8" fill="none" stroke="#FFF7E3" stroke-width="4" stroke-linecap="round" opacity=".7"/>
        <use href="#hand" x="30" y="30" width="40" height="48" class="hand-outline" transform="rotate(-14 50 54)"/>
        <use href="#hand" x="30" y="30" width="40" height="48" class="hand-fill" transform="rotate(-14 50 54)"/>
      </svg>
      <i class="tick" aria-hidden="true"></i>
    </button>
  </div>
  <div class="settings-foot">
    <button class="btn quiet" id="resetBtn">למחוק את כל ההתקדמות</button>
  </div>
</section>

<!-- ============ GAME ============ -->
<section class="screen" id="game">
  <header class="hud">
    <button class="icon-btn" id="pauseBtn" aria-label="הפסקה">
      <svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg>
    </button>
    <div class="hud-box"><span class="hud-label">שלב</span><b id="hudLevel">1</b></div>
    <div class="hud-box grow"><span class="hud-label">ניקוד</span><b id="hudScore">0</b></div>
    <div class="hud-box next"><span class="hud-label">הבא</span><canvas id="next"></canvas></div>
  </header>
  <div class="play" id="play"><div class="frame" id="frame"><canvas id="board"></canvas></div></div>
  <div class="rows" id="rows" role="img" aria-label="שורות שנוקו"></div>

  <div class="overlay" id="pauseOverlay" hidden>
    <div class="panel">
      <h2>הפסקה</h2>
      <button class="btn primary big icon-only" id="resumeBtn" aria-label="להמשיך">
        <svg viewBox="0 0 24 24" class="ico fill"><path d="M8 5.5v13l10.5-6.5z"/></svg>
      </button>
      <div class="row">
        <button class="btn icon-only" id="pauseRestart" aria-label="מההתחלה"><svg viewBox="0 0 24 24" class="ico"><use href="#i-retry"/></svg></button>
        <button class="btn icon-only" id="pauseMap" aria-label="למפה"><svg viewBox="0 0 24 24" class="ico"><use href="#i-map"/></svg></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="winOverlay" hidden>
    <div class="panel">
      <h2>כל הכבוד!</h2>
      <div class="big-stars" id="winStars"></div>
      <p class="panel-score"><span id="winScore">0</span></p>
      <button class="btn primary big" id="nextLevelBtn">לשלב הבא</button>
      <div class="row">
        <button class="btn icon-only" id="winRetry" aria-label="לשחק שוב"><svg viewBox="0 0 24 24" class="ico"><use href="#i-retry"/></svg></button>
        <button class="btn icon-only" id="winMap" aria-label="למפה"><svg viewBox="0 0 24 24" class="ico"><use href="#i-map"/></svg></button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overOverlay" hidden>
    <div class="panel">
      <div class="buddy" id="overBuddy"></div>
      <h2>אופס! ננסה שוב?</h2>
      <button class="btn primary big icon-only" id="overRetry" aria-label="ננסה שוב"><svg viewBox="0 0 24 24" class="ico"><use href="#i-retry"/></svg></button>
      <button class="btn icon-only" id="overMap" aria-label="למפה"><svg viewBox="0 0 24 24" class="ico"><use href="#i-map"/></svg></button>
    </div>
  </div>
</section>

<script>
'use strict';
/* =========================================================
   ANIMAL BLOCKS — Phase 1
   Sections:
     1. CONFIG     – all game numbers in one place
     2. Events     – tiny event bus (hooks for Phase 2: sounds,
                     effects, tutorial can listen without touching
                     game logic)
     3. Store      – progress & settings saved on the device
     4. Pieces     – the 7 animal shapes + rotation
     5. Art        – drawing the animals on canvas
     6. Game       – pure game rules (board, falling, scoring)
     7. Effects    – landing squash, dust, row flash, particles
     8. Render     – draws the board and next preview
     9. Input      – touch (drag / swipe) and keyboard
    10. UI         – screens, map, overlays, settings
    11. Boot       – main loop

   Phase 2 tutorial plugs in through: Game.freeze(on), Game.pause(),
   Input.setModeOverride(mode) and the 'spawn' / 'input' / 'lines'
   events. Effects, sounds and animal unlocking listen to the same events.
   ========================================================= */

/* ---------- 1. CONFIG ---------- */
const CONFIG = {
  cols: 10,
  rows: 20,
  rowsPerLevel: 10,
  levelCount: 50,
  baseInterval: 1000,       // ms per step at level 1 (1 step/sec)
  speedFactor: 0.95,        // each level is 5% faster
  minInterval: 100,         // cap: 10 steps/sec
  lineScores: [0, 100, 300, 500, 800], // × level number
  softDropInterval: 40,     // ms per step after a slow swipe down
  clearDelay: 180,          // ms full rows flash before they disappear
  lockDelay: 500,           // ms a landed animal waits before locking
  maxLockResets: 15,
  // Stars: level points divided by the level number.
  // Finishing = 1 star; clearing several rows together earns more.
  starThresholds: { two: 1200, three: 1600 },
};

/* ---------- 2. Events ---------- */
const Events = {
  handlers: {},
  on(name, fn) { (this.handlers[name] = this.handlers[name] || []).push(fn); },
  emit(name, data) { (this.handlers[name] || []).forEach(fn => fn(data)); },
};

/* ---------- 3. Store ---------- */
const Store = (() => {
  const KEY = 'animalBlocks.v1';
  const defaults = () => ({ unlocked: 1, lastLevel: 1, highScore: 0, stars: {}, best: {}, settings: { control: 'drag' } });
  let data = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw), def = defaults();
        return { ...def, ...d, settings: { ...def.settings, ...(d.settings || {}) } };
      }
    } catch (e) { /* storage unavailable – play without saving */ }
    return defaults();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
  }
  return {
    get: () => data,
    totalStars: () => Object.values(data.stars).reduce((a, b) => a + b, 0),
    recordLevel(level, stars, score) {
      if (stars > (data.stars[level] || 0)) data.stars[level] = stars;
      if (score > (data.best[level] || 0)) data.best[level] = score;
      data.highScore = Math.max(data.highScore, score);
      data.unlocked = Math.max(data.unlocked, Math.min(level + 1, CONFIG.levelCount));
      save();
    },
    recordScore(score) { if (score > data.highScore) { data.highScore = score; save(); } },
    setLastLevel(level) { data.lastLevel = level; save(); },
    setControl(mode) { data.settings.control = mode; save(); },
    reset() { const control = data.settings.control; data = defaults(); data.settings.control = control; save(); },
  };
})();

/* ---------- 4. Pieces ---------- */
// Cells are [x, y] inside an n×n box, in the base (spawn) orientation.
const PIECES = {
  I: { n: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]], name: 'נחש', color: '#43C46E' },
  O: { n: 2, cells: [[0, 0], [1, 0], [0, 1], [1, 1]], name: 'פנדה', color: '#FFD3E0' },
  T: { n: 3, cells: [[1, 0], [0, 1], [1, 1], [2, 1]], name: 'צב', color: '#2CC7BE' },
  L: { n: 3, cells: [[2, 0], [0, 1], [1, 1], [2, 1]], name: 'ג׳ירפה', color: '#FFB33C' },
  J: { n: 3, cells: [[0, 0], [0, 1], [1, 1], [2, 1]], name: 'פיל', color: '#5B9BF8' },
  S: { n: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]], name: 'זחל', color: '#A8DE3C' },
  Z: { n: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]], name: 'סרטן', color: '#F7646A' },
};
const TYPES = Object.keys(PIECES);

// SHAPES[type][rotation] = cells after rotating clockwise `rotation` times.
const SHAPES = {};
for (const t of TYPES) {
  const { n, cells } = PIECES[t];
  SHAPES[t] = [cells];
  for (let r = 1; r < 4; r++) SHAPES[t].push(SHAPES[t][r - 1].map(([x, y]) => [n - 1 - y, x]));
}

/* ---------- 5. Art ---------- */
const Art = (() => {
  const INK = '#2E2152';
  const cache = new Map();

  // drawing helpers (units = cells)
  const circle = (g, x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); };
  const ell = (g, x, y, rx, ry, rot = 0) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); };
  const fill = (g, c) => { g.fillStyle = c; g.fill(); };
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  // Mix a hex color with white (amt > 0) or black (amt < 0).
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16), to = amt > 0 ? 255 : 0, a = Math.abs(amt);
    const ch = s => Math.round(((n >> s) & 255) * (1 - a) + to * a);
    return `rgb(${ch(16)}, ${ch(8)}, ${ch(0)})`;
  }
  // A point of the rotated piece, in the upright (unrotated) frame.
  const toBase = (g, base, x, y) => base.inverse().transformPoint(g.getTransform().transformPoint(new DOMPoint(x, y)));

  // Glossy body tiles: light always comes from the top, whatever the rotation.
  function tiles(g, base, t, color) {
    const light = shade(color, .5), dark = shade(color, -.2);
    for (const [x, y] of PIECES[t].cells) {
      const c = toBase(g, base, x + .5, y + .5);
      rr(g, x + .05, y + .05, .9, .9, .26);
      g.save(); g.setTransform(base);
      const gr = g.createLinearGradient(0, c.y - .45, 0, c.y + .45);
      gr.addColorStop(0, light); gr.addColorStop(.42, color); gr.addColorStop(1, dark);
      g.fillStyle = gr; g.fill();
      g.lineWidth = .08; g.strokeStyle = INK; g.stroke();
      g.restore();
    }
  }
  // Shine on top of every tile, drawn last.
  function shine(g, base, t) {
    for (const [x, y] of PIECES[t].cells) {
      const c = toBase(g, base, x + .5, y + .5);
      g.save(); g.setTransform(base);
      rr(g, c.x - .28, c.y - .39, .5, .12, .06); fill(g, 'rgba(255, 255, 255, .6)');
      circle(g, c.x + .3, c.y - .33, .045); g.fill();
      g.restore();
    }
  }
  // Draws `fn` at (x, y) of the rotated piece, but keeps it upright so faces never go upside down.
  function upright(g, base, x, y, fn) {
    const q = toBase(g, base, x, y);
    g.save(); g.setTransform(base); g.translate(q.x, q.y); fn(); g.restore();
  }
  let MOOD = ''; // '' or 'happy' (just landed: closed smiling eyes)
  // Big cute eyes, rosy cheeks, smile. Origin = face center, k = size.
  function face(g, k = 1, opt = {}) {
    const ex = .19 * k, ey = -.06 * k, er = .15 * k;
    g.lineWidth = .035 * k; g.strokeStyle = INK;
    if (MOOD === 'happy') {
      g.lineWidth = .055 * k; g.lineCap = 'round';
      for (const s of [-1, 1]) { g.beginPath(); g.arc(s * ex, ey + .06 * k, er * .7, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke(); }
    } else {
      for (const s of [-1, 1]) {
        circle(g, s * ex, ey, er); fill(g, '#fff'); g.stroke();
        circle(g, s * ex + .015 * k, ey + .025 * k, er * .62); fill(g, INK);
        circle(g, s * ex + .05 * k, ey - .025 * k, er * .25); fill(g, '#fff');
      }
    }
    g.fillStyle = 'rgba(255, 92, 138, .55)';
    ell(g, -.34 * k, .13 * k, .08 * k, .05 * k); g.fill();
    ell(g, .34 * k, .13 * k, .08 * k, .05 * k); g.fill();
    g.lineCap = 'round'; g.lineWidth = .045 * k; g.strokeStyle = INK;
    if (MOOD === 'happy') { // big open smile
      g.beginPath(); g.arc(0, .08 * k, .1 * k, 0, Math.PI); g.closePath(); fill(g, INK);
      ell(g, 0, .15 * k, .05 * k, .025 * k); fill(g, '#FF7AA2');
      return;
    }
    g.beginPath(); g.arc(0, .1 * k, .07 * k, .2 * Math.PI, .8 * Math.PI); g.stroke();
    if (opt.tongue) {
      g.strokeStyle = '#E8336D'; g.lineWidth = .04 * k; g.beginPath();
      g.moveTo(0, .18 * k); g.lineTo(0, .3 * k);
      g.moveTo(0, .3 * k); g.lineTo(-.05 * k, .36 * k);
      g.moveTo(0, .3 * k); g.lineTo(.05 * k, .36 * k); g.stroke();
    }
  }

  // One function per animal, drawn in its base orientation.
  const DRAW = {
    I(g, base) { // Snake
      tiles(g, base, 'I', '#43C46E');
      for (let i = 0; i < 3; i++) {
        ell(g, i + .5, 1.5, .17, .17, Math.PI / 4); fill(g, '#FFE066');
        circle(g, i + .2, 1.25, .05); fill(g, '#23884A');
        circle(g, i + .8, 1.75, .05); fill(g, '#23884A');
      }
      upright(g, base, 3.5, 1.47, () => face(g, .95, { tongue: true }));
    },
    O(g, base) { // Panda (never rotates)
      tiles(g, base, 'O', '#FFD3E0');
      circle(g, .42, .4, .24); fill(g, INK);
      circle(g, 1.58, .4, .24); fill(g, INK);
      ell(g, 1, 1.05, .8, .72); fill(g, '#fff'); g.lineWidth = .06; g.strokeStyle = INK; g.stroke();
      ell(g, .68, .98, .2, .25, .5); fill(g, INK);
      ell(g, 1.32, .98, .2, .25, -.5); fill(g, INK);
      for (const x of [.7, 1.3]) {
        if (MOOD === 'happy') {
          g.strokeStyle = '#fff'; g.lineWidth = .055; g.lineCap = 'round';
          g.beginPath(); g.arc(x, 1.02, .08, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke();
          continue;
        }
        circle(g, x, .96, .1); fill(g, '#fff');
        circle(g, x + .01, .98, .06); fill(g, INK);
        circle(g, x + .03, .94, .025); fill(g, '#fff');
      }
      ell(g, 1, 1.22, .1, .07); fill(g, INK);
      g.lineWidth = .05; g.lineCap = 'round'; g.beginPath();
      g.moveTo(1, 1.28); g.quadraticCurveTo(.93, 1.4, .86, 1.33);
      g.moveTo(1, 1.28); g.quadraticCurveTo(1.07, 1.4, 1.14, 1.33); g.stroke();
      g.fillStyle = 'rgba(255, 92, 138, .5)';
      ell(g, .48, 1.28, .1, .06); g.fill(); ell(g, 1.52, 1.28, .1, .06); g.fill();
    },
    T(g, base) { // Turtle
      tiles(g, base, 'T', '#2CC7BE');
      for (const [x, y, r] of [[.3, 1.24, -.5], [2.7, 1.24, .5], [.3, 1.78, .5], [2.7, 1.78, -.5]]) {
        ell(g, x, y, .17, .11, r); fill(g, '#9BEDE5');
      }
      ell(g, 1.5, 1.5, 1.02, .38); fill(g, '#8CCB4E'); g.lineWidth = .06; g.strokeStyle = '#3F7F22'; g.stroke();
      for (const x of [.95, 1.5, 2.05]) { ell(g, x, 1.5, .19, .15); fill(g, '#B9E383'); }
      upright(g, base, 1.5, .52, () => face(g, .9));
    },
    L(g, base) { // Giraffe
      tiles(g, base, 'L', '#FFB33C');
      g.fillStyle = '#A65E1C';
      for (const [x, y, r] of [[.38, 1.32, .13], [.72, 1.7, .1], [1.28, 1.38, .15], [1.72, 1.72, .1], [2.3, 1.6, .13], [2.75, 1.28, .08], [2.28, .9, .07]]) {
        ell(g, x, y, r, r * .85, .6); g.fill();
      }
      g.strokeStyle = '#A65E1C'; g.lineWidth = .06; g.lineCap = 'round';
      g.beginPath(); g.moveTo(.15, 1.3); g.lineTo(.13, 1.56); g.stroke();
      circle(g, .13, 1.62, .06); g.fill();
      upright(g, base, 2.5, .56, () => {
        g.strokeStyle = '#A65E1C'; g.lineWidth = .06; g.lineCap = 'round'; g.beginPath();
        g.moveTo(-.13, -.24); g.lineTo(-.16, -.36); g.moveTo(.13, -.24); g.lineTo(.16, -.36); g.stroke();
        g.fillStyle = '#A65E1C'; circle(g, -.16, -.37, .055); g.fill(); circle(g, .16, -.37, .055); g.fill();
        face(g, .8);
      });
    },
    J(g, base) { // Elephant
      tiles(g, base, 'J', '#5B9BF8');
      for (const x of [.5, 1.5, 2.5]) { ell(g, x, 1.87, .13, .06); fill(g, '#E9F2FF'); }
      g.strokeStyle = '#2F6BD0'; g.lineWidth = .06; g.lineCap = 'round';
      g.beginPath(); g.moveTo(2.86, 1.35); g.quadraticCurveTo(2.93, 1.5, 2.86, 1.62); g.stroke();
      const trunk = () => { g.beginPath(); g.moveTo(.45, .7); g.quadraticCurveTo(.47, 1.25, .3, 1.42); g.quadraticCurveTo(.18, 1.53, .27, 1.63); };
      g.lineWidth = .22; g.strokeStyle = '#2F6BD0'; trunk(); g.stroke();
      g.lineWidth = .13; g.strokeStyle = '#5B9BF8'; trunk(); g.stroke();
      ell(g, .8, .46, .16, .26); fill(g, '#A9CBFF'); g.lineWidth = .05; g.strokeStyle = '#2F6BD0'; g.stroke();
      upright(g, base, .42, .42, () => face(g, .75));
    },
    S(g, base) { // Caterpillar
      tiles(g, base, 'S', '#A8DE3C');
      for (const [x, y] of [[1, 0], [0, 1], [1, 1]]) {
        circle(g, x + .5, y + .5, .26); fill(g, '#C9F07C');
        circle(g, x + .5, y + .5, .08); fill(g, '#FF9F43');
        circle(g, x + .3, y + .87, .045); fill(g, INK);
        circle(g, x + .7, y + .87, .045); fill(g, INK);
      }
      upright(g, base, 2.5, .57, () => {
        g.strokeStyle = INK; g.lineWidth = .04; g.lineCap = 'round'; g.beginPath();
        g.moveTo(-.1, -.25); g.quadraticCurveTo(-.15, -.35, -.22, -.38);
        g.moveTo(.1, -.25); g.quadraticCurveTo(.15, -.35, .22, -.38); g.stroke();
        circle(g, -.22, -.38, .05); fill(g, '#E8336D'); circle(g, .22, -.38, .05); fill(g, '#E8336D');
        face(g, .8);
      });
    },
    Z(g, base) { // Crab
      tiles(g, base, 'Z', '#F7646A');
      const claw = (x, y, a) => {
        circle(g, x, y, .28); fill(g, '#D93C45');
        g.beginPath(); g.moveTo(x, y); g.arc(x, y, .31, a - .5, a + .5); g.closePath(); fill(g, '#F7646A');
      };
      claw(.45, .5, Math.PI); claw(2.55, 1.5, 0);
      for (const [x, y, r] of [[1.35, 1.4, .07], [1.65, 1.56, .06], [1.42, 1.72, .05]]) { circle(g, x, y, r); fill(g, '#FFA3A7'); }
      upright(g, base, 1.5, .58, () => {
        g.strokeStyle = INK; g.lineWidth = .04; g.lineCap = 'round'; g.beginPath();
        g.moveTo(-.19, -.18); g.lineTo(-.2, -.32); g.moveTo(.19, -.18); g.lineTo(.2, -.32); g.stroke();
        face(g, .85);
      });
    },
  };

  function render(t, r, size, dpr, mood) {
    const n = PIECES[t].n;
    const c = document.createElement('canvas');
    c.width = c.height = Math.max(1, Math.round(n * size * dpr));
    const g = c.getContext('2d');
    const k = c.width / n;
    g.scale(k, k);
    const base = g.getTransform();
    g.translate(n / 2, n / 2); g.rotate(r * Math.PI / 2); g.translate(-n / 2, -n / 2);
    g.beginPath();
    for (const [x, y] of PIECES[t].cells) g.rect(x, y, 1, 1);
    g.clip();
    MOOD = mood;
    DRAW[t](g, base);
    MOOD = '';
    shine(g, base, t);
    return c;
  }
  function get(t, r, size, mood = '') {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const key = `${t}${r}@${size}x${dpr}${mood}`;
    let c = cache.get(key);
    if (!c) { c = render(t, r, size, dpr, mood); cache.set(key, c); }
    return c;
  }
  // Draw one cell (lx, ly) of a piece image at canvas position (px, py).
  function drawCell(ctx, t, r, lx, ly, px, py, size, mood) {
    const c = get(t, r, size, mood), d = c.width / PIECES[t].n;
    ctx.drawImage(c, lx * d, ly * d, d, d, px, py, size, size);
  }
  function bounds(t) {
    const xs = PIECES[t].cells.map(c => c[0]), ys = PIECES[t].cells.map(c => c[1]);
    return { x: Math.min(...xs), y: Math.min(...ys), w: Math.max(...xs) - Math.min(...xs) + 1, h: Math.max(...ys) - Math.min(...ys) + 1 };
  }
  // Draw a whole piece (spawn orientation) centered in a W×H area.
  function drawCentered(ctx, t, size, W, H) {
    const c = get(t, 0, size), d = c.width / PIECES[t].n, b = bounds(t);
    const w = b.w * size, h = b.h * size;
    ctx.drawImage(c, b.x * d, b.y * d, b.w * d, b.h * d, (W - w) / 2, (H - h) / 2, w, h);
  }
  // A standalone canvas element with the piece, for menus.
  function pieceCanvas(t, size) {
    const b = bounds(t), dpr = Math.min(window.devicePixelRatio || 1, 3);
    const el = document.createElement('canvas');
    el.width = Math.round(b.w * size * dpr); el.height = Math.round(b.h * size * dpr);
    el.style.width = b.w * size + 'px'; el.style.height = b.h * size + 'px';
    const ctx = el.getContext('2d'); ctx.scale(dpr, dpr);
    drawCentered(ctx, t, size, b.w * size, b.h * size);
    return el;
  }
  return { get, drawCell, drawCentered, pieceCanvas, clear: () => cache.clear() };
})();

/* ---------- 6. Game ---------- */
const Game = (() => {
  const S = {
    board: null, piece: null, next: null, bag: [], pieceId: 0,
    level: 1, score: 0, lines: 0, interval: 1000,
    fallT: 0, lockT: 0, lockResets: 0, status: 'idle', // idle | playing | paused | won | over
    clearing: null, // { rows, t } while full rows flash before clearing
    soft: false,   // soft drop active for the current animal
    frozen: false, // Phase 2 tutorial: stops falling while still accepting input
  };
  const KICKS = [[0, 0], [-1, 0], [1, 0], [0, -1], [-2, 0], [2, 0], [-1, -1], [1, -1]];

  const emptyBoard = () => Array.from({ length: CONFIG.rows }, () => Array(CONFIG.cols).fill(null));
  const intervalFor = level => Math.max(CONFIG.minInterval, CONFIG.baseInterval * Math.pow(CONFIG.speedFactor, level - 1));

  function fromBag() { // "7-bag": every animal appears once before any repeats
    if (!S.bag.length) {
      S.bag = TYPES.slice();
      for (let i = S.bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [S.bag[i], S.bag[j]] = [S.bag[j], S.bag[i]];
      }
    }
    return S.bag.pop();
  }
  function collides(t, r, x, y) {
    for (const [cx, cy] of SHAPES[t][r]) {
      const bx = x + cx, by = y + cy;
      if (bx < 0 || bx >= CONFIG.cols || by >= CONFIG.rows) return true;
      if (by >= 0 && S.board[by][bx]) return true;
    }
    return false;
  }
  function spawn() {
    const t = S.next;
    S.next = fromBag();
    const minY = Math.min(...SHAPES[t][0].map(c => c[1]));
    S.piece = { t, r: 0, x: Math.floor((CONFIG.cols - PIECES[t].n) / 2), y: -minY };
    S.pieceId++;
    S.fallT = 0; S.lockT = 0; S.lockResets = 0; S.soft = false;
    if (collides(t, 0, S.piece.x, S.piece.y)) { end('over'); return; }
    Events.emit('spawn', { type: t, next: S.next });
  }
  function start(level) {
    Object.assign(S, {
      board: emptyBoard(), bag: [], level, score: 0, lines: 0,
      interval: intervalFor(level), status: 'playing', frozen: false, clearing: null,
    });
    S.next = fromBag();
    Events.emit('start', { level });
    spawn();
  }
  const grounded = () => collides(S.piece.t, S.piece.r, S.piece.x, S.piece.y + 1);
  function afterShift() { // moving/rotating on the ground buys a bit more time
    if (grounded() && S.lockResets < CONFIG.maxLockResets) { S.lockT = 0; S.lockResets++; }
  }
  function move(dx, dy) {
    if (S.status !== 'playing' || !S.piece) return false;
    const p = S.piece;
    if (collides(p.t, p.r, p.x + dx, p.y + dy)) return false;
    p.x += dx; p.y += dy;
    if (dy > 0) S.fallT = 0; else afterShift();
    Events.emit('move', { dx, dy });
    return true;
  }
  function rotate() {
    if (S.status !== 'playing' || !S.piece || S.piece.t === 'O') return false;
    const p = S.piece, nr = (p.r + 1) % 4;
    for (const [kx, ky] of KICKS) {
      if (!collides(p.t, nr, p.x + kx, p.y + ky)) {
        p.x += kx; p.y += ky; p.r = nr;
        afterShift();
        Events.emit('rotate', {});
        return true;
      }
    }
    return false;
  }
  function ghostY() {
    const p = S.piece;
    let y = p.y;
    while (!collides(p.t, p.r, p.x, y + 1)) y++;
    return y;
  }
  function hardDrop() {
    if (S.status !== 'playing' || !S.piece) return;
    const y = ghostY(), distance = y - S.piece.y;
    S.piece.y = y;
    Events.emit('hardDrop', { distance });
    lock();
  }
  function lock() {
    const p = S.piece;
    let toppedOut = false;
    const cells = [];
    for (const [lx, ly] of SHAPES[p.t][p.r]) {
      const bx = p.x + lx, by = p.y + ly;
      if (by < 0) { toppedOut = true; continue; }
      S.board[by][bx] = { t: p.t, r: p.r, lx, ly };
      cells.push([bx, by]);
    }
    S.piece = null;
    Events.emit('lock', { type: p.t, cells });
    if (toppedOut) { end('over'); return; }
    const rows = [];
    for (let y = 0; y < CONFIG.rows; y++) if (S.board[y].every(Boolean)) rows.push(y);
    if (rows.length) { // full rows flash briefly, then clear (see update)
      S.clearing = { rows, t: 0 };
      Events.emit('rowsFull', { rows });
      return;
    }
    spawn();
  }
  function finishClear() {
    const { rows } = S.clearing;
    S.clearing = null;
    for (const y of rows) { // rows are sorted top to bottom
      S.board.splice(y, 1);
      S.board.unshift(Array(CONFIG.cols).fill(null));
    }
    S.score += CONFIG.lineScores[rows.length] * S.level;
    S.lines += rows.length;
    Events.emit('lines', { count: rows.length, total: S.lines, score: S.score });
    if (S.lines >= CONFIG.rowsPerLevel) { end('won'); return; }
    spawn();
  }
  function end(result) {
    S.status = result;
    S.piece = null;
    Events.emit(result === 'won' ? 'levelComplete' : 'gameOver', { level: S.level, score: S.score, lines: S.lines });
  }
  function update(dt) {
    if (S.status !== 'playing' || S.frozen) return;
    if (S.clearing) {
      S.clearing.t += dt;
      if (S.clearing.t >= CONFIG.clearDelay) finishClear();
      return;
    }
    if (!S.piece) return;
    if (grounded()) {
      S.lockT += dt;
      if (S.lockT >= CONFIG.lockDelay) lock();
    } else {
      S.lockT = 0;
      S.fallT += dt;
      const interval = S.soft ? Math.min(S.interval, CONFIG.softDropInterval) : S.interval;
      if (S.fallT >= interval) { S.fallT = 0; S.piece.y++; }
    }
  }
  function softDrop() { if (S.status === 'playing' && S.piece) S.soft = true; }
  function freeze(on) { S.frozen = !!on; }
  function pause() { if (S.status === 'playing') { S.status = 'paused'; return true; } return false; }
  function resume() { if (S.status === 'paused') S.status = 'playing'; }
  function stars(score, level) {
    const per = score / level;
    return per >= CONFIG.starThresholds.three ? 3 : per >= CONFIG.starThresholds.two ? 2 : 1;
  }
  return { state: S, start, move, rotate, hardDrop, softDrop, freeze, ghostY, update, pause, resume, stars };
})();

/* ---------- 7. Effects ---------- */
// Short (under half a second) visual effects. They only listen to game
// events and never change the rules, so the game never waits for them.
const Effects = (() => {
  const parts = [];
  let landing = null, flash = null, shake = 0;
  const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const rand = (a, b) => a + Math.random() * (b - a);
  const key = (x, y) => y * CONFIG.cols + x;
  const MAX_PARTS = 260;
  const add = p => { if (parts.length < MAX_PARTS) parts.push({ life: 0, g: 0, spin: 0, rot: 0, ...p }); };

  function onLock({ cells }) {
    if (!cells.length) return;
    const set = new Set(cells.map(([x, y]) => key(x, y)));
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    landing = { set, t: 0, cx: (Math.min(...xs) + Math.max(...xs) + 1) / 2, by: Math.max(...ys) + 1 };
    for (const [x, y] of cells) { // a puff of dust from under the animal
      if (set.has(key(x, y + 1))) continue;
      for (let i = 0; i < 3; i++) {
        add({ kind: 'dust', x: x + .5 + rand(-.35, .35), y: y + .95, vx: rand(-1.8, 1.8), vy: rand(-1.4, -.4), max: rand(260, 380), size: rand(.13, .22) });
      }
    }
    for (let i = 0; i < 2; i++) { // and a couple of sparkles
      const [x, y] = cells[Math.floor(Math.random() * cells.length)];
      add({ kind: 'spark', x: x + rand(.1, .9), y: y + rand(.1, .5), vx: rand(-.8, .8), vy: rand(-2.2, -1.2), max: rand(300, 420), size: rand(.16, .24), color: '#FFF3A0' });
    }
  }
  function onRowsFull({ rows }) { // more rows at once = more, faster particles
    const n = rows.length, board = Game.state.board;
    const per = 1 + n, power = 1 + n * .35;
    flash = { rows, t: 0 };
    for (const y of rows) for (let x = 0; x < CONFIG.cols; x++) {
      const c = board[y][x], color = c ? PIECES[c.t].color : '#fff';
      for (let i = 0; i < per; i++) {
        const spark = Math.random() < .3;
        add({
          kind: spark ? 'spark' : 'bit', x: x + .5, y: y + .5,
          vx: rand(-3, 3) * power, vy: rand(-6, -1.5) * (1 + n * .15), g: 16, spin: rand(-8, 8),
          max: rand(360, 480), size: rand(.14, .24) * (1 + n * .08), color: spark ? '#FFF3A0' : color,
        });
      }
    }
    if (n >= 2 && !reduced) shake = 120 + n * 40;
  }
  function reset() { parts.length = 0; landing = null; flash = null; shake = 0; }

  function update(dt) {
    if (landing && (landing.t += dt) > 420) landing = null;
    if (flash && (flash.t += dt) > CONFIG.clearDelay) flash = null;
    shake = Math.max(0, shake - dt);
    const s = dt / 1000;
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life += dt;
      if (p.life >= p.max) { parts.splice(i, 1); continue; }
      p.vy += p.g * s; p.x += p.vx * s; p.y += p.vy * s; p.rot += p.spin * s;
      if (p.kind === 'dust') { p.vx *= .92; p.vy *= .92; }
    }
  }
  // Squash on impact, then a small stretch back up.
  function squash() {
    if (!landing || reduced) return null;
    const p = landing.t / 230;
    if (p >= 1) return null;
    const a = p < .4 ? .2 * Math.sin(Math.PI * p / .4) : -.07 * Math.sin(Math.PI * (p - .4) / .6);
    return { sx: 1 + a * .7, sy: 1 - a };
  }
  function starPath(ctx, r) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * Math.PI / 4, rad = i % 2 ? r * .38 : r;
      ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
  }
  function draw(ctx, cell) {
    if (flash) {
      const q = flash.t / CONFIG.clearDelay;
      ctx.fillStyle = `rgba(255, 255, 255, ${(.85 * Math.abs(Math.sin(q * Math.PI * 2))).toFixed(3)})`;
      for (const y of flash.rows) ctx.fillRect(0, y * cell, CONFIG.cols * cell, cell);
    }
    for (const p of parts) {
      const q = p.life / p.max, r = p.size * cell;
      ctx.save();
      ctx.translate(p.x * cell, p.y * cell); ctx.rotate(p.rot);
      if (p.kind === 'dust') {
        ctx.globalAlpha = .8 * (1 - q); ctx.fillStyle = '#FFF7E3';
        ctx.beginPath(); ctx.arc(0, 0, r * (1 + q), 0, Math.PI * 2); ctx.fill();
      } else if (p.kind === 'spark') {
        ctx.globalAlpha = 1 - q * q; ctx.fillStyle = p.color;
        starPath(ctx, r * (1.2 - q * .5)); ctx.fill();
      } else {
        ctx.globalAlpha = q > .7 ? (1 - q) / .3 : 1;
        ctx.fillStyle = p.color; ctx.strokeStyle = '#2E2152'; ctx.lineWidth = Math.max(1, r * .28);
        ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = 'rgba(255, 255, 255, .6)';
        ctx.beginPath(); ctx.arc(-r * .3, -r * .3, r * .3, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }
  Events.on('lock', onLock);
  Events.on('rowsFull', onRowsFull);
  Events.on('lines', () => { landing = null; }); // rows moved – the landed animal may be gone
  Events.on('start', reset);
  return { update, draw, squash, landing: () => landing, shaking: () => shake > 0 };
})();

/* ---------- 8. Render ---------- */
const Render = (() => {
  let board, ctx, next, nctx, frame, bg = null, cell = 24, dpr = 1, shook = false;
  const NEXT_W = 56, NEXT_H = 36;
  const CHROME = 34, FRAME_SHADOW = 12; // frame padding + borders, frame drop shadow

  function init() {
    board = document.getElementById('board'); ctx = board.getContext('2d');
    next = document.getElementById('next'); nctx = next.getContext('2d');
    frame = document.getElementById('frame');
  }
  function resize() {
    const play = document.getElementById('play');
    const cs = getComputedStyle(play);
    const w = play.clientWidth - CHROME;
    const h = play.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - CHROME - FRAME_SHADOW;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cell = Math.max(10, Math.floor(Math.min(w / CONFIG.cols, h / CONFIG.rows)));
    const W = cell * CONFIG.cols, H = cell * CONFIG.rows;
    board.style.width = W + 'px'; board.style.height = H + 'px';
    board.width = Math.round(W * dpr); board.height = Math.round(H * dpr);
    next.width = Math.round(NEXT_W * dpr); next.height = Math.round(NEXT_H * dpr);
    Art.clear();
    // Pre-draw the empty board: deep gradient, soft checker, dots, inner shadow.
    bg = document.createElement('canvas');
    bg.width = board.width; bg.height = board.height;
    const b = bg.getContext('2d');
    b.scale(dpr, dpr);
    const grad = b.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#4D3C92'); grad.addColorStop(1, '#2B2058');
    b.fillStyle = grad; b.fillRect(0, 0, W, H);
    b.fillStyle = 'rgba(255, 255, 255, .04)';
    for (let y = 0; y < CONFIG.rows; y++) for (let x = 0; x < CONFIG.cols; x++) {
      if ((x + y) % 2) b.fillRect(x * cell, y * cell, cell, cell);
    }
    b.fillStyle = 'rgba(255, 255, 255, .14)';
    for (let y = 1; y < CONFIG.rows; y++) for (let x = 1; x < CONFIG.cols; x++) {
      b.beginPath(); b.arc(x * cell, y * cell, Math.max(1, cell * .06), 0, Math.PI * 2); b.fill();
    }
    const top = b.createLinearGradient(0, 0, 0, cell);
    top.addColorStop(0, 'rgba(16, 8, 40, .45)'); top.addColorStop(1, 'rgba(16, 8, 40, 0)');
    b.fillStyle = top; b.fillRect(0, 0, W, cell);
    const vig = b.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
    vig.addColorStop(0, 'rgba(16, 8, 40, 0)'); vig.addColorStop(1, 'rgba(16, 8, 40, .4)');
    b.fillStyle = vig; b.fillRect(0, 0, W, H);
  }
  function cellShadow(x, y) { // soft shadow under an animal tile
    const r = cell * .26, px = (x + .1) * cell, py = (y + .16) * cell, s = cell * .9;
    ctx.fillStyle = 'rgba(16, 8, 40, .38)';
    ctx.beginPath(); ctx.moveTo(px + r, py);
    ctx.arcTo(px + s, py, px + s, py + s, r); ctx.arcTo(px + s, py + s, px, py + s, r);
    ctx.arcTo(px, py + s, px, py, r); ctx.arcTo(px, py, px + s, py, r);
    ctx.fill();
  }
  function drawPiece(p, y, alpha) {
    const cells = SHAPES[p.t][p.r].filter(([, ly]) => y + ly >= 0);
    ctx.globalAlpha = alpha;
    if (alpha === 1) for (const [lx, ly] of cells) cellShadow(p.x + lx, y + ly);
    for (const [lx, ly] of cells) Art.drawCell(ctx, p.t, p.r, lx, ly, (p.x + lx) * cell, (y + ly) * cell, cell);
    ctx.globalAlpha = 1;
  }
  function draw() {
    const S = Game.state;
    if (!bg || !S.board) return;
    const shaking = Effects.shaking();
    if (shaking || shook) { // a quick board shake for big clears
      frame.style.transform = shaking ? `translate(${(Math.random() * 5 - 2.5).toFixed(1)}px, ${(Math.random() * 5 - 2.5).toFixed(1)}px)` : '';
      shook = shaking;
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const land = Effects.landing();
    const landed = (x, y) => land && land.set.has(y * CONFIG.cols + x);
    for (let y = 0; y < CONFIG.rows; y++) for (let x = 0; x < CONFIG.cols; x++) {
      if (S.board[y][x] && !landed(x, y)) cellShadow(x, y);
    }
    for (let y = 0; y < CONFIG.rows; y++) for (let x = 0; x < CONFIG.cols; x++) {
      const c = S.board[y][x];
      if (c && !landed(x, y)) Art.drawCell(ctx, c.t, c.r, c.lx, c.ly, x * cell, y * cell, cell);
    }
    if (land) { // the animal that just landed: squash & bounce, happy face
      const sq = Effects.squash(), cells = [];
      for (const k of land.set) {
        const x = k % CONFIG.cols, y = (k - x) / CONFIG.cols;
        if (S.board[y][x]) cells.push([x, y, S.board[y][x]]);
      }
      ctx.save();
      if (sq) {
        const ax = land.cx * cell, ay = land.by * cell;
        ctx.translate(ax, ay); ctx.scale(sq.sx, sq.sy); ctx.translate(-ax, -ay);
      }
      for (const [x, y] of cells) cellShadow(x, y);
      for (const [x, y, c] of cells) Art.drawCell(ctx, c.t, c.r, c.lx, c.ly, x * cell, y * cell, cell, 'happy');
      ctx.restore();
    }
    if (S.piece) {
      drawPiece(S.piece, Game.ghostY(), .28);
      drawPiece(S.piece, S.piece.y, 1);
    }
    Effects.draw(ctx, cell);
    nctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    nctx.clearRect(0, 0, NEXT_W, NEXT_H);
    if (S.next) {
      const size = S.next === 'I' ? 13 : 16;
      Art.drawCentered(nctx, S.next, size, NEXT_W, NEXT_H);
    }
  }
  return { init, resize, draw, cellSize: () => cell };
})();

/* ---------- 9. Input ---------- */
// Every player action is announced as Events 'input' { action, via } so the
// Phase 2 tutorial can watch which control mode the player succeeds with.
const Input = (() => {
  let g = null; // current gesture
  let modeOverride = null; // Phase 2: the tutorial may pick the mode for level 1
  const mode = () => modeOverride || Store.get().settings.control;
  const playing = () => Game.state.status === 'playing' && Game.state.piece;
  const act = (action, ok) => { if (ok !== false) Events.emit('input', { action, via: mode() }); return ok; };

  function onDown(e) {
    if (!playing() || g) return;
    if (e.target.closest('button, .overlay')) return; // HUD buttons keep working
    e.preventDefault();
    try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    const now = performance.now();
    g = {
      id: e.pointerId, x0: e.clientX, y0: e.clientY, t0: now,
      col: 0, pieceId: Game.state.pieceId,
      moved: false, done: false, down: false, samples: [[e.clientY, now]],
    };
  }
  function onMove(e) {
    if (!g || e.pointerId !== g.id) return;
    e.preventDefault();
    if (g.done || !playing()) return;
    if (Game.state.pieceId !== g.pieceId) { g.done = true; return; } // a new animal arrived – finish this gesture
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0, now = performance.now();
    g.samples.push([e.clientY, now]);
    if (g.samples.length > 8) g.samples.shift();
    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) g.moved = true;
    const cell = Render.cellSize();
    if (mode() === 'drag') dragMove(dx, dy, cell); else swipeMove(dx, dy, cell);
  }
  // Free drag: the animal follows the finger left/right cell by cell, relative
  // to where the finger started, and stops flush against walls/animals.
  // Moving the finger down does nothing – the animal falls on its own.
  function dragMove(dx, dy, cell) {
    const col = Math.round(dx / cell);
    for (let i = col - g.col; i > 0 && Game.move(1, 0); i--) act('move');
    for (let i = col - g.col; i < 0 && Game.move(-1, 0); i++) act('move');
    g.col = col;
  }
  // Swipes: sideways moves one column right away; down is decided on release
  // (slow = soft drop, fast = hard drop).
  function swipeMove(dx, dy, cell) {
    const th = Math.max(24, cell * .8);
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax > ay && ax >= th) { g.done = true; act('move', Game.move(dx > 0 ? 1 : -1, 0)); }
    else if (ay > ax && dy >= th) g.down = true;
  }
  function velocityY(gest) { // px per ms over the last ~100ms
    const s = gest.samples, last = s[s.length - 1];
    let first = s[0];
    for (const smp of s) if (last[1] - smp[1] <= 100) { first = smp; break; }
    const dt = last[1] - first[1];
    return dt > 0 ? (last[0] - first[0]) / dt : 0;
  }
  function onUp(e) {
    if (!g || e.pointerId !== g.id) return;
    const gest = g; g = null;
    if (gest.done || !playing() || Game.state.pieceId !== gest.pieceId) return;
    if (!gest.moved && performance.now() - gest.t0 < 350) { act('rotate', Game.rotate()); return; }
    if (mode() === 'swipe' && gest.down) {
      if (velocityY(gest) > 1.1) { Game.hardDrop(); act('hard-drop'); }
      else { Game.softDrop(); act('soft-drop'); }
    }
    // Drag mode: when the finger lifts, the animal keeps falling at the normal pace.
  }
  function onCancel(e) { if (g && e.pointerId === g.id) g = null; }

  function onKey(e) {
    if (UI.current !== 'game') return;
    if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { UI.togglePause(); e.preventDefault(); return; }
    if (!playing()) return;
    switch (e.key) {
      case 'ArrowLeft': Game.move(-1, 0); break;
      case 'ArrowRight': Game.move(1, 0); break;
      case 'ArrowDown': Game.move(0, 1); break;
      case 'ArrowUp': case 'x': case 'X': Game.rotate(); break;
      case ' ': Game.hardDrop(); break;
      default: return;
    }
    e.preventDefault();
  }
  function init() {
    const area = document.getElementById('game'); // the whole game screen is the touch area
    area.addEventListener('pointerdown', onDown);
    area.addEventListener('pointermove', onMove);
    area.addEventListener('pointerup', onUp);
    area.addEventListener('pointercancel', onCancel);
    area.addEventListener('touchmove', e => e.preventDefault(), { passive: false }); // stop iOS scroll/bounce
    window.addEventListener('keydown', onKey);
  }
  return { init, setModeOverride: m => { modeOverride = m; } };
})();

/* ---------- 10. UI ---------- */
const UI = (() => {
  const $ = id => document.getElementById(id);
  const STAR_PATH = 'M12 2.6l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.5l-5.9 3.1 1.2-6.5-4.8-4.6 6.6-.9z';
  const star = on => `<svg class="star${on ? ' on' : ''}" viewBox="0 0 24 24" aria-hidden="true"><path d="${STAR_PATH}"/><ellipse class="glint" cx="9.6" cy="9" rx="1.6" ry="1" transform="rotate(-35 9.6 9)"/></svg>`;
  const ui = { current: null };

  function show(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === name));
    ui.current = name;
    if (name === 'home') renderHome();
    if (name === 'map') renderMap();
    if (name === 'settings') renderSettings();
    if (name === 'game') requestAnimationFrame(() => { Render.resize(); Render.draw(); });
  }

  // ----- Home -----
  function renderHome() {
    const cast = $('cast');
    cast.innerHTML = '';
    const size = Math.max(18, Math.min(30, Math.floor(window.innerWidth / 15)));
    const tilts = [-6, 4, -3, 6, -5, 3, -2];
    TYPES.forEach((t, i) => {
      const fig = document.createElement('figure');
      fig.style.setProperty('--tilt', tilts[i] + 'deg');
      fig.appendChild(Art.pieceCanvas(t, size));
      const cap = document.createElement('figcaption');
      cap.textContent = PIECES[t].name;
      fig.appendChild(cap);
      cast.appendChild(fig);
    });
    const total = Store.totalStars(), high = Store.get().highScore;
    $('homeStars').innerHTML = total
      ? `${star(true)}<span>${total}</span><svg class="trophy" viewBox="0 0 24 24" aria-label="שיא"><path d="M7 4h10v5a5 5 0 0 1-10 0zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 20h8"/></svg><span>${high}</span>`
      : '';
  }

  // ----- Map -----
  function renderMap() {
    const data = Store.get();
    $('mapStars').innerHTML = `${star(true)}<span>${Store.totalStars()}</span>`;
    const wrap = $('mapPath');
    wrap.innerHTML = '';
    const N = CONFIG.levelCount, gap = 104, top = 70;
    const W = wrap.clientWidth || 360;
    const pts = [];
    for (let i = 0; i < N; i++) pts.push([W / 2 + Math.sin(i * 1.15) * W * .27, top + i * gap]);
    const H = top * 2 + (N - 1) * gap;
    wrap.style.height = H + 'px';

    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < N; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], my = (y0 + y1) / 2;
      d += ` C${x0},${my} ${x1},${my} ${x1},${y1}`;
    }
    wrap.insertAdjacentHTML('beforeend',
      `<svg class="road" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        <path d="${d}" fill="none" stroke="rgba(46,33,82,.14)" stroke-width="26" stroke-linecap="round"/>
        <path d="${d}" fill="none" stroke="#FFF7E3" stroke-width="9" stroke-dasharray="1 20" stroke-linecap="round"/>
      </svg>`);

    let currentNode = null, scrollY = 0;
    pts.forEach(([x, y], i) => {
      const level = i + 1;
      const got = data.stars[level] || 0;
      const locked = level > data.unlocked;
      const isCurrent = level === data.unlocked && !got;
      const btn = document.createElement('button');
      btn.className = 'node' + (locked ? ' locked' : '') + (isCurrent ? ' current' : '');
      btn.style.left = x + 'px'; btn.style.top = y + 'px';
      if (locked) {
        btn.innerHTML = `<svg class="lock" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`;
        btn.setAttribute('aria-label', `שלב ${level} נעול`);
        btn.disabled = true;
      } else {
        btn.innerHTML = `<span>${level}</span>` + (got ? `<span class="mini">${star(got >= 1)}${star(got >= 2)}${star(got >= 3)}</span>` : '');
        btn.setAttribute('aria-label', `שלב ${level}` + (got ? `, ${got} כוכבים` : ''));
        btn.addEventListener('click', () => startLevel(level));
      }
      wrap.appendChild(btn);
      if (level === data.unlocked) currentNode = { btn, x, y };
      if (level === data.lastLevel) scrollY = y;
    });
    requestAnimationFrame(() => { // open the map where the player last played
      const sc = $('mapScroll');
      sc.scrollTop = scrollY - sc.clientHeight / 2;
    });

    if (currentNode) { // a little panda waits next to the level to play
      const buddy = Art.pieceCanvas('O', 22);
      buddy.className = 'map-buddy';
      const side = currentNode.x > W / 2 ? -1 : 1;
      buddy.style.left = (currentNode.x + side * 72) + 'px';
      buddy.style.top = currentNode.y + 'px';
      wrap.appendChild(buddy);
    }
  }

  // ----- Settings -----
  function renderSettings() {
    const m = Store.get().settings.control;
    document.querySelectorAll('[data-control]').forEach(b => b.setAttribute('aria-checked', String(b.dataset.control === m)));
    const r = $('resetBtn');
    r.classList.remove('armed');
    r.textContent = 'למחוק את כל ההתקדמות';
  }

  // ----- Game -----
  let lastLevel = 1;
  function startLevel(level) {
    lastLevel = level;
    Store.setLastLevel(level);
    ['pauseOverlay', 'winOverlay', 'overOverlay'].forEach(id => { $(id).hidden = true; });
    show('game');
    Game.start(level);
    updateHud();
  }
  function updateHud() {
    const S = Game.state;
    $('hudLevel').textContent = S.level;
    $('hudScore').textContent = S.score;
    const rows = $('rows');
    if (!rows.children.length) {
      for (let i = 0; i < CONFIG.rowsPerLevel; i++) {
        const pip = document.createElement('i');
        pip.style.setProperty('--c', PIECES[TYPES[i % TYPES.length]].color);
        rows.appendChild(pip);
      }
    }
    [...rows.children].forEach((pip, i) => pip.classList.toggle('on', i < S.lines));
    rows.setAttribute('aria-label', `שורות: ${Math.min(S.lines, CONFIG.rowsPerLevel)} מתוך ${CONFIG.rowsPerLevel}`);
  }
  function togglePause() {
    const S = Game.state;
    if (S.status === 'playing') { Game.pause(); $('pauseOverlay').hidden = false; }
    else if (S.status === 'paused') { Game.resume(); $('pauseOverlay').hidden = true; }
  }
  function onLevelComplete({ level, score }) {
    const got = Game.stars(score, level);
    Store.recordLevel(level, got, score);
    updateHud();
    $('winStars').innerHTML = star(got >= 1) + star(got >= 2) + star(got >= 3);
    $('winScore').textContent = score;
    $('nextLevelBtn').hidden = level >= CONFIG.levelCount;
    setTimeout(() => { $('winOverlay').hidden = false; }, 350);
  }
  function onGameOver({ score }) {
    Store.recordScore(score);
    const buddy = $('overBuddy'); // a smiling animal, never a scary screen
    buddy.innerHTML = '';
    buddy.appendChild(Art.pieceCanvas('O', 52));
    setTimeout(() => { $('overOverlay').hidden = false; }, 350);
  }

  function init() {
    document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));
    document.querySelectorAll('[data-control]').forEach(b => b.addEventListener('click', () => {
      Store.setControl(b.dataset.control); renderSettings();
    }));
    $('resetBtn').addEventListener('click', e => {
      const btn = e.currentTarget;
      if (btn.classList.contains('armed')) { Store.reset(); btn.classList.remove('armed'); btn.textContent = 'ההתקדמות נמחקה'; }
      else { btn.classList.add('armed'); btn.textContent = 'בטוח? לחיצה נוספת תמחק'; }
    });
    $('pauseBtn').addEventListener('click', togglePause);
    $('resumeBtn').addEventListener('click', togglePause);
    $('pauseRestart').addEventListener('click', () => startLevel(lastLevel));
    $('pauseMap').addEventListener('click', () => { $('pauseOverlay').hidden = true; show('map'); });
    $('nextLevelBtn').addEventListener('click', () => startLevel(lastLevel + 1));
    $('winRetry').addEventListener('click', () => startLevel(lastLevel));
    $('winMap').addEventListener('click', () => { $('winOverlay').hidden = true; show('map'); });
    $('overRetry').addEventListener('click', () => startLevel(lastLevel));
    $('overMap').addEventListener('click', () => { $('overOverlay').hidden = true; show('map'); });

    Events.on('lines', updateHud);
    Events.on('levelComplete', onLevelComplete);
    Events.on('gameOver', onGameOver);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && Game.state.status === 'playing') togglePause();
    });
    window.addEventListener('resize', () => {
      if (ui.current === 'game') Render.resize();
      else if (ui.current === 'map') renderMap();
      else if (ui.current === 'home') renderHome();
    });
  }
  return Object.assign(ui, { init, show, togglePause, startLevel });
})();

/* ---------- 11. Boot ---------- */
(function boot() {
  Render.init();
  Input.init();
  UI.init();
  UI.show('home');
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, now - last);
    last = now;
    if (UI.current === 'game') { Game.update(dt); Effects.update(dt); Render.draw(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
