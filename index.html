<!doctype html>
<html lang="en" dir="ltr">

<meta name="mobile-web-app-capable" content="yes">

<title>Animal Blocks</title>
<style>
/* =========================================================
   DESIGN TOKENS
   Sunny yellow page, deep plum "ink" for outlines & text,
   chunky glossy toy-like buttons and panels with depth.
   The animals bring the color.
   ========================================================= */
:root {
  --sun: #FFD84D;
  --sun-deep: #F2BE2A;
  --ink: #2E2152;
  --ink-soft: #5A4A8F;
  --board: #3A2C6B;
  --cream: #FFF7E3;
  --berry: #E8336D;
  --star: #FFB400;
  /* glossy surfaces: light top, deeper bottom */
  --gloss-cream: linear-gradient(180deg, #FFFFFF 0%, #FFF4D6 46%, #F5D994 100%);
  --gloss-berry: linear-gradient(180deg, #FF8DB2 0%, #F2477C 46%, #C91D57 100%);
  --gloss-plum: linear-gradient(180deg, #9A83EA 0%, #6D55C4 45%, #4B3896 100%);
  /* depth: top highlight, bottom inner shade, solid ink base, soft drop shadow */
  --depth: inset 0 3px 0 rgba(255, 255, 255, .85), inset 0 -5px 0 rgba(46, 33, 82, .16), 0 6px 0 var(--ink), 0 12px 18px rgba(46, 33, 82, .28);
  --depth-pressed: inset 0 3px 0 rgba(255, 255, 255, .6), inset 0 -2px 0 rgba(46, 33, 82, .16), 0 2px 0 var(--ink), 0 4px 8px rgba(46, 33, 82, .25);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Rubik", "Varela Round", "Arial Rounded MT Bold", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  position: fixed; inset: 0;
  background-color: var(--sun);
  background-image:
    radial-gradient(ellipse 90% 55% at 50% 0%, rgba(255, 250, 215, .9), rgba(255, 250, 215, 0) 70%),
    radial-gradient(ellipse 80% 50% at 50% 110%, rgba(242, 160, 40, .35), rgba(242, 160, 40, 0) 70%),
    radial-gradient(circle at 2px 2px, rgba(46, 33, 82, .07) 2px, transparent 2.6px);
  background-size: 100% 100%, 100% 100%, 24px 24px;
  color: var(--ink);
  font-family: var(--font);
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  touch-action: manipulation;
  -webkit-text-size-adjust: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 4px solid #fff; outline-offset: 3px; }

/* ---------- Screens ---------- */
.screen {
  position: absolute; inset: 0;
  max-width: 520px; margin: 0 auto;
  display: none; flex-direction: column;
  padding: calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 12px);
}
.screen.active { display: flex; }

/* ---------- Buttons ---------- */
.btn, .icon-btn {
  position: relative; overflow: hidden; isolation: isolate;
  background: var(--gloss-cream); color: var(--ink);
  border: 4px solid var(--ink);
  box-shadow: var(--depth);
  transition: transform .08s, box-shadow .08s;
}
/* the glossy shine across the top of every button */
.btn::before, .icon-btn::before {
  content: ""; position: absolute; left: 14%; right: 14%; top: 4px; height: 36%;
  border-radius: 999px; pointer-events: none; z-index: -1;
  background: linear-gradient(180deg, rgba(255, 255, 255, .85), rgba(255, 255, 255, 0));
}
.btn:active, .icon-btn:active { transform: translateY(4px); box-shadow: var(--depth-pressed); }
.btn {
  font-weight: 900; font-size: 1.3rem; line-height: 1.1;
  border-radius: 999px; padding: .75em 1.5em; min-height: 58px;
}
.btn.primary { background: var(--gloss-berry); color: #fff; text-shadow: 0 2px 0 rgba(46, 33, 82, .45); }
.btn.primary::before { background: linear-gradient(180deg, rgba(255, 255, 255, .6), rgba(255, 255, 255, 0)); }
.btn.big { font-size: 1.75rem; padding: .7em 2.4em; min-height: 70px; }
.btn.small { font-size: 1.05rem; padding: .6em 1.1em; min-height: 48px; }
.btn.quiet { background: transparent; box-shadow: none; border-style: dashed; border-width: 3px; font-size: 1rem; }
.btn.quiet::before { display: none; }
.btn.quiet:active { transform: none; }

.icon-btn {
  width: 54px; height: 54px; flex: none;
  display: grid; place-items: center;
  border-radius: 18px;
}
.icon-btn svg { position: relative; width: 26px; height: 26px; stroke: var(--ink); stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Top bar (map / settings) ---------- */
.bar { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; }
.bar h2 { flex: 1; font-size: 1.6rem; font-weight: 900; }
.star-count { display: flex; align-items: center; gap: 4px; font-weight: 900; font-size: 1.15rem; }
.star-count svg { width: 26px; height: 26px; }

/* ---------- Stars ---------- */
.star path { fill: #F1E4C0; stroke: var(--ink); stroke-width: 1.7; stroke-linejoin: round; }
.star.on path { fill: url(#starGloss); }
.star .glint { fill: #fff; opacity: 0; }
.star.on .glint { opacity: .85; }

/* ---------- Home ---------- */
#home { align-items: center; justify-content: space-between; text-align: center; }
#home .settings-btn { align-self: flex-end; }
.title {
  display: flex; flex-direction: column; align-items: center;
  font-weight: 900; line-height: .9; letter-spacing: -.02em;
  color: var(--cream);
  -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill;
  text-shadow: 0 7px 0 var(--ink);
}
.title span:first-child { font-size: clamp(3.4rem, 19vw, 5.6rem); transform: rotate(-4deg); }
.title span:last-child { font-size: clamp(3.6rem, 21vw, 6rem); color: var(--berry); transform: rotate(3deg); margin-top: -.08em; }
.cast {
  display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end;
  gap: 14px 18px; max-width: 360px;
}
.cast figure { display: flex; flex-direction: column; align-items: center; gap: 6px; transform: rotate(var(--tilt, 0deg)); }
.cast figcaption { font-weight: 800; font-size: .95rem; }
.cast canvas, .map-buddy, .buddy canvas { filter: drop-shadow(0 4px 2px rgba(46, 33, 82, .3)); }
.home-foot { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.home-stars { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 1.05rem; min-height: 1.5em; }
.home-stars svg { width: 24px; height: 24px; }
.home-stars .trophy { margin-inline-start: 14px; fill: var(--star); stroke: var(--ink); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }

/* ---------- Map ---------- */
.map-scroll { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; touch-action: pan-y; }
.map-path { position: relative; width: 100%; }
.map-path svg.road { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.node {
  position: absolute; transform: translate(-50%, -50%);
  width: 66px; height: 66px; border-radius: 50%;
  border: 4px solid var(--ink); background: var(--gloss-cream);
  box-shadow: var(--depth);
  font-weight: 900; font-size: 1.5rem;
}
.node:active { box-shadow: var(--depth-pressed); margin-top: 3px; }
.node.current { width: 80px; height: 80px; font-size: 1.9rem; background: var(--gloss-berry); color: #fff; text-shadow: 0 2px 0 rgba(46, 33, 82, .45); animation: hop 1.4s ease-in-out infinite; }
.node.locked { background: linear-gradient(180deg, #FBEFC4, #EBD38A); color: rgba(46, 33, 82, .4); border-color: rgba(46, 33, 82, .35); box-shadow: inset 0 3px 0 rgba(255, 255, 255, .6), 0 5px 0 rgba(46, 33, 82, .2); }
.node .mini { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); display: flex; gap: 1px; margin-top: 6px; }
.node .mini svg { width: 18px; height: 18px; }
.node .lock { width: 22px; height: 22px; stroke: currentColor; stroke-width: 3; fill: none; }
.map-buddy { position: absolute; z-index: 1; pointer-events: none; transform: translate(-50%, -50%) rotate(-8deg); }
/* World sections: painted background + a glossy name banner */
.world-bg { position: absolute; left: 0; width: 100%; display: block; }
.world-veil { position: absolute; left: 0; width: 100%; background: rgba(46, 33, 82, .3); pointer-events: none; }
.map-path svg.road, .node, .map-buddy { z-index: 1; }
.world-banner {
  position: absolute; left: 50%; z-index: 2; transform: translate(-50%, -50%);
  display: flex; align-items: center; gap: 10px; white-space: nowrap;
  padding: 10px 14px 10px 18px; border-radius: 22px;
  background: var(--gloss-cream); border: 4px solid var(--ink); box-shadow: var(--depth);
}
.world-banner b { font-size: 1.2rem; font-weight: 900; }
.world-banner .count {
  display: flex; align-items: center; gap: 3px; padding: 3px 10px; border-radius: 999px;
  background: var(--ink); color: #fff; font-weight: 900; font-size: .95rem; font-variant-numeric: tabular-nums;
}
.world-banner .count svg { width: 18px; height: 18px; }
.world-banner .lock { width: 24px; height: 24px; stroke: var(--ink); stroke-width: 3; fill: none; }
.world-banner.locked { background: linear-gradient(180deg, #F4EEF9, #D9CFE6); }
/* Key levels: a bigger plum node with a golden key */
.node.key { width: 86px; height: 86px; background: var(--gloss-plum); }
.node.key .key-ico { width: 46px; height: 46px; display: block; margin: auto; }
.node.key .num {
  position: absolute; right: -10px; bottom: -6px; min-width: 32px; height: 32px; padding: 0 6px;
  display: grid; place-items: center; border-radius: 999px;
  background: var(--gloss-cream); border: 3px solid var(--ink); color: var(--ink); font-size: 1rem;
}
.node.key.current { background: var(--gloss-plum); outline: 5px solid var(--berry); outline-offset: 3px; }
.node.key.locked { background: linear-gradient(180deg, #B9AED6, #8D80B3); }
.node.key.locked .key-ico { opacity: .5; }
.node.key .mini { margin-top: 10px; }
@keyframes hop { 0%, 100% { translate: 0 0; } 50% { translate: 0 -6px; } }

/* ---------- Settings ---------- */
.choice { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 6px 6px 0; }
.option {
  position: relative; aspect-ratio: 1;
  background: var(--gloss-cream); border: 4px solid var(--ink); border-radius: 30px;
  padding: 12px; box-shadow: var(--depth);
}
.option[aria-checked="true"] { outline: 5px solid var(--berry); outline-offset: 4px; }
.option svg { width: 100%; height: 100%; display: block; }
.option .tick { position: absolute; top: -12px; inset-inline-start: -12px; width: 36px; height: 36px; border-radius: 50%; border: 3px solid var(--ink); background: var(--cream); display: grid; place-items: center; }
.option[aria-checked="true"] .tick { background: var(--berry); }
.option[aria-checked="true"] .tick::after { content: ""; width: 12px; height: 7px; border: solid #fff; border-width: 0 0 4px 4px; transform: translateY(-2px) rotate(-45deg); }
.hand-outline { fill: var(--ink); stroke: var(--ink); stroke-width: 5; stroke-linejoin: round; }
.hand-fill { fill: var(--cream); }
.settings-foot { margin-top: auto; display: flex; justify-content: center; padding-top: 4px; }
.settings-body {
  flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
  display: flex; flex-direction: column; gap: 18px;
  margin: 0 -8px; padding: 6px 8px 12px;
}
.set-card {
  display: flex; flex-direction: column; gap: 12px;
  background: var(--gloss-cream); border: 4px solid var(--ink); border-radius: 26px;
  box-shadow: var(--depth); padding: 12px 14px 16px;
}
.set-card[hidden] { display: none; }
.set-title { display: flex; align-items: center; gap: 8px; font-size: 1.25rem; font-weight: 900; }
.set-row { display: flex; align-items: center; gap: 12px; min-height: 52px; }
.set-ico { flex: none; width: 44px; text-align: center; font-size: 2rem; line-height: 1; }
.set-ico.small { width: 30px; font-size: 1.6rem; }
.set-ico.hands svg { width: 32px; height: 38px; transform: scaleX(-1); }
.set-label { flex: 1; font-size: 1.15rem; font-weight: 900; }
/* on/off switch: green with the knob on the right = on */
.switch {
  position: relative; flex: none; width: 70px; height: 42px; padding: 0;
  border: 4px solid var(--ink); border-radius: 999px;
  background: linear-gradient(180deg, #DCD5EC, #B7ADD3);
  box-shadow: inset 0 3px 0 rgba(46, 33, 82, .18), 0 3px 0 var(--ink);
}
.switch i {
  position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%;
  background: var(--gloss-cream); border: 3px solid var(--ink); transition: transform .15s;
}
.switch[aria-checked="true"] { background: linear-gradient(180deg, #9AF09B, #3DBB55); }
.switch[aria-checked="true"] i { transform: translateX(28px); }
/* chunky slider */
.slider { flex: 1; min-width: 0; height: 44px; margin: 0; background: transparent; -webkit-appearance: none; appearance: none; touch-action: pan-x; }
.slider:disabled { opacity: .35; }
.slider::-webkit-slider-runnable-track { height: 16px; border-radius: 999px; border: 3px solid var(--ink); background: linear-gradient(90deg, #FFE98A, var(--berry)); }
.slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 34px; height: 34px; margin-top: -12px; border-radius: 50%;
  background: var(--gloss-cream); border: 4px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.slider::-moz-range-track { height: 10px; border-radius: 999px; border: 3px solid var(--ink); background: linear-gradient(90deg, #FFE98A, var(--berry)); }
.slider::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 4px solid var(--ink); }
/* keyboard keys */
.key-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.key-row {
  display: flex; align-items: center; gap: 6px; min-width: 0; min-height: 52px; padding: 6px; text-align: left;
  background: #fff; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 3px 0 var(--ink);
}
.key-row:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
.key-row .ico { flex: none; font-size: 1.2rem; }
.key-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; }
.key-row kbd {
  flex: none; min-width: 38px; padding: 4px 6px; border-radius: 10px; text-align: center;
  font: inherit; font-weight: 900; color: #fff; background: var(--gloss-plum); border: 2.5px solid var(--ink);
}
.key-row.waiting { background: #FFF3B0; outline: 4px solid var(--berry); outline-offset: 2px; }
.key-row.waiting kbd { background: var(--gloss-berry); animation: hop .9s ease-in-out infinite; }
.key-note { text-align: center; font-weight: 800; color: var(--berry); }
.key-note:empty { display: none; }
.set-card .btn.small { align-self: center; }
.btn.soon:disabled { opacity: .5; cursor: default; }
.btn.soon:disabled:active { transform: none; box-shadow: var(--depth); }
.btn .tag { margin-left: 6px; padding: 2px 8px; border-radius: 999px; font-size: .75rem; color: #fff; background: var(--gloss-plum); vertical-align: middle; }
.erase-ico { font-size: 3rem; line-height: 1; }

/* ---------- Game ---------- */
#game { padding-left: 10px; padding-right: 10px; touch-action: none; }
/* Top bar: solid game panels with a plum name tab on top */
.hud { display: flex; align-items: stretch; gap: 8px; height: 64px; flex: none; margin-top: 8px; }
.hud-box {
  position: relative;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--gloss-cream); border: 4px solid var(--ink); border-radius: 18px;
  box-shadow: var(--depth);
  padding: 6px 12px 2px; min-width: 64px;
}
.hud-box.grow { flex: 1; }
.hud-label {
  position: absolute; top: -11px; left: 50%; transform: translateX(-50%);
  background: var(--gloss-plum); color: #fff; border: 2.5px solid var(--ink); border-radius: 999px;
  font-size: .72rem; font-weight: 900; line-height: 1; padding: 3px 9px; white-space: nowrap;
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .35);
}
.hud-box b {
  font-size: 1.65rem; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums;
  color: var(--ink); text-shadow: 0 2px 0 rgba(255, 255, 255, .9);
}
.hud-box.next { padding: 8px 8px 2px; }
.hud-box.key { background: linear-gradient(180deg, #FFF6C8, #FFD54A 55%, #F0A818); }
.hud-box b .key-ico { width: 22px; height: 22px; vertical-align: -3px; margin-right: 2px; }
/* World background behind the game screen */
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
body.in-game #scene { display: block; }
/* Key levels: a short arrow shows the fall direction */
.play { position: relative; }
.dir-intro { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; pointer-events: none; }
.dir-intro[hidden] { display: none; }
.dir-intro.left { transform: scaleX(-1); }
.dir-intro svg { width: 52%; max-width: 220px; filter: drop-shadow(0 6px 0 rgba(46, 33, 82, .9)); animation: dirSlide .7s ease-in-out 2 both; }
@keyframes dirSlide {
  0% { opacity: 0; transform: translateX(-45%); }
  25%, 70% { opacity: 1; }
  100% { opacity: 0; transform: translateX(45%); }
}
.panel .world-lock { display: flex; align-items: center; gap: 6px; font-size: 1.4rem; font-weight: 900; }
.world-lock svg { width: 30px; height: 30px; }
.world-lock .lock { stroke: var(--ink); stroke-width: 3; fill: none; }
#next { width: 56px; height: 36px; display: block; }
.hud .icon-btn { height: 64px; width: 48px; }
.play {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  padding: 12px 0 14px; touch-action: none;
}
/* Board frame: a chunky plum toy frame with golden bolts in the corners */
.frame {
  position: relative; padding: 10px; border-radius: 28px;
  border: 4px solid var(--ink);
  background:
    radial-gradient(circle at 11px 11px, #FFE780 2.5px, #C98A00 3.5px, var(--ink) 4.5px, transparent 5px),
    radial-gradient(circle at calc(100% - 11px) 11px, #FFE780 2.5px, #C98A00 3.5px, var(--ink) 4.5px, transparent 5px),
    radial-gradient(circle at 11px calc(100% - 11px), #FFE780 2.5px, #C98A00 3.5px, var(--ink) 4.5px, transparent 5px),
    radial-gradient(circle at calc(100% - 11px) calc(100% - 11px), #FFE780 2.5px, #C98A00 3.5px, var(--ink) 4.5px, transparent 5px),
    linear-gradient(180deg, var(--f1, #9A83EA) 0%, var(--f2, #6D55C4) 45%, var(--f3, #4B3896) 100%);
  box-shadow: inset 0 4px 0 rgba(255, 255, 255, .4), inset 0 -6px 0 rgba(20, 10, 50, .25), 0 7px 0 var(--ink), 0 14px 24px rgba(46, 33, 82, .35);
}
#board {
  display: block; border: 3px solid var(--ink); border-radius: 16px; background: #3A2C6B;
}
.rows { display: flex; justify-content: center; gap: 6px; flex: none; height: 24px; direction: ltr; }
.rows i {
  width: 22px; height: 22px; border-radius: 8px; border: 3px solid var(--ink);
  background: linear-gradient(180deg, #F3E6C2, #E2CD92);
  box-shadow: inset 0 2px 3px rgba(46, 33, 82, .25);
}
.rows i.on {
  background: linear-gradient(180deg, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, .15)), var(--c);
  box-shadow: inset 0 2px 0 rgba(255, 255, 255, .6), 0 2px 0 var(--ink);
}

/* ---------- Overlays ---------- */
.overlay {
  position: absolute; inset: 0; z-index: 5;
  display: flex; align-items: center; justify-content: center;
  background: rgba(46, 33, 82, .55); padding: 20px;
}
.overlay[hidden] { display: none; }
.panel {
  width: 100%; max-width: 360px; text-align: center;
  background: var(--gloss-cream); border: 4px solid var(--ink); border-radius: 32px;
  box-shadow: inset 0 4px 0 #fff, inset 0 -6px 0 rgba(46, 33, 82, .12), 0 8px 0 var(--ink), 0 18px 30px rgba(20, 10, 50, .35);
  padding: 26px 22px 28px;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.panel h2 { font-size: 2.1rem; font-weight: 900; line-height: 1.1; }
.panel p { font-size: 1.1rem; font-weight: 700; line-height: 1.4; }
.panel .hint { font-size: .98rem; font-weight: 600; color: var(--ink-soft); }
.panel .btn { width: 100%; }
.panel .row { display: flex; gap: 10px; width: 100%; }
.panel .row .btn { flex: 1; }
.big-stars { display: flex; gap: 6px; align-items: flex-end; }
.big-stars svg { width: 76px; height: 76px; }
.big-stars svg:nth-child(2) { width: 92px; height: 92px; }
.panel .panel-score { font-size: 1.6rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.btn.icon-only { display: grid; place-items: center; padding: .5em; }
.ico { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
.btn.big .ico { width: 40px; height: 40px; }
.ico.fill { fill: currentColor; stroke: none; }
.buddy { margin-top: -70px; transform: rotate(-6deg); }

/* Portrait only: on a phone held sideways, ask to turn it */
.turn-phone { display: none; }
@media (orientation: landscape) and (max-height: 500px) {
  .turn-phone { display: grid; place-items: center; position: fixed; inset: 0; z-index: 50; background: var(--sun); }
  .turn-phone svg { width: 120px; height: 120px; }
}

/* ---------- Coins, chips ---------- */
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.coin {
  display: inline-block; width: 1.15em; height: 1.15em; border-radius: 50%; vertical-align: -.2em; flex: none;
  background: radial-gradient(circle at 35% 30%, #FFF6B8 0 18%, transparent 19%), radial-gradient(circle, #FFC21A 0 52%, #E89400 53% 60%, #FFC21A 61%);
  border: 2px solid var(--ink); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .15);
}
.chip {
  display: inline-flex; align-items: center; gap: 5px; height: 40px; padding: 0 12px; border-radius: 999px;
  background: var(--gloss-cream); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
  font-weight: 900; font-size: 1.05rem; font-variant-numeric: tabular-nums;
}
.chip svg { width: 22px; height: 22px; }
.bar .chip + .chip { margin-left: -4px; }
.bar .shop-btn { margin-left: auto; }
/* the map's settings button floats in the bottom corner (the top bar is full on phones) */
.map-settings { position: absolute; right: 16px; bottom: calc(var(--safe-b) + 16px); z-index: 4; border-radius: 50%; width: 58px; height: 58px; }
.pop { animation: pop .35s ease-out; }
@keyframes pop { 40% { transform: scale(1.3); } }

/* ---------- Boosters in a level ---------- */
/* boosters sit on the thumb's side: right, or left with "Left hand" on (mirrored) */
.boosters { display: flex; justify-content: flex-end; gap: 10px; flex: none; padding: 2px 0 10px; }
body.left-handed .boosters { flex-direction: row-reverse; }
.boosters[hidden] { display: none; }
.booster {
  position: relative; width: 54px; height: 54px; border-radius: 50%; flex: none;
  display: grid; place-items: center; font-size: 1.6rem; line-height: 1;
  background: var(--gloss-cream); border: 4px solid var(--ink); box-shadow: var(--depth);
}
.booster:active { transform: translateY(3px); box-shadow: var(--depth-pressed); }
.booster.empty { opacity: .45; }
.booster.aiming { background: var(--gloss-berry); outline: 4px solid #fff; animation: hop .9s ease-in-out infinite; }
.booster .ring { /* Slow-mo time left */
  position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px);
  transform: rotate(-90deg); pointer-events: none; display: none;
}
.booster.running .ring { display: block; }
.booster .ring circle { fill: none; stroke: var(--berry); stroke-width: 3.5; stroke-linecap: round; }
.badge {
  position: absolute; top: -6px; right: -8px; min-width: 24px; height: 24px; padding: 0 5px; border-radius: 999px;
  display: grid; place-items: center; background: var(--gloss-berry); color: #fff; border: 2.5px solid var(--ink);
  font-size: .8rem; font-weight: 900; font-variant-numeric: tabular-nums;
}
.booster.empty .badge { background: var(--cream); color: var(--ink); }
.frame.aiming { outline: 5px dashed #fff; outline-offset: 4px; cursor: crosshair; }
.panel .coins-won { display: flex; align-items: center; gap: 6px; font-size: 1.6rem; font-weight: 900; color: #B86E00; font-variant-numeric: tabular-nums; }
.btn.chance-btn { overflow: visible; font-size: 2rem; }

/* ---------- Shop ---------- */
.tabs { display: flex; gap: 6px; padding: 4px; border-radius: 999px; background: rgba(46, 33, 82, .12); }
.tab {
  width: 58px; height: 44px; border-radius: 999px; border: 3px solid transparent; background: none;
  font-size: 1.4rem; display: grid; place-items: center;
}
.tab .coin { font-size: 1.3rem; }
.tab[aria-selected="true"] { background: var(--gloss-cream); border-color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
#shop .bar .chip { margin-left: auto; }
.inventory {
  display: flex; justify-content: space-between; gap: 4px; padding: 8px 10px; margin-bottom: 12px;
  border-radius: 20px; background: rgba(255, 255, 255, .55); border: 3px solid var(--ink);
}
.inv { position: relative; display: flex; flex-direction: column; align-items: center; font-size: 1.4rem; line-height: 1.1; }
.inv b { font-size: .85rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.shop-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 4px 16px 20px; touch-action: pan-y;
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-content: start; }
.card {
  position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center;
  padding: 12px 10px; border-radius: 24px; background: var(--gloss-cream); border: 4px solid var(--ink); box-shadow: var(--depth);
}
.card .big-ico { font-size: 2.4rem; line-height: 1.1; }
.card .name { font-size: 1rem; font-weight: 900; }
.card .buys { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 2px; }
.btn.buy { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: .35em .8em; min-height: 44px; font-size: 1rem; }
.btn.buy .qty { font-weight: 900; }
.btn.buy .price { display: inline-flex; align-items: center; gap: 4px; }
.btn.buy.short { opacity: .5; }
.nope { animation: nope .35s; }
@keyframes nope { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.test-mode {
  grid-column: 1 / -1; justify-self: center; padding: 6px 14px; border-radius: 999px;
  background: #FFE14D; border: 3px dashed var(--ink); font-weight: 900; font-size: .95rem;
}
.pack .btn.real { width: 100%; min-height: 48px; padding: .4em .6em; font-size: 1.15rem; }
.pack.starter { grid-column: 1 / -1; background: linear-gradient(180deg, #FFF6FB, #FFD1EC); }
.pack.starter .contents { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 10px; font-weight: 900; }
.pack.starter .contents .coin { margin-right: 2px; }
.coins-pack .stack { display: flex; justify-content: center; font-size: 1.6rem; min-height: 2.2rem; align-items: center; }
.coins-pack .stack .coin + .coin { margin-left: -.45em; }
.coins-pack .amount { font-size: 1.5rem; font-weight: 900; font-variant-numeric: tabular-nums; }
.coins-pack .bonus {
  position: absolute; top: -10px; right: -8px; padding: 2px 8px; border-radius: 999px;
  background: var(--gloss-berry); color: #fff; border: 2.5px solid var(--ink); font-size: .8rem; font-weight: 900;
}
.panel.gate input {
  width: 140px; height: 56px; text-align: center; font: inherit; font-size: 1.8rem; font-weight: 900; color: var(--ink);
  border: 4px solid var(--ink); border-radius: 16px; background: #fff; -webkit-user-select: text; user-select: text;
}
.flyer { position: fixed; left: 0; top: 0; z-index: 60; font-size: 2rem; pointer-events: none; }

/* ---------- Effects layers ---------- */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
.cheer {
  position: absolute; left: 50%; top: 42%; z-index: 3; pointer-events: none; white-space: nowrap;
  font-size: clamp(2.6rem, 13vw, 4rem); font-weight: 900; color: #FFE14D;
  -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink);
  transform: translate(-50%, -50%);
}
.cheer[hidden] { display: none; }
.cheer.go { animation: cheer 1.1s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes cheer {
  0% { transform: translate(-50%, -50%) scale(.2) rotate(-12deg); opacity: 0; }
  30% { transform: translate(-50%, -50%) scale(1.15) rotate(4deg); opacity: 1; }
  45% { transform: translate(-50%, -50%) scale(.95) rotate(-2deg); }
  80% { transform: translate(-50%, -50%) scale(1) rotate(0); opacity: 1; }
  100% { transform: translate(-50%, -70%) scale(.9); opacity: 0; }
}
/* Earned stars fly into their slots with a pop and a bounce */
.big-stars svg.on { animation: starIn .55s cubic-bezier(.3, 1.8, .5, 1) both; }
.big-stars svg.on:nth-child(1) { animation-delay: .35s; }
.big-stars svg.on:nth-child(2) { animation-delay: .6s; }
.big-stars svg.on:nth-child(3) { animation-delay: .85s; }
@keyframes starIn { 0% { transform: translateY(-90px) scale(2.4) rotate(-90deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: none; } }

/* ---------- Key levels on the map ---------- */
.key-reward {
  position: absolute; z-index: 1; transform: translate(-50%, -50%); pointer-events: none;
  display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px;
  background: rgba(255, 247, 227, .92); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink);
}
.key-reward .chest-ico { width: 30px; height: 25px; }
.key-reward.won { background: linear-gradient(180deg, #FFF6C8, #FFD54A); }

/* ---------- Key level prize on "Well done!" ---------- */
.key-prize { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.key-prize[hidden] { display: none; }
.chest { width: 84px; height: 78px; overflow: visible; }
.chest-lid { transform-box: fill-box; transform-origin: 10% 100%; }
.key-prize.play .chest { animation: chestShake .6s ease-in-out .5s both; }
.key-prize.play .chest-lid { animation: lidPop .5s cubic-bezier(.3, 1.6, .5, 1) 1.1s both; }
@keyframes chestShake { 0%, 100% { transform: none; } 20%, 60% { transform: rotate(-7deg); } 40%, 80% { transform: rotate(7deg); } }
@keyframes lidPop { to { transform: translateY(-10px) rotate(-38deg); } }
.prize-items { display: flex; gap: 10px; font-size: 1.9rem; min-height: 2.3rem; }
.prize-items span { display: inline-block; }
.key-prize.play .prize-items span { animation: itemOut .6s cubic-bezier(.3, 1.7, .5, 1) both; animation-delay: calc(1.3s + var(--i) * .15s); }
@keyframes itemOut { 0% { transform: translateY(-50px) scale(.2); opacity: 0; } 100% { transform: none; opacity: 1; } }
.new-friend { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 18px; background: linear-gradient(180deg, #FFF6FB, #FFD1EC); border: 3px solid var(--ink); }
.new-friend .tag { font-weight: 900; color: var(--berry); white-space: nowrap; }
.new-friend b { font-weight: 900; white-space: nowrap; }
.key-prize.play .new-friend { animation: itemOut .6s cubic-bezier(.3, 1.7, .5, 1) 1.9s both; }

/* ---------- Animal collection ---------- */
.zoo-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -16px; padding: 0 16px 24px; touch-action: pan-y; }
.zoo-title {
  margin: 14px 0 8px; font-size: 1.15rem; font-weight: 900;
  display: inline-block; padding: 4px 14px; border-radius: 999px; color: #fff;
  background: var(--wc, var(--berry)); border: 3px solid var(--ink); text-shadow: 0 2px 0 rgba(46, 33, 82, .5);
}
.zoo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.zoo-card {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px;
  min-height: 100px; padding: 10px 6px 8px; border-radius: 20px; text-align: center;
  background: var(--gloss-cream); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink);
}
.zoo-card b { font-size: .85rem; font-weight: 900; line-height: 1.1; }
.zoo-card.locked { background: linear-gradient(180deg, #E9E3F5, #CFC4E3); }
.zoo-key { position: absolute; top: -10px; right: -8px; width: 32px; height: 32px; }
.zoo-key .key-ico { width: 32px; height: 32px; }

@media (prefers-reduced-motion: reduce) {
  .booster.aiming, .pop, .nope, .key-row.waiting kbd { animation: none; }
  .cheer.go, .big-stars svg.on, .key-prize.play .chest, .key-prize.play .chest-lid, .key-prize.play .prize-items span, .key-prize.play .new-friend { animation: none; }
  .node.current { animation: none; }
  .dir-intro svg { animation: none; }
  .btn, .icon-btn { transition: none; }
}
</style>
</head>
<body>

<!-- Shared icon shapes -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hand" viewBox="0 0 40 48">
    <rect x="12" y="2" width="10" height="28" rx="5"/>
    <rect x="6" y="20" width="28" height="26" rx="10"/>
    <circle cx="27" cy="23" r="5"/>
    <circle cx="33" cy="27" r="4.5"/>
    <ellipse cx="7" cy="31" rx="4.5" ry="8" transform="rotate(-28 7 31)"/>
  </symbol>
  <linearGradient id="starGloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE780"/><stop offset=".5" stop-color="#FFC21A"/><stop offset="1" stop-color="#F08C00"/>
  </linearGradient>
  <linearGradient id="keyGold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFF1A0"/><stop offset=".5" stop-color="#FFC21A"/><stop offset="1" stop-color="#E08A00"/>
  </linearGradient>
  <linearGradient id="arrowGloss" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FF9DBE"/><stop offset=".5" stop-color="#F2477C"/><stop offset="1" stop-color="#C91D57"/>
  </linearGradient>
  <symbol id="i-retry" viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4v4h4"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></symbol>
  <symbol id="i-map" viewBox="0 0 24 24"><path d="M3.5 6.5 9 4l6 2.5L20.5 4v13.5L15 20l-6-2.5-5.5 2.5zM9 4v13.5M15 6.5V20"/></symbol>
</svg>

<!-- World background behind the game screen -->
<canvas id="scene" aria-hidden="true"></canvas>

<!-- Shown only when a phone is held sideways -->
<div class="turn-phone" aria-label="Turn your phone upright">
  <svg viewBox="0 0 96 96" aria-hidden="true">
    <rect x="30" y="12" width="36" height="64" rx="8" fill="#FFF7E3" stroke="#2E2152" stroke-width="4"/>
    <circle cx="48" cy="66" r="3" fill="#2E2152"/>
    <path d="M14 56a34 34 0 0 1 6-30m-6 1 6-1 1 6" fill="none" stroke="#2E2152" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</div>

<!-- ============ HOME ============ -->
<section class="screen" id="home">
  <button class="icon-btn settings-btn" data-settings aria-label="Settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></svg>
  </button>
  <h1 class="title"><span>Animal</span><span>Blocks</span></h1>
  <div class="cast" id="cast"></div>
  <div class="home-foot">
    <p class="home-stars" id="homeStars"></p>
    <button class="btn primary big" data-go="map">Play</button>
  </div>
</section>

<!-- ============ MAP ============ -->
<section class="screen" id="map">
  <header class="bar">
    <button class="icon-btn" data-go="home" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2 class="sr-only">Level map</h2>
    <span class="chip" id="mapStars"></span>
    <span class="chip coin-chip" id="mapCoins"></span>
    <button class="icon-btn zoo-btn" id="mapZoo" aria-label="Animal collection">
      <svg viewBox="0 0 24 24"><ellipse cx="12" cy="15.5" rx="4.6" ry="3.8"/><circle cx="6" cy="10" r="1.9"/><circle cx="9.5" cy="6.5" r="1.9"/><circle cx="14.5" cy="6.5" r="1.9"/><circle cx="18" cy="10" r="1.9"/></svg>
    </button>
    <button class="icon-btn shop-btn" id="mapShop" aria-label="Shop">
      <svg viewBox="0 0 24 24"><path d="M4 9h16l-1.4 10.2a2 2 0 0 1-2 1.8H7.4a2 2 0 0 1-2-1.8z"/><path d="M8.5 9V7a3.5 3.5 0 0 1 7 0v2"/></svg>
    </button>
  </header>
  <div class="map-scroll" id="mapScroll"><div class="map-path" id="mapPath"></div></div>
    <button class="icon-btn map-settings" data-settings aria-label="Settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M21.2 12h-2.6M5.4 12H2.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8M18.5 18.5l-1.8-1.8M7.3 7.3 5.5 5.5"/></svg>
    </button>
</section>

<!-- ============ SETTINGS ============ -->
<!-- Opens from Home, the map and inside a level (which pauses the game). -->
<section class="screen" id="settings">
  <header class="bar">
    <button class="icon-btn" id="settingsBack" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <h2>Settings</h2>
  </header>
  <div class="settings-body">
    <!-- Sound -->
    <div class="set-card">
      <div class="set-row">
        <span class="set-ico" aria-hidden="true">🎵</span>
        <button class="switch" role="switch" data-switch="music" aria-label="Music"><i></i></button>
        <input class="slider" type="range" min="0" max="100" data-volume="musicVol" aria-label="Music volume">
      </div>
      <div class="set-row">
        <span class="set-ico" aria-hidden="true">🔊</span>
        <button class="switch" role="switch" data-switch="sfx" aria-label="Sound effects"><i></i></button>
        <input class="slider" type="range" min="0" max="100" data-volume="sfxVol" aria-label="Sound effects volume">
      </div>
    </div>

    <!-- Touch controls -->
    <div class="set-card">
      <h3 class="set-title"><span aria-hidden="true">👆</span> Touch</h3>
      <div class="choice" role="radiogroup" aria-label="How to move the animals">
        <!-- Mode 1: dragging hand -->
        <button class="option" role="radio" data-control="drag" aria-label="Free drag">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <rect x="3" y="3" width="90" height="90" rx="24" fill="#43C46E"/>
            <path d="M12 58h24M60 58h24" fill="none" stroke="#FFF7E3" stroke-width="5" stroke-dasharray="0.5 9" stroke-linecap="round"/>
            <rect x="44" y="12" width="24" height="24" rx="7" fill="#FFB33C" stroke="#2E2152" stroke-width="3"/>
            <circle cx="52" cy="22" r="2.4" fill="#2E2152"/><circle cx="60" cy="22" r="2.4" fill="#2E2152"/>
            <use href="#hand" x="36" y="32" width="40" height="48" class="hand-outline"/>
            <use href="#hand" x="36" y="32" width="40" height="48" class="hand-fill"/>
          </svg>
          <i class="tick" aria-hidden="true"></i>
        </button>
        <!-- Mode 2: swiping hand -->
        <button class="option" role="radio" data-control="swipe" aria-label="Swipes">
          <svg viewBox="0 0 96 96" aria-hidden="true">
            <rect x="3" y="3" width="90" height="90" rx="24" fill="#4C8DF6"/>
            <path d="M36 26H14m7-7-7 7 7 7M60 26h22m-7-7 7 7-7 7" fill="none" stroke="#FFF7E3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M22 50h10M18 60h12M20 70h8" fill="none" stroke="#FFF7E3" stroke-width="4" stroke-linecap="round" opacity=".7"/>
            <use href="#hand" x="30" y="30" width="40" height="48" class="hand-outline" transform="rotate(-14 50 54)"/>
            <use href="#hand" x="30" y="30" width="40" height="48" class="hand-fill" transform="rotate(-14 50 54)"/>
          </svg>
          <i class="tick" aria-hidden="true"></i>
        </button>
      </div>
      <div class="set-row">
        <span class="set-ico small" aria-hidden="true" title="Big moves">🐢</span>
        <input class="slider" type="range" min="0" max="100" id="sensitivity" aria-label="Touch sensitivity: how small a finger move counts">
        <span class="set-ico small" aria-hidden="true" title="Tiny moves">🐇</span>
      </div>
      <div class="set-row">
        <span class="set-ico hands" aria-hidden="true">
          <svg viewBox="0 0 40 48"><use href="#hand" class="hand-outline"/><use href="#hand" class="hand-fill"/></svg>
        </span>
        <span class="set-label">Left hand</span>
        <button class="switch" role="switch" data-switch="leftHanded" aria-label="Left-handed: boosters on the left"><i></i></button>
      </div>
    </div>

    <!-- Keyboard (computers only) -->
    <div class="set-card" id="keysCard">
      <h3 class="set-title"><span aria-hidden="true">⌨️</span> Keys</h3>
      <div class="key-list" id="keyList"></div>
      <p class="key-note" id="keyNote" aria-live="polite"></p>
      <button class="btn small" id="resetKeys">↺ Default keys</button>
    </div>

    <!-- Other -->
    <div class="set-card">
      <div class="set-row">
        <span class="set-ico" aria-hidden="true">📳</span>
        <span class="set-label">Vibration</span>
        <button class="switch" role="switch" data-switch="vibrate" aria-label="Vibration"><i></i></button>
      </div>
      <!-- Phase 2: the tutorial replay goes here -->
      <button class="btn small soon" id="tutorialBtn" disabled aria-label="Replay tutorial (coming soon)">? Tutorial <span class="tag">soon</span></button>
    </div>
    <div class="settings-foot">
      <button class="btn quiet" id="resetBtn">🗑️ Erase all progress</button>
    </div>
  </div>

  <div class="overlay" id="eraseOverlay" hidden>
    <div class="panel">
      <div class="erase-ico" aria-hidden="true">🗑️</div>
      <h2>Are you sure?</h2>
      <p>All stars, coins, boosters and animals will be gone.</p>
      <div class="row">
        <button class="btn" id="eraseNo">Keep</button>
        <button class="btn primary" id="eraseYes">Erase</button>
      </div>
    </div>
  </div>
</section>

<!-- ============ ANIMAL COLLECTION ============ -->
<section class="screen" id="zoo">
  <header class="bar">

<!-- ============ SHOP ============ -->

<script>
'use strict';
/* =========================================================
   ANIMAL BLOCKS — Phase 1
   Sections:
     1. CONFIG     – all game numbers in one place
     2. Events     – tiny event bus (hooks for Phase 2: sounds,
                     effects, tutorial can listen without touching
                     game logic)
     3. Store      – progress & settings saved on the device
    3b. Levels     – worlds, key levels, speeds, unlocking
     4. Pieces     – the 7 shapes + rotation
     5. Art        – drawing the animals (and key-level gems) on canvas
     6. Game       – pure game rules (board, falling, scoring)
     7. Effects    – landing squash, dust, line flash, particles
    7b. Sound      – music & sound effects made in code, vibration
     8. Scene      – painted world backgrounds
     9. Render     – draws the board (turned for sideways key levels)
    10. Input      – touch (drag / swipe) and keyboard
    11. UI         – screens, map, overlays, settings
    12. Boot       – main loop

   Phase 2 tutorial plugs in through: Game.freeze(on), Game.pause(),
   Input.setModeOverride(mode) and the 'spawn' / 'input' / 'lines'
   events. Tutorial pauses: move, rotate, "speed up the fall" and "instant
   drop" – watch for 'input' actions 'move', 'rotate', 'fast-fall' and
   'hard-drop'. Effects, sounds and animal unlocking listen to the same events.
   ========================================================= */

/* ---------- 1. CONFIG ---------- */
const CONFIG = {
  cols: 10,                 // regular board
  rows: 20,
  rowsPerLevel: 10,         // lines to clear per level (rows, or columns on key levels)
  levelCount: 0,            // set from WORLDS below (worlds × worldSize)
  worldSize: 10,            // 5 worlds × 10 levels
  baseInterval: 1000,       // ms per step at level 1 (1 step/sec)
  speedFactor: 0.97,        // each level is 3% faster
  minInterval: 100,         // cap: 10 steps/sec
  lineScores: [0, 100, 300, 500, 800], // × level number
  // Key levels: every 5th level, sideways gravity on a square board.
  keyEvery: 5,
  keyBoard: 12,             // 12×12
  keyVsRegular: 0.9,        // 10% faster than the regular level right after it
  keyScoreBonus: 1.2,       // +20% points
  worldUnlockStars: 2,      // stars needed on EVERY level of a world to open the next one
  fastFallInterval: 100,    // fast fall: about 10 rows per second...
  fastFallFactor: 0.6,      // ...or 40% faster than normal if the level is already that fast
  // Instant drop by touch: a quick flick down. Strict on purpose so a slow
  // swipe or a held finger never drops an animal by accident.
  flick: { maxTime: 300, minCells: 2.5, minPx: 60, minSpeed: 0.8 }, // ms, cells, px, px per ms
  clearDelay: 180,          // ms full rows flash before they disappear
  lockDelay: 500,           // ms a landed animal waits before locking
  maxLockResets: 15,
  // Stars use base line points (100 / 300 / 500 / 800 per clear, without the
  // level multiplier or key bonus). Finishing (10 lines) = at least 1000.
  // 2 stars = one double clear somewhere in the level (1100);
  // 3 stars = a few multi-line clears (1500).
  starThresholds: { two: 1100, three: 1500 },
  // Coins, earned once per level (first completion only): 10% of the level's
  // points, but the level number counts gently (×1 at level 1 rising 4% per
  // level, ×3 at level 50) instead of ×50 – otherwise late levels would pay
  // 50× more and the shop would stop mattering. Key levels keep their +20%.
  coinRate: 0.1,
  coinLevelStep: 0.04,
  keyCoinMultiplier: 3,     // key levels: 3× coins on first completion...
  chestItems: 3,            // ...plus a treasure chest with this many boosters and a special animal
  specialChance: 0.1,       // how often an unlocked special animal shows up instead of a regular one
  slowMoMs: 30000,          // Slow-mo booster: half speed for 30 s
  secondChanceRows: 5,      // Second chance clears this many bottom rows
};

/* ---------- 2. Events ---------- */
const Events = {
  handlers: {},
  on(name, fn) { (this.handlers[name] = this.handlers[name] || []).push(fn); },
  emit(name, data) { (this.handlers[name] || []).forEach(fn => fn(data)); },
};

/* ---------- 3. Store ---------- */
const Store = (() => {
  const KEY = 'animalBlocks.v1';
  // Keyboard keys are KeyboardEvent.code values, so they work on any layout.
  const DEFAULT_KEYS = { left: 'ArrowLeft', right: 'ArrowRight', rotate: 'ArrowUp', speed: 'ArrowDown', drop: 'Space', pause: 'Escape' };
  const defaultSettings = () => ({
    control: 'drag',
    music: true, musicVol: .6, sfx: true, sfxVol: .8, // volumes 0–1
    sensitivity: .5,          // 0 = needs big finger moves, 1 = tiny moves count
    leftHanded: false, vibrate: true,
    keys: { ...DEFAULT_KEYS },
  });
  const defaults = () => ({
    lastLevel: 1, highScore: 0, stars: {}, best: {}, settings: defaultSettings(),
    coins: 0, items: {}, seen: {}, starterBought: false, // seen: boosters ever owned (shown in the game)
    specials: {}, version: 2, // specials: special animals unlocked by key levels, e.g. { K1: true }
  });
  let data = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = JSON.parse(raw), def = defaults();
        // Version 1 saves: levels 5, 10, … 50 were key levels on the main path;
        // they are regular levels now. Their stars simply stay where they are,
        // so nobody loses progress, and the new side key levels start fresh.
        const settings = { ...def.settings, ...(d.settings || {}) };
        settings.keys = { ...DEFAULT_KEYS, ...(settings.keys || {}) };
        return { ...def, ...d, version: def.version, settings };
      }
    } catch (e) { /* storage unavailable – play without saving */ }
    return defaults();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* ignore */ }
  }
  return {
    get: () => data,
    totalStars: () => Object.values(data.stars).reduce((a, b) => a + b, 0),
    recordLevel(level, stars, score) {
      if (stars > (data.stars[level] || 0)) data.stars[level] = stars;
      if (score > (data.best[level] || 0)) data.best[level] = score;
      data.highScore = Math.max(data.highScore, score);
      save();
    },
    recordScore(score) { if (score > data.highScore) { data.highScore = score; save(); } },
    addCoins(n) { data.coins += n; save(); },
    spendCoins(n) { if (data.coins < n) return false; data.coins -= n; save(); return true; },
    addItems(items) {
      for (const [id, n] of Object.entries(items)) { data.items[id] = (data.items[id] || 0) + n; data.seen[id] = true; }
      save();
    },
    useItem(id) { if (!(data.items[id] > 0)) return false; data.items[id]--; save(); return true; },
    count: id => data.items[id] || 0,
    setStarterBought() { data.starterBought = true; save(); },
    unlockSpecial(keyId) { data.specials[keyId] = true; save(); },
    hasSpecial: keyId => !!data.specials[keyId],
    setLastLevel(level) { data.lastLevel = level; save(); },
    setControl(mode) { data.settings.control = mode; save(); },
    setting: name => data.settings[name],
    set(name, value) { data.settings[name] = value; save(); },
    setKey(action, code) { data.settings.keys[action] = code; save(); },
    resetKeys() { data.settings.keys = { ...DEFAULT_KEYS }; save(); },
    // Erasing progress keeps all settings (sound, controls, keys).
    reset() { const settings = data.settings; data = defaults(); data.settings = settings; save(); },
  };
})();

/* ---------- 3b. Worlds & levels ---------- */
// Each world: name, board frame gloss (top, middle, bottom) and board colors.
// To add a world: add an entry here (and a painter in Scene, or it reuses one).
// The level count, map, unlocking and speed curve all follow automatically.
const WORLDS = [
  { name: 'Sunny Meadow', frame: ['#B6F27E', '#56C73C', '#2F8C2A'], board: ['#2F64B0', '#1B3A73'] },
  { name: 'Animal Kingdom', frame: ['#FFD08A', '#F08A2A', '#A9501A'], board: ['#7A3A2C', '#45201A'] },
  { name: 'Ocean Reef', frame: ['#8AF0FA', '#1FB3D6', '#0B6E9A'], board: ['#0F4F8E', '#062A57'] },
  { name: 'Snowy Mountains', frame: ['#FFFFFF', '#BFE2FF', '#7AAEE0'], board: ['#3B5C8E', '#1E3357'] },
  { name: 'Candy Sky', frame: ['#FFB8EA', '#D063DD', '#7A2FA8'], board: ['#4A2A7A', '#24124A'] },
];
CONFIG.levelCount = WORLDS.length * CONFIG.worldSize;
// Level ids: regular levels are numbers 1, 2, 3 … (the main path). Key levels
// are optional side levels 'K1' … 'K10'; K1 branches off level 5, K2 off 10, …
const Levels = {
  isKey: id => typeof id === 'string',
  keyIndex: id => +id.slice(1),
  parent(id) { return this.isKey(id) ? this.keyIndex(id) * CONFIG.keyEvery : id; }, // the regular level a key level branches from
  keyAfter: L => (L % CONFIG.keyEvery === 0 ? 'K' + L / CONFIG.keyEvery : null),     // the key level branching off regular level L
  keyCount: () => Math.floor(CONFIG.levelCount / CONFIG.keyEvery),
  world(id) { return Math.floor((this.parent(id) - 1) / CONFIG.worldSize); },
  num(id) { return this.parent(id); }, // the level number used for score and coins
  // Key levels alternate: K1 falls right, K2 left, K3 right, ...
  direction(id) { return this.isKey(id) ? (this.keyIndex(id) % 2 ? 'right' : 'left') : 'down'; },
  setup(id) {
    return this.isKey(id)
      ? { cols: CONFIG.keyBoard, rows: CONFIG.keyBoard, gravity: this.direction(id), key: true }
      : { cols: CONFIG.cols, rows: CONFIG.rows, gravity: 'down', key: false };
  },
  rawRegular: L => CONFIG.baseInterval * Math.pow(CONFIG.speedFactor, L - 1),
  // ms per step, never faster than the speed cap. Key levels are 10% faster
  // than the regular level they branch from. Works for any level number.
  interval(id) {
    const ms = this.isKey(id) ? this.rawRegular(this.parent(id)) * CONFIG.keyVsRegular : this.rawRegular(id);
    return Math.max(CONFIG.minInterval, ms);
  },
  levelsOf: w => Array.from({ length: CONFIG.worldSize }, (_, i) => w * CONFIG.worldSize + i + 1), // regular levels only
  keysOf(w) { return this.levelsOf(w).map(L => this.keyAfter(L)).filter(Boolean); },
  stars: id => Store.get().stars[id] || 0,
  worldStars(w) { return this.levelsOf(w).reduce((a, L) => a + this.stars(L), 0); },
  // Progress toward opening world w: stars (up to 2 per REGULAR level) in the
  // world before it. Key levels are optional and never needed.
  unlockProgress(w) {
    const need = CONFIG.worldUnlockStars;
    return { have: this.levelsOf(w - 1).reduce((a, L) => a + Math.min(need, this.stars(L)), 0), need: need * CONFIG.worldSize };
  },
  worldUnlocked(w) {
    if (w <= 0) return true;
    const p = this.unlockProgress(w);
    return p.have >= p.need;
  },
  unlocked(id) {
    if (!this.worldUnlocked(this.world(id))) return false;
    if (this.isKey(id)) return this.stars(this.parent(id)) >= 1; // opens once its regular level is finished
    return (id - 1) % CONFIG.worldSize === 0 || this.stars(id - 1) >= 1;
  },
  label(id) { return this.isKey(id) ? id : String(id); },
};

/* ---------- 3c. Coins & boosters ---------- */
// Coin shop prices. A level pays about 100–160 coins at level 1 and about
// 300–450 at level 50 (about 11,000 for the whole game, once), so early on a
// level buys one or two single boosters, later a bundle. Bundles save ~20%.
const BOOSTERS = {
  bomb:   { icon: '💣', name: 'Bomb', price: 60, bundle: [3, 150] },
  swap:   { icon: '🔄', name: 'Swap', price: 30, bundle: [5, 120] },
  slow:   { icon: '⏳', name: 'Slow-mo', price: 50, bundle: [3, 120] },
  magic:  { icon: '⭐', name: 'Magic block', price: 40, bundle: [3, 100] },
  sweep:  { icon: '🧹', name: 'Sweep', price: 40, bundle: [3, 100] },
  chance: { icon: '❤️', name: 'Second chance', price: 120, bundle: [3, 300] },
};
const IN_LEVEL_BOOSTERS = ['bomb', 'swap', 'slow', 'magic', 'sweep']; // the 6th is on the "Oops" screen
const Economy = {
  coinsFor(id, base) { // key levels pay 3× the coins of the level they branch from
    const L = Levels.num(id), key = Levels.isKey(id) ? CONFIG.keyCoinMultiplier : 1;
    return Math.round(base * CONFIG.coinRate * (1 + CONFIG.coinLevelStep * (L - 1)) * key);
  },
  // A key level's treasure chest: a few different boosters, one of each.
  chest() {
    const pool = Object.keys(BOOSTERS).sort(() => Math.random() - .5);
    return Object.fromEntries(pool.slice(0, CONFIG.chestItems).map(id => [id, 1]));
  },
};

/* ---------- 3d. Payments (REAL MONEY) ----------
   PROTOTYPE – NO REAL PAYMENTS. While TEST_MODE is true, every purchase
   succeeds for free and the shop shows a "Test mode" label.
   This is the ONLY place that talks to a payment system. To go live on
   Android: set TEST_MODE to false, load real prices from Google Play
   Billing into `price`, and replace the body of `purchase()` with the
   Billing flow (e.g. through a Capacitor/Cordova billing plugin). The rest
   of the game only calls Payments.products() and Payments.purchase(id). */
const Payments = (() => {
  const TEST_MODE = true;
  const PRODUCTS = [ // prices are USD placeholders until Google Play provides them
    { id: 'starter_pack', kind: 'starter', price: '$2.99', coins: 1000, items: { bomb: 2, swap: 2, slow: 2, magic: 2, sweep: 2, chance: 2 }, once: true },
    { id: 'coins_small', kind: 'coins', size: 1, price: '$0.99', coins: 500 },
    { id: 'coins_medium', kind: 'coins', size: 2, price: '$1.99', coins: 1200, bonus: '+20%' },
    { id: 'coins_big', kind: 'coins', size: 3, price: '$4.99', coins: 3500, bonus: '+40%' },
    { id: 'coins_huge', kind: 'coins', size: 4, price: '$9.99', coins: 8000, bonus: '+60%' },
  ];
  async function purchase(id) {
    const product = PRODUCTS.find(p => p.id === id);
    if (!product) return { ok: false };
    if (TEST_MODE) return { ok: true, product }; // free in test mode
    // TODO(Android): start Google Play Billing for `id`, wait for the result,
    // verify and acknowledge the purchase, then return { ok: true, product }.
    return { ok: false };
  }
  return { TEST_MODE, products: () => PRODUCTS, purchase };
})();

/* ---------- 4. Pieces ---------- */
// Cells are [x, y] inside an n×n box, in the base (spawn) orientation.
const PIECES = {
  I: { n: 4, cells: [[0, 1], [1, 1], [2, 1], [3, 1]], name: 'Snake', color: '#17CC5A' },
  O: { n: 2, cells: [[0, 0], [1, 0], [0, 1], [1, 1]], name: 'Panda', color: '#FF9ECB' },
  T: { n: 3, cells: [[1, 0], [0, 1], [1, 1], [2, 1]], name: 'Turtle', color: '#00CCDD' },
  L: { n: 3, cells: [[2, 0], [0, 1], [1, 1], [2, 1]], name: 'Giraffe', color: '#FFB000' },
  J: { n: 3, cells: [[0, 0], [0, 1], [1, 1], [2, 1]], name: 'Elephant', color: '#3B7BFF' },
  S: { n: 3, cells: [[1, 0], [2, 0], [0, 1], [1, 1]], name: 'Caterpillar', color: '#A6E812' },
  Z: { n: 3, cells: [[0, 0], [1, 0], [1, 1], [2, 1]], name: 'Crab', color: '#FF3B4E' },
};
const TYPES = Object.keys(PIECES);
// The Magic block booster: a single cell that can fill any gap (not in the normal bag).
PIECES.M = { n: 1, cells: [[0, 0]], name: 'Magic block', color: '#FFD21F' };
// On key levels the same shapes are made of glossy geometric gems instead of animals.
const GEMS = {
  I: { shape: 'circle', color: '#1FD0F0' },
  O: { shape: 'square', color: '#FFC21A' },
  T: { shape: 'triangle', color: '#B45CFF' },
  L: { shape: 'circle', color: '#FF8A1F' },
  J: { shape: 'triangle', color: '#3B7BFF' },
  S: { shape: 'square', color: '#3DDC5A' },
  Z: { shape: 'circle', color: '#FF3B6B' },
  M: { shape: 'star', color: '#FFD21F' },
};

// ----- Animal casts -----
// Each world has 7 animals, one per shape; the shape never changes, only the
// look. A recipe lists colors and features for the animal painter in Art.
const CASTS = [
  { // 1. Sunny Meadow – the original hand-drawn animals
    I: { name: 'Snake', color: '#17CC5A', custom: true },
    O: { name: 'Panda', color: '#FF9ECB', custom: true },
    T: { name: 'Turtle', color: '#00CCDD', custom: true },
    L: { name: 'Giraffe', color: '#FFB000', custom: true },
    J: { name: 'Elephant', color: '#3B7BFF', custom: true },
    S: { name: 'Caterpillar', color: '#A6E812', custom: true },
    Z: { name: 'Crab', color: '#FF3B4E', custom: true },
  },
  { // 2. Animal Kingdom
    I: { name: 'Cheetah', color: '#FFB72B', belly: '#FFF0C8', pattern: { type: 'spots', color: '#3A2410' }, ears: 'small', tears: true, tail: 'ringed', tailColor: '#3A2410', tailTip: '#FFB72B' },

// SKINS: every look by id – 'w1.I' (world 2's I animal), 'sp.K3', …;
// world 1 uses the short ids 'meadow.I'. Also the Magic block.
const SKINS = {};
CASTS.forEach((cast, w) => {
  for (const [t, a] of Object.entries(cast)) SKINS[w ? `w${w}.${t}` : `meadow.${t}`] = { ...a, t, world: w };
});
SPECIALS.forEach(a => { SKINS['sp.' + a.key] = { ...a, special: true }; });
SKINS['meadow.M'] = { t: 'M', name: 'Magic block', color: '#FFD21F', custom: true };
const Cast = {
  regular: (t, w) => (t === 'M' ? 'meadow.M' : (w % CASTS.length) ? `w${w % CASTS.length}.${t}` : `meadow.${t}`),
  special: keyId => 'sp.' + keyId,
  specialFor: keyId => SPECIALS.find(s => s.key === keyId),
  // The look for a new piece: usually the world's animal, sometimes an unlocked special.
  pick(t, w) {
    const mine = SPECIALS.filter(s => s.t === t && Store.hasSpecial(s.key));
    if (mine.length && Math.random() < CONFIG.specialChance) return { skin: 'sp.' + mine[Math.floor(Math.random() * mine.length)].key, special: true };
    return { skin: this.regular(t, w), special: false };
  },
};

// SHAPES[type][rotation] = cells after rotating clockwise `rotation` times.
const SHAPES = {};

  for (let r = 1; r < 4; r++) SHAPES[t].push(SHAPES[t][r - 1].map(([x, y]) => [n - 1 - y, x]));
}

/* ---------- 5. Art ---------- */
const Art = (() => {
  const INK = '#2E2152';
  const cache = new Map();

  // drawing helpers (units = cells)
  const circle = (g, x, y, r) => { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); };
  const ell = (g, x, y, rx, ry, rot = 0) => { g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, Math.PI * 2); };
  const fill = (g, c) => { g.fillStyle = c; g.fill(); };
  function rr(g, x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }
  // Mix a hex color with white (amt > 0) or black (amt < 0).
  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16), to = amt > 0 ? 255 : 0, a = Math.abs(amt);
    const ch = s => Math.round(((n >> s) & 255) * (1 - a) + to * a);
    return `rgb(${ch(16)}, ${ch(8)}, ${ch(0)})`;
  }
  // A point of the rotated piece, in the upright (unrotated) frame.
  const toBase = (g, base, x, y) => base.inverse().transformPoint(g.getTransform().transformPoint(new DOMPoint(x, y)));

  // Glossy body tiles: light always comes from the top, whatever the rotation.
  function tiles(g, base, t, color) {
    const light = shade(color, .5), dark = shade(color, -.2);
    for (const [x, y] of PIECES[t].cells) {
      const c = toBase(g, base, x + .5, y + .5);
      rr(g, x + .05, y + .05, .9, .9, .26);
      g.save(); g.setTransform(base);
      const gr = g.createLinearGradient(0, c.y - .45, 0, c.y + .45);
      gr.addColorStop(0, light); gr.addColorStop(.42, color); gr.addColorStop(1, dark);
      g.fillStyle = gr; g.fill();
      g.lineWidth = .08; g.strokeStyle = INK; g.stroke();
      g.restore();
    }
  }
  // Shine on top of every tile, drawn last.
  function shine(g, base, t) {
    for (const [x, y] of PIECES[t].cells) {
      const c = toBase(g, base, x + .5, y + .5);
      g.save(); g.setTransform(base);
      rr(g, c.x - .28, c.y - .39, .5, .12, .06); fill(g, 'rgba(255, 255, 255, .6)');
      circle(g, c.x + .3, c.y - .33, .045); g.fill();
      g.restore();
    }
  }
  // Draws `fn` at (x, y) of the rotated piece, but keeps it upright so faces never go upside down.
  function upright(g, base, x, y, fn) {
    const q = toBase(g, base, x, y);
    g.save(); g.setTransform(base); g.translate(q.x, q.y); fn(); g.restore();
  }
  let MOOD = ''; // '' or 'happy' (just landed: closed smiling eyes)
  // Big cute eyes, rosy cheeks, smile. Origin = face center, k = size.
  function face(g, k = 1, opt = {}) {
    const ex = .19 * k, ey = -.06 * k, er = .15 * k;
    g.lineWidth = .035 * k; g.strokeStyle = INK;
    if (MOOD === 'happy') {
      g.lineWidth = .055 * k; g.lineCap = 'round';
      for (const s of [-1, 1]) { g.beginPath(); g.arc(s * ex, ey + .06 * k, er * .7, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke(); }
    } else {
      for (const s of [-1, 1]) {
        circle(g, s * ex, ey, er); fill(g, '#fff'); g.stroke();
        circle(g, s * ex + .015 * k, ey + .025 * k, er * .62); fill(g, INK);
        circle(g, s * ex + .05 * k, ey - .025 * k, er * .25); fill(g, '#fff');
      }
    }
    g.fillStyle = opt.cheek || 'rgba(255, 70, 140, .6)';
    ell(g, -.34 * k, .13 * k, .085 * k, .055 * k); g.fill();
    ell(g, .34 * k, .13 * k, .085 * k, .055 * k); g.fill();
    g.lineCap = 'round'; g.lineWidth = .045 * k; g.strokeStyle = INK;
    if (MOOD === 'happy') { // big open smile
      g.beginPath(); g.arc(0, .08 * k, .1 * k, 0, Math.PI); g.closePath(); fill(g, INK);
      ell(g, 0, .15 * k, .05 * k, .025 * k); fill(g, '#FF7AA2');
      return;
    }
    g.beginPath(); g.arc(0, .1 * k, .07 * k, .2 * Math.PI, .8 * Math.PI); g.stroke();
    if (opt.tongue) {
      g.strokeStyle = '#E8336D'; g.lineWidth = .04 * k; g.beginPath();
      g.moveTo(0, .18 * k); g.lineTo(0, .3 * k);
      g.moveTo(0, .3 * k); g.lineTo(-.05 * k, .36 * k);
      g.moveTo(0, .3 * k); g.lineTo(.05 * k, .36 * k); g.stroke();
    }
  }

  // A five-point star path centered at (x, y).
  function starShape(g, x, y, r) {
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r;
      g.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
    }
    g.closePath();
  }
  // A lighter belly patch along the bottom of the given cells.
  function belly(g, cells, color) {
    for (const [x, y] of cells) { rr(g, x + .13, y + .62, .74, .26, .12); fill(g, color); }
  }

  // One function per animal, drawn in its base orientation.

  const DRAW = {
    I(g, base) { // Snake: emerald, yellow belly, yellow-orange diamonds, dark stripes

        circle(g, i + .5, 1.42, .065); fill(g, '#FF7A1A');

    },
    O(g, base) { // Panda: black & white on bright pink, magenta bow
      tiles(g, base, 'O', PIECES.O.color);
      ell(g, .3, 1.75, .16, .07, -.6); fill(g, '#36D45A'); // bamboo leaf peeking out
      circle(g, .42, .4, .24); fill(g, INK);
      circle(g, 1.58, .4, .24); fill(g, INK);
      g.fillStyle = '#FF2E88'; // bow on the right ear
      g.beginPath(); g.moveTo(1.62, .3); g.lineTo(1.4, .14); g.lineTo(1.44, .44); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(1.62, .3); g.lineTo(1.84, .14); g.lineTo(1.8, .44); g.closePath(); g.fill();
      circle(g, 1.62, .3, .07); fill(g, '#FFD21F');
      ell(g, 1, 1.05, .8, .72); fill(g, '#fff'); g.lineWidth = .06; g.strokeStyle = INK; g.stroke();
      ell(g, .68, .98, .2, .25, .5); fill(g, INK);
      ell(g, 1.32, .98, .2, .25, -.5); fill(g, INK);
      for (const x of [.7, 1.3]) {
        if (MOOD === 'happy') {
          g.strokeStyle = '#fff'; g.lineWidth = .055; g.lineCap = 'round';
          g.beginPath(); g.arc(x, 1.02, .08, 1.15 * Math.PI, 1.85 * Math.PI); g.stroke();
          continue;
        }
        circle(g, x, .96, .1); fill(g, '#fff');
        circle(g, x + .01, .98, .06); fill(g, INK);
        circle(g, x + .03, .94, .025); fill(g, '#fff');
      }
      ell(g, 1, 1.22, .1, .07); fill(g, INK);
      g.lineWidth = .05; g.lineCap = 'round'; g.beginPath();
      g.moveTo(1, 1.28); g.quadraticCurveTo(.93, 1.4, .86, 1.33);
      g.moveTo(1, 1.28); g.quadraticCurveTo(1.07, 1.4, 1.14, 1.33); g.stroke();
      g.fillStyle = 'rgba(255, 46, 136, .55)';
      ell(g, .48, 1.28, .11, .065); g.fill(); ell(g, 1.52, 1.28, .11, .065); g.fill();
    },
    T(g, base) { // Turtle: turquoise skin, green shell with yellow rim and orange spots
      tiles(g, base, 'T', PIECES.T.color);
      for (const [x, y, r] of [[.3, 1.24, -.5], [2.7, 1.24, .5], [.3, 1.78, .5], [2.7, 1.78, -.5]]) {
        ell(g, x, y, .17, .11, r); fill(g, '#9DFBF6');
      }
      ell(g, 1.5, 1.5, 1.02, .38); fill(g, '#3FCB2E'); g.lineWidth = .09; g.strokeStyle = '#FFD21F'; g.stroke();
      ell(g, 1.5, 1.5, 1.08, .43); g.lineWidth = .04; g.strokeStyle = '#1F7A12'; g.stroke();
      for (const x of [.95, 1.5, 2.05]) { ell(g, x, 1.5, .19, .15); fill(g, '#A8F25A'); circle(g, x, 1.5, .07); fill(g, '#FF8A1F'); }
      upright(g, base, 1.5, .52, () => {

    L(g, base) { // Giraffe: amber, two-tone brown spots, cream belly, orange mane
      tiles(g, base, 'L', PIECES.L.color);
      belly(g, [[0, 1], [1, 1]], '#FFEDB8');
      for (const [x, y, r] of [[.38, 1.3, .13], [1.28, 1.34, .15], [2.3, 1.62, .13], [2.75, 1.28, .08], [2.28, .9, .07], [1.75, 1.3, .08]]) {
        ell(g, x, y, r, r * .85, .6); fill(g, '#8F3E0E');
        ell(g, x - r * .15, y - r * .15, r * .5, r * .42, .6); fill(g, '#D9701C');
      }
      g.lineWidth = .08; g.strokeStyle = '#E8501A'; g.lineCap = 'round'; // mane down the neck
      g.beginPath(); g.moveTo(2.12, .22); g.lineTo(2.12, .9); g.stroke();
      g.strokeStyle = '#8F3E0E'; g.lineWidth = .06;
      g.beginPath(); g.moveTo(.15, 1.3); g.lineTo(.13, 1.56); g.stroke();
      circle(g, .13, 1.62, .07); fill(g, '#E8501A');
      upright(g, base, 2.5, .56, () => {
        g.strokeStyle = '#8F3E0E'; g.lineWidth = .06; g.lineCap = 'round'; g.beginPath();
        g.moveTo(-.13, -.24); g.lineTo(-.16, -.36); g.moveTo(.13, -.24); g.lineTo(.16, -.36); g.stroke();
        circle(g, -.16, -.37, .06); fill(g, '#E8501A'); circle(g, .16, -.37, .06); fill(g, '#E8501A');
        face(g, .8, { cheek: 'rgba(255, 80, 60, .6)' });
      });
    },
    J(g, base) { // Elephant: bright blue, pink inner ear, light belly, cream toenails
      tiles(g, base, 'J', PIECES.J.color);
      belly(g, [[1, 1], [2, 1]], '#A9CCFF');
      for (const x of [.5, 1.5, 2.5]) { ell(g, x, 1.88, .14, .06); fill(g, '#FFF4D6'); }
      g.strokeStyle = '#1E4FC7'; g.lineWidth = .06; g.lineCap = 'round';

    S(g, base) { // Caterpillar: lime, yellow rings with orange centers, purple feet
      tiles(g, base, 'S', PIECES.S.color);
      belly(g, [[1, 0], [0, 1], [1, 1]], '#E9FFA6');

  }
  function gem(t, size) {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);

    let c = cache.get(key);
    if (c) return c;
    const { shape, color } = GEMS[t];
    c = document.createElement('canvas');
    c.width = c.height = Math.max(1, Math.round(size * dpr));
    const g = c.getContext('2d');

    gr.addColorStop(0, shade(color, .55)); gr.addColorStop(.45, color); gr.addColorStop(1, shade(color, -.25));

    gemPath(g, shape, .6); g.lineWidth = .04; g.strokeStyle = 'rgba(255, 255, 255, .45)'; g.stroke(); // inner facet
    const sy = shape === 'triangle' ? .5 : .3;
