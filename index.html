  return { get, drawCell, drawCentered, pieceCanvas, gem, colorOf, clear: () => cache.clear() };
})();

/* ---------- 6. Game ---------- */
// Rules work in a "logical" frame where pieces always fall down. On sideways
// key levels the board is only turned on screen (see Render.view) – the rules
// stay the same, and full logical rows show up as full columns.
const Game = (() => {
  const S = {
    board: null, piece: null, next: null, bag: [], pieceId: 0,
    cols: CONFIG.cols, rows: CONFIG.rows, gravity: 'down', key: false,
    level: 1, num: 1, world: 0, score: 0, base: 0, lines: 0, interval: 1000,
    fallT: 0, lockT: 0, lockResets: 0, status: 'idle', // idle | playing | paused | won | over
    clearing: null, // { rows, t } while full rows flash before clearing
    fast: false,   // fast fall on while the player holds it
    frozen: false, // stops falling while still accepting input (direction intro, Phase 2 tutorial)
    slowT: 0,          // Slow-mo booster: ms of half speed left
    magicNext: false,  // Magic block booster: the next piece is a single cell
    chanceUsed: false, // Second chance: once per level
  };
  const KICKS = [[0, 0], [-1, 0], [1, 0], [0, -1], [-2, 0], [2, 0], [-1, -1], [1, -1]];

  const emptyBoard = () => Array.from({ length: S.rows }, () => Array(S.cols).fill(null));

  function fromBag() { // "7-bag": every piece appears once before any repeats
    if (!S.bag.length) {
      S.bag = TYPES.slice();
      for (let i = S.bag.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [S.bag[i], S.bag[j]] = [S.bag[j], S.bag[i]];
      }
    }
    return S.bag.pop();
  }
  function collides(t, r, x, y) {
    for (const [cx, cy] of SHAPES[t][r]) {
      const bx = x + cx, by = y + cy;
      if (bx < 0 || bx >= S.cols || by >= S.rows) return true;
      if (by >= 0 && S.board[by][bx]) return true;
    }
    return false;
  }
  function spawn() {
    let t;
    if (S.magicNext) { t = 'M'; S.magicNext = false; } // the queued piece waits until after the magic block
    else { t = S.next; S.next = fromBag(); }
    const minY = Math.min(...SHAPES[t][0].map(c => c[1]));
    const look = t === 'M' ? { skin: 'meadow.M', special: false } : Cast.pick(t, S.world);
    S.piece = { t, r: 0, x: Math.floor((S.cols - PIECES[t].n) / 2), y: -minY, skin: look.skin };
    S.pieceId++;
    S.fallT = 0; S.lockT = 0; S.lockResets = 0; S.fast = false; // each new piece starts at normal speed
    if (collides(t, 0, S.piece.x, S.piece.y)) { end('over'); return; }
    Events.emit('spawn', { type: t, next: S.next, special: look.special });
  }
  function start(level) {
    Object.assign(S, Levels.setup(level), { world: Levels.world(level), num: Levels.num(level),
      bag: [], level, score: 0, base: 0, lines: 0,
      interval: Levels.interval(level), status: 'playing', frozen: false, clearing: null,
      slowT: 0, magicNext: false, chanceUsed: false,
    });
    S.board = emptyBoard();
    S.next = fromBag();
    Events.emit('start', { level, key: S.key, gravity: S.gravity });
    spawn();
  }
  const grounded = () => collides(S.piece.t, S.piece.r, S.piece.x, S.piece.y + 1);
  function afterShift() { // moving/rotating on the ground buys a bit more time
    if (grounded() && S.lockResets < CONFIG.maxLockResets) { S.lockT = 0; S.lockResets++; }
  }
  function move(dx, dy) {
    if (S.status !== 'playing' || !S.piece) return false;
    const p = S.piece;
    if (collides(p.t, p.r, p.x + dx, p.y + dy)) return false;
    p.x += dx; p.y += dy;
    if (dy > 0) S.fallT = 0; else afterShift();
    Events.emit('move', { dx, dy });
    return true;
  }
  function rotate() {
    if (S.status !== 'playing' || !S.piece || S.piece.t === 'O' || S.piece.t === 'M') return false;
    const p = S.piece, nr = (p.r + 1) % 4;
    for (const [kx, ky] of KICKS) {
      if (!collides(p.t, nr, p.x + kx, p.y + ky)) {
        p.x += kx; p.y += ky; p.r = nr;
        afterShift();
        Events.emit('rotate', {});
        return true;
      }
    }
    return false;
  }
  function ghostY() {
    const p = S.piece;
    let y = p.y;
    while (!collides(p.t, p.r, p.x, y + 1)) y++;
    return y;
  }
  // Instant drop (an extra option next to fast fall).
  function hardDrop() {
    if (S.status !== 'playing' || !S.piece) return false;
    const p = S.piece, from = p.y, to = ghostY();
    p.y = to;
    Events.emit('hardDrop', { type: p.t, r: p.r, x: p.x, from, to, skin: p.skin });
    lock();
    return true;
  }
  function lock() {
    const p = S.piece;
    let toppedOut = false;
    const cells = [];
    for (const [lx, ly] of SHAPES[p.t][p.r]) {
      const bx = p.x + lx, by = p.y + ly;
      if (by < 0) { toppedOut = true; continue; }
      S.board[by][bx] = { t: p.t, r: p.r, lx, ly, skin: p.skin };
      cells.push([bx, by]);
    }
    S.piece = null;
    Events.emit('lock', { type: p.t, cells });
    if (toppedOut) { end('over'); return; }
    const rows = [];
    for (let y = 0; y < S.rows; y++) if (S.board[y].every(Boolean)) rows.push(y);
    if (rows.length) { // full lines flash briefly, then clear (see update)
      S.clearing = { rows, t: 0 };
      Events.emit('rowsFull', { rows });
      return;
    }
    spawn();
  }
  function removeRows(rows) { // rows sorted top to bottom
    for (const y of rows) {
      S.board.splice(y, 1);
      S.board.unshift(Array(S.cols).fill(null));
    }
  }
  function finishClear() {
    const { rows, free } = S.clearing;
    S.clearing = null;
    removeRows(rows);
    if (free) { // cleared by a booster: no points, no lines, no stars
      const p = S.piece;
      while (p && collides(p.t, p.r, p.x, p.y) && p.y > -4) p.y--; // rows moved – keep the piece clear of them
      Events.emit('boardChanged', {});
      if (!S.piece) spawn();
      return;
    }
    const points = CONFIG.lineScores[Math.min(rows.length, 4)];
    S.base += points;
    S.score += Math.round(points * S.num * (S.key ? CONFIG.keyScoreBonus : 1));
    S.lines += rows.length;
    Events.emit('lines', { count: rows.length, total: S.lines, score: S.score });
    if (S.lines >= CONFIG.rowsPerLevel) { end('won'); return; }
    spawn();
  }
  function end(result) {
    S.status = result;
    S.piece = null;
    Events.emit(result === 'won' ? 'levelComplete' : 'gameOver', { level: S.level, score: S.score, base: S.base, lines: S.lines });
  }
  function update(dt) {
    if (S.status !== 'playing' || S.frozen) return;
    if (S.slowT > 0) S.slowT = Math.max(0, S.slowT - dt);
    if (S.clearing) {
      S.clearing.t += dt;
      if (S.clearing.t >= CONFIG.clearDelay) finishClear();
      return;
    }
    if (!S.piece) return;
    if (grounded()) {
      S.lockT += dt;
      if (S.lockT >= CONFIG.lockDelay) lock();
    } else {
      S.lockT = 0;
      S.fallT += dt;
      const normal = S.slowT > 0 ? S.interval * 2 : S.interval;
      const interval = S.fast ? Math.min(CONFIG.fastFallInterval, normal * CONFIG.fastFallFactor) : normal;
      if (S.fallT >= interval) { S.fallT = 0; S.piece.y++; }
    }
  }
  // Fast fall while held: the piece still falls step by step, just quicker.
  function setFastFall(on) {
    on = !!on && S.status === 'playing' && !!S.piece;
    if (on && !S.fast) S.fallT = Math.max(S.fallT, CONFIG.fastFallInterval); // react right away
    S.fast = on;
  }
  function freeze(on) { S.frozen = !!on; }
  function pause() { if (S.status === 'playing') { S.status = 'paused'; return true; } return false; }
  function resume() { if (S.status === 'paused') S.status = 'playing'; }
  function stars(base) {
    const t = CONFIG.starThresholds;
    return base >= t.three ? 3 : base >= t.two ? 2 : 1;
  }

  // ----- Boosters -----
  // Each returns true when it did something (only then is the item used up).
  // They never give points, never count toward the level's lines and never
  // affect stars. They work in the logical frame, so sideways levels just work.
  const canBoost = () => S.status === 'playing' && !S.clearing;
  function bomb(cx, cy) { // clear a 3×3 area of placed blocks
    if (!canBoost()) return false;
    const cells = [];
    for (let y = cy - 1; y <= cy + 1; y++) for (let x = cx - 1; x <= cx + 1; x++) {
      if (y < 0 || y >= S.rows || x < 0 || x >= S.cols || !S.board[y][x]) continue;
      cells.push([x, y, S.board[y][x].t, S.board[y][x].skin]);
      S.board[y][x] = null;
    }
    if (!cells.length) return false;
    Events.emit('blast', { cells, cx, cy });
    return true;
  }
  function swap() { // replace the current piece with a different one
    if (!canBoost() || !S.piece) return false;
    const p = S.piece;
    const choices = TYPES.filter(t => t !== p.t);
    const t = choices[Math.floor(Math.random() * choices.length)];
    const minY = Math.min(...SHAPES[t][0].map(c => c[1]));
    const spots = [[p.x, p.y], [p.x, Math.max(p.y, -minY)], [Math.floor((S.cols - PIECES[t].n) / 2), -minY]];
    const spot = spots.find(([x, y]) => !collides(t, 0, x, y));
    if (!spot) return false;
    const old = SHAPES[p.t][p.r].map(([lx, ly]) => [p.x + lx, p.y + ly]);
    S.piece = { t, r: 0, x: spot[0], y: spot[1], skin: Cast.pick(t, S.world).skin };
    S.pieceId++; S.lockT = 0; S.fast = false;
    Events.emit('swap', { type: t, cells: old });
    return true;
  }
  function slowMo() { if (!canBoost()) return false; S.slowT = CONFIG.slowMoMs; Events.emit('slowMo', {}); return true; }
  function magic() { if (!canBoost() || S.magicNext) return false; S.magicNext = true; Events.emit('magic', {}); return true; }
  function sweep() { // clear the bottom row (the far-side column on sideways levels)
    const y = S.rows - 1;
    if (!canBoost() || !S.board[y].some(Boolean)) return false;
    S.clearing = { rows: [y], t: 0, free: true };
    Events.emit('sweep', { row: y });
    Events.emit('rowsFull', { rows: [y] });
    return true;
  }
  function secondChance() { // after "Oops": clear the bottom rows and keep playing
    if (S.status !== 'over' || S.chanceUsed) return false;
    S.chanceUsed = true;
    removeRows(Array.from({ length: CONFIG.secondChanceRows }, (_, i) => S.rows - CONFIG.secondChanceRows + i));
    S.status = 'playing';
    Events.emit('continue', {});
    spawn();
    return true;
  }
  return {
    state: S, start, move, rotate, setFastFall, hardDrop, freeze, ghostY, update, pause, resume, stars,
    bomb, swap, slowMo, magic, sweep, secondChance,
  };
})();

/* ---------- 7. Effects ---------- */
// Visual effects only: they listen to game events and never change the rules,
// so the controls never wait for them. Two layers:
//  - the board layer (logical frame, turns with sideways boards): landing,
//    line flashes, booster effects, the happy dance;
//  - the screen layer (a full-screen canvas): the level-complete party.
// Particles come from fixed pools that are reused (no garbage, capped counts)
// so older iPhones stay smooth. Every effect also emits Events 'fx' { name }
// – the place to attach sounds later.
const Effects = (() => {
  const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const rand = (a, b) => a + Math.random() * (b - a);
  const TAU = Math.PI * 2;
  const sfx = (name, data) => Events.emit('fx', { name, ...data });
  const key = (x, y) => y * Game.state.cols + x;
  const RAINBOW = ['#FF5E8A', '#FFB000', '#FFE14D', '#3DDC5A', '#1FD0F0', '#8A4DFF'];

  // A reusable particle pool. Full pool = new particles are simply skipped.
  function makePool(size) {
    const items = Array.from({ length: size }, () => ({ alive: false }));
    let cursor = 0;
    return {
      items,
      add(p) {
        for (let n = 0; n < size; n++) {
          const i = (cursor + n) % size, it = items[i];
          if (it.alive) continue;
          it.alive = true; it.life = 0; it.g = 0; it.spin = 0; it.rot = 0; it.floor = 0; it.delay = 0; it.color = '#fff';
          Object.assign(it, p);
          cursor = i + 1;
          return it;
        }
        return null;
      },
      clear() { for (const it of items) it.alive = false; },
      any() { return items.some(it => it.alive); },
    };
  }
  const board = makePool(320), screen = makePool(300);
  let landing = null, flash = null, shake = 0, trail = null, dropped = false;
  let bombFlash = null, rings = [], broom = null, dance = null, magicT = 0;

  // ----- Board layer -----
  function onLock({ cells }) {
    if (!cells.length) return;
    const set = new Set(cells.map(([x, y]) => key(x, y)));
    const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
    const power = dropped ? 1.6 : 1; // instant drop lands a bit harder
    dropped = false;
    landing = { set, t: 0, power, cx: (Math.min(...xs) + Math.max(...xs) + 1) / 2, by: Math.max(...ys) + 1 };
    for (const [x, y] of cells) { // a puff of dust from under the piece
      if (set.has(key(x, y + 1))) continue;
      for (let i = 0; i < (power > 1 ? 5 : 3); i++) {
        board.add({ kind: 'dust', x: x + .5 + rand(-.35, .35), y: y + .95, vx: rand(-1.8, 1.8) * power, vy: rand(-1.4, -.4) * power, max: rand(260, 380), size: rand(.13, .22) });
      }
    }
    for (let i = 0; i < 2; i++) { // and a couple of sparkles
      const [x, y] = cells[Math.floor(Math.random() * cells.length)];
      board.add({ kind: 'spark', x: x + rand(.1, .9), y: y + rand(.1, .5), vx: rand(-.8, .8), vy: rand(-2.2, -1.2), max: rand(300, 420), size: rand(.16, .24), color: '#FFF3A0' });
    }
    sfx('land', { hard: power > 1 });
  }
  function onRowsFull({ rows }) { // more lines at once = more, faster particles
    const S = Game.state, n = rows.length;
    const per = 1 + n, power = 1 + n * .35;
    flash = { rows, t: 0 };
    for (const y of rows) for (let x = 0; x < S.cols; x++) {
      const c = S.board[y][x], color = c ? Art.colorOf(c.t, S.key, c.skin) : '#fff';
      for (let i = 0; i < per; i++) {
        const spark = Math.random() < .3;
        board.add({
          kind: spark ? 'spark' : 'bit', x: x + .5, y: y + .5,
          vx: rand(-3, 3) * power, vy: rand(-6, -1.5) * (1 + n * .15), g: 16, spin: rand(-8, 8),
          max: rand(360, 480), size: rand(.14, .24) * (1 + n * .08), color: spark ? '#FFF3A0' : color,
        });
      }
    }
    if (n >= 2 && !reduced) shake = 120 + n * 40;
    sfx('lines', { count: n });
  }
  function onLines({ count }) {
    landing = null; // lines moved – the landed piece may be gone
    if (count >= 3) cheer(count >= 4 ? 'Amazing!' : 'Super!');
  }
  // A big bouncy word over the board with sparkles.
  function cheer(text) {
    const el = document.getElementById('cheer');
    el.textContent = text;
    el.hidden = false;
    el.classList.remove('go'); void el.offsetWidth; el.classList.add('go');
    clearTimeout(cheer.timer);
    cheer.timer = setTimeout(() => { el.hidden = true; }, 1100);
    const S = Game.state;
    for (let i = 0; i < 24; i++) board.add({ kind: 'spark', x: S.cols / 2 + rand(-3, 3), y: S.rows * .45 + rand(-2, 2), vx: rand(-4, 4), vy: rand(-5, 1), g: 4, max: rand(450, 700), size: rand(.2, .35), color: RAINBOW[i % RAINBOW.length] });
    sfx('cheer', { text });
  }
  function onHardDrop({ type, r, x, from, to, skin }) { // a quick streak behind the dropping piece
    dropped = true;
    if (to - from < 1) return;
    const cols = new Map(); // column -> top-most cell row of the piece (in its box)
    for (const [lx, ly] of SHAPES[type][r]) if (!cols.has(lx) || ly < cols.get(lx)) cols.set(lx, ly);
    const color = Art.colorOf(type, Game.state.key, skin);
    trail = { t: 0, color, streaks: [...cols].map(([lx, ly]) => ({ x: x + lx, y0: Math.max(0, from + ly), y1: to + ly })) };
    sfx('drop');
  }
  // 💣 A big pixel explosion: flash, shockwave, square pixels that bounce, smoke, shake.
  function onBlast({ cells, cx, cy }) {
    const S = Game.state;
    bombFlash = { x: cx + .5, y: cy + .5, t: 0 };
    rings.push({ x: cx + .5, y: cy + .5, t: 0, max: 380, r1: 3.6, color: '255, 255, 255', w: .35 });
    for (const [x, y, t, skin] of cells) {
      const color = Art.colorOf(t, S.key, skin);
      for (let i = 0; i < 9; i++) {
        board.add({
          kind: 'pixel', x: x + rand(.15, .85), y: y + rand(.15, .85), vx: rand(-7, 7), vy: rand(-10, -2), g: 24,
          spin: rand(-6, 6), max: rand(600, 850), size: rand(.1, .2), color: Math.random() < .2 ? '#FFF3A0' : color, floor: S.rows,
        });
      }
    }
    for (let i = 0; i < 7; i++) board.add({ kind: 'smoke', x: cx + .5 + rand(-1, 1), y: cy + .5 + rand(-1, 1), vx: rand(-.6, .6), vy: rand(-1.4, -.4), max: rand(500, 700), size: rand(.35, .6) });
    if (!reduced) shake = 260;
    sfx('bomb');
  }
  // 🔄 Swap: a poof cloud where the old piece was.
  function onSwap({ cells }) {
    for (const [x, y] of cells) {
      for (let i = 0; i < 3; i++) board.add({ kind: 'puff', x: x + .5 + rand(-.3, .3), y: y + .5 + rand(-.3, .3), vx: rand(-1, 1), vy: rand(-1, 1), max: rand(300, 420), size: rand(.3, .45) });
      board.add({ kind: 'spark', x: x + .5, y: y + .5, vx: rand(-2, 2), vy: rand(-2.5, -.5), max: 380, size: .2, color: '#FFF3A0' });
    }
    sfx('swap');
  }
  // ⏳ Slow-mo: blue clock ripples from the middle (the blue tint is drawn by Render).
  function onSlow() {
    const S = Game.state;
    for (let i = 0; i < 3; i++) rings.push({ x: S.cols / 2, y: S.rows / 2, t: -i * 160, max: 700, r1: Math.max(S.cols, S.rows) * .55, color: '110, 190, 255', w: .3 });
    sfx('slowMo');
  }
  // ⭐ Magic block: a rainbow burst now, and a sparkle trail while it falls (see update).
  function onMagic() { sfx('magic'); }
  // 🧹 Sweep: a broom swishes across the row.
  function onSweep({ row }) { broom = { row, t: 0 }; sfx('sweep'); }
  // ❤️ Second chance: hearts burst up from the bottom.
  function onContinue() {
    landing = null; trail = null;
    const S = Game.state;
    for (let i = 0; i < 26; i++) board.add({ kind: 'heart', x: rand(0, S.cols), y: S.rows - rand(0, 3), vx: rand(-1.5, 1.5), vy: rand(-9, -4), g: 3, spin: rand(-2, 2), max: rand(700, 1000), size: rand(.25, .42), color: Math.random() < .5 ? '#FF4F8B' : '#FF8DB8' });
    sfx('secondChance');
  }
  // A special animal arrives: a rainbow sparkle around it.
  function onSpawn({ special }) {
    if (!special) return;
    const p = Game.state.piece;
    if (!p) return;
    for (const [lx, ly] of SHAPES[p.t][p.r]) for (let i = 0; i < 3; i++) {
      board.add({ kind: 'spark', x: p.x + lx + rand(0, 1), y: p.y + ly + rand(0, 1), vx: rand(-2, 2), vy: rand(-2, 2), max: rand(400, 600), size: rand(.18, .28), color: RAINBOW[i * 2 % RAINBOW.length] });
    }
    sfx('special');
  }
  function reset() {
    board.clear(); screen.clear(); rings = [];
    landing = null; flash = null; shake = 0; trail = null; dropped = false; bombFlash = null; broom = null; dance = null;
    const el = document.getElementById('cheer'); if (el) el.hidden = true;
  }

  // ----- Screen layer: the level-complete party -----
  let fxCanvas, fx, W = 0, H = 0, dpr = 1, screenOn = false;
  function sizeScreen() {
    fxCanvas = fxCanvas || document.getElementById('fx');
    fx = fx || fxCanvas.getContext('2d');
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    fxCanvas.width = Math.round(W * dpr); fxCanvas.height = Math.round(H * dpr);
  }
  function celebrate() {
    dance = { t: 0 };
    sfx('levelComplete');
    if (reduced) return;

    osc.start(t); osc.stop(t + dur + rel + .05);
  }
  // A puff of filtered noise (whoosh, poof, boom, shaker).
  function noise(t, dur, o = {}) {
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noiseBuf;
    f.type = o.filter || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const a = o.attack || .005, peak = o.gain || .1;
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(f); f.connect(g);
    connectOut(g, o.bus || sfxBus, t, o.pan, o.panTo, dur);
    src.start(t, Math.random() * .5); src.stop(t + dur + .05);
  }
  function connectOut(node, bus, t, pan, panTo, dur) {
    if (pan === undefined || !ctx.createStereoPanner) { node.connect(bus); return; }
    const p = ctx.createStereoPanner();
    p.pan.setValueAtTime(pan, t);
    if (panTo !== undefined) p.pan.linearRampToValueAtTime(panTo, t + dur);
    node.connect(p); p.connect(bus);
  }

  // ----- Music instruments -----
  function lead(T, t, midi, dur) {
    const f = hz(midi), m = { bus: tuneOut };
    switch (T.lead) {
      case 'flute': tone(t, f, dur * .9, { ...m, type: 'triangle', hold: true, attack: .04, release: .12, gain: .13, vib: [5, f * .006], lp: 2600 }); break;
      case 'marimba':
        tone(t, f, .45, { ...m, gain: .2, attack: .004 });
        tone(t, f * 4, .06, { ...m, gain: .025, attack: .002 }); break;
      case 'bell':
        tone(t, f, 1.3, { ...m, gain: .12, attack: .004 });
        tone(t, f * 3, .35, { ...m, gain: .02, attack: .002 }); break;
      case 'chip': tone(t, f, dur * .8, { ...m, type: 'square', hold: true, attack: .006, release: .06, gain: .045, lp: 1800 }); break;
      default: // 'piano'
        tone(t, f, Math.max(.6, dur * 1.4), { ...m, type: 'triangle', gain: .14, attack: .006 });
        tone(t, f * 2, .3, { ...m, gain: .025, attack: .004 });
    }
  }
  function arpNote(T, t, midi, dur) {
    const f = hz(midi), m = { bus: tuneOut };
    if (T.arpInst === 'bubble') tone(t, f, .22, { ...m, gain: .045, attack: .01, to: f * 1.06, glide: .1 });
    else tone(t, f, Math.max(.22, dur), { ...m, type: 'triangle', gain: .05, attack: .004, lp: 2200 });
  }
  function drum(ch, t) {
    const m = { bus: tuneOut };
    if (ch === 'k') tone(t, 110, .14, { ...m, to: 45, gain: .2, attack: .003 });
    else if (ch === 'h') noise(t, .035, { ...m, filter: 'highpass', freq: 7000, gain: .025 });
    else if (ch === 's') noise(t, .09, { ...m, freq: 5200, q: 2, gain: .03, attack: .02 });
    else if (ch === 'b') { tone(t, 880, .06, { ...m, gain: .06, attack: .002 }); tone(t, 1320, .04, { ...m, gain: .02, attack: .002 }); }
  }
  // Chord tones of the bar's chord: 0 root, 1 third, 2 fifth, 3 octave.
  const chordTone = (T, c, i) => degree(T, c + [0, 2, 4, 7][i]);
  function playStep(tr, t) {
    const T = tr.tune, stepDur = 60 / T.bpm / 2;
    const bar = Math.floor(tr.step / T.beat) % T.chords.length, i = tr.step % T.beat, c = T.chords[bar];
    const holdFrom = (steps, at) => { let n = 1; while (steps[at + n] === '-') n++; return n * stepDur; };
    const mel = T.mel[bar], tok = mel[i];
    if (tok !== '.' && tok !== '-') lead(T, t, degree(T, +tok) + 12, holdFrom(mel, i));
    const b = T.bassSteps[i];
    if (b === 'R' || b === '5') {
      const f = hz(degree(T, c + (b === '5' ? 4 : 0)) - 24), dur = holdFrom(T.bassSteps, i);
      tone(t, f, dur * .9, { bus: tuneOut, type: 'triangle', hold: true, attack: .01, release: .1, gain: .16, lp: 500 });
    }
    const a = T.arpSteps && T.arpSteps[i];
    if (a === 'c') [0, 1, 2].forEach(k => arpNote(T, t, chordTone(T, c, k) + (T.arpOct ?? 12), stepDur));
    else if (a && a !== '.') arpNote(T, t, chordTone(T, c, +a) + (T.arpOct ?? 12), stepDur);
    if (T.pad && i === 0) { // soft strings: the chord, held for the whole bar
      const dur = stepDur * T.beat;
      for (const k of [0, 1, 2]) for (const det of [-7, 7]) {
        tone(t, hz(chordTone(T, c, k)), dur, { bus: tuneOut, type: 'triangle', hold: true, attack: .35, release: .5, gain: .018, detune: det, lp: 1200 });
      }
    }
    drum(T.drums[i], t);
  }

  // ----- Which tune plays where -----
  // The level's tune in a level (also while paused in Settings or the shop),
  // nothing on "Well done!" / "Oops!", the calm map tune everywhere else.
  function wanted() {
    if (!S('music')) return null;
    const G = Game.state, screen = UI.current;
    const inLevel = screen === 'game' || ((screen === 'settings' || screen === 'shop') && G.status === 'paused');
    if (!inLevel) return 'map';
    if (G.status === 'won' || G.status === 'over') return null;
    return G.key ? 'key' : WORLD_TUNES[Levels.world(G.level) % WORLD_TUNES.length];
  }
  function switchTo(name) {
    if (track) { // fade the old tune out
      const out = track.out;
      out.gain.setTargetAtTime(0, ctx.currentTime, .3);
      setTimeout(() => out.disconnect(), 2000);
    }
    track = null;
    if (!name) return;
    const out = ctx.createGain();
    out.gain.setValueAtTime(0, ctx.currentTime);
    out.gain.setTargetAtTime(TUNES[name].vol || 1, ctx.currentTime + .2, .5);
    out.connect(duckBus);
    track = { name, tune: TUNES[name], step: 0, next: ctx.currentTime + .25, out };
  }
  // Runs every 25 ms: picks the tune and schedules its notes a moment ahead.
  function tick() {
    if (!ctx || ctx.state !== 'running') return;
    const name = wanted();
    if (name !== (track ? track.name : null)) switchTo(name);
    duckBus.gain.setTargetAtTime(Game.state.status === 'paused' ? .4 : 1, ctx.currentTime, .2); // quieter while paused
    if (!track) return;
    const T = track.tune, stepDur = 60 / T.bpm / 2;
    if (track.next < ctx.currentTime) track.next = ctx.currentTime + .05; // woke up late: skip ahead
    tuneOut = track.out;
    while (track.next < ctx.currentTime + .15) { playStep(track, track.next); track.next += stepDur; track.step++; }
  }

  // ----- Sound effects -----
  const N = { C5: 72, E5: 76, G5: 79, C6: 84, E6: 88, G6: 91, C7: 96 };
  const PENTA = [0, 2, 4, 7, 9];
  const penta = (base, i) => base + PENTA[i % 5] + 12 * Math.floor(i / 5);
  let moveFlip = false;
  const SFX = {
    move() { moveFlip = !moveFlip; tone(now(), moveFlip ? 1050 : 990, .035, { gain: .045, attack: .003 }); },
    rotate() { tone(now(), 520, .08, { type: 'triangle', to: 860, gain: .1, attack: .005 }); },
    land({ hard }) {
      const t = now();
      tone(t, hard ? 170 : 150, .11, { to: 70, gain: hard ? .22 : .15, attack: .003 });
      noise(t, .07, { filter: 'lowpass', freq: 450, gain: hard ? .08 : .05 });
    },
    lines({ count }) { // one more note for every extra row
      const t = now(), notes = [N.C5, N.E5, N.G5, N.C6, N.E6, N.G6].slice(0, Math.min(6, count + 2));
      notes.forEach((m, i) => {
        tone(t + i * .06, hz(m), .35, { gain: .1, attack: .004 });
        tone(t + i * .06, hz(m), .25, { type: 'triangle', gain: .05, attack: .004 });
      });
    },
    cheer() { // "Super!" / "Amazing!": a sparkly run and a happy chord
      const t = now() + .12;
      for (let i = 0; i < 9; i++) tone(t + i * .035, hz(penta(N.G5, i)), .2, { gain: .05, attack: .003, pan: -.6 + i * .15 });
      [N.C5, N.E5, N.G5, N.C6].forEach(m => tone(t + .32, hz(m), .5, { type: 'triangle', hold: true, attack: .02, release: .35, gain: .045 }));
    },
    drop() { // whoosh
      const t = now();
      noise(t, .16, { freq: 2600, to: 380, q: 1.2, gain: .22 });
      tone(t, 700, .12, { to: 220, gain: .07 });
    },
    bomb() { // a soft, round boom – low-passed, never a crack
      const t = now();
      noise(t, .6, { filter: 'lowpass', freq: 900, to: 120, gain: .35, attack: .01 });
      tone(t, 120, .45, { to: 38, gain: .3, attack: .005 });
      [N.C7, N.G6, N.E6].forEach((m, i) => tone(t + .25 + i * .07, hz(m), .2, { gain: .025 }));
    },
    swap() { // poof!
      const t = now();
      noise(t, .2, { freq: 1300, q: .8, gain: .25, attack: .01 });
      tone(t + .05, 420, .12, { type: 'triangle', to: 950, gain: .12 });
    },
    slowMo() { // everything slows down: a wobbly slide down
      const t = now();
      tone(t, 660, .8, { to: 250, glide: .8, gain: .11, vib: [6, 14], hold: true, attack: .02, release: .2 });
      tone(t, 990, .8, { to: 375, glide: .8, gain: .03, hold: true, attack: .02, release: .2 });
    },
    magic() { // twinkly bells going up
      const t = now();
      for (let i = 0; i < 7; i++) tone(t + i * .055, hz(penta(N.C6, i)), .4, { gain: .1, attack: .003, pan: i % 2 ? .5 : -.5 });
    },
    sweep() { // swish from left to right
      const t = now();
      noise(t, .45, { freq: 700, to: 3200, q: 1.2, gain: .45, attack: .06, pan: -.8, panTo: .8 });
      noise(t + .08, .3, { filter: 'highpass', freq: 3000, gain: .08, attack: .05, pan: -.4, panTo: .9 });
    },
    secondChance() { // a heartbeat, then a warm rising chord
      const t = now();
      tone(t, 95, .12, { gain: .22 }); tone(t + .2, 90, .15, { gain: .18 });
      [N.C5, N.E5, N.G5, N.C6].forEach((m, i) => tone(t + .45 + i * .09, hz(m), .5, { type: 'triangle', gain: .08, attack: .01 }));
    },
    special() { // a special animal arrives
      const t = now();
      [N.C7, 100, 103].forEach((m, i) => tone(t + i * .07, hz(m), .3, { gain: .06 }));
    },
    levelComplete() { // fanfare
      const t = now();
      [N.C5, N.E5, N.G5].forEach((m, i) => tone(t + i * .12, hz(m), .1, { type: 'triangle', hold: true, gain: .1, release: .06 }));
      [N.C5, N.E5, N.G5, N.C6].forEach(m => tone(t + .38, hz(m), .7, { type: 'triangle', hold: true, attack: .01, release: .5, gain: .06 }));
      tone(t + .38, hz(48), .7, { type: 'triangle', hold: true, release: .4, gain: .12 });
    },
    // "Well done!" panel: a ding for every star as it pops in, then the chest.
    winScreen({ stars, chest }) {
      const t = now();
      for (let i = 0; i < stars; i++) {
        const at = t + .5 + i * .25;
        tone(at, hz([N.C6, N.E6, N.G6][i]), .6, { gain: .1, attack: .003 });
        tone(at, hz([N.C6, N.E6, N.G6][i] + 12), .25, { gain: .025, attack: .002 });
      }
      if (!chest) return;
      for (const d of [.55, .7, .85, 1]) tone(t + d, 260, .05, { type: 'triangle', gain: .06 }); // rattle
      tone(t + 1.1, 300, .14, { type: 'triangle', to: 900, gain: .09 }); // the lid pops
      for (let i = 0; i < 6; i++) tone(t + 1.15 + i * .04, hz(penta(N.G6, i)), .25, { gain: .03 });
      for (let i = 0; i < 3; i++) tone(t + 1.35 + i * .15, 600, .07, { to: 1250, gain: .06 }); // items pop out
      // New friend: ta-da!
      [N.G5, N.C6].forEach((m, i) => tone(t + 1.95 + i * .12, hz(m), .12, { type: 'triangle', hold: true, gain: .09 }));
      [N.C6, N.E6, N.G6].forEach(m => tone(t + 2.2, hz(m), .6, { gain: .05, attack: .01 }));
    },
    coins({ amount }) { // ching-ching while the number counts up (same easing as the counter)
      const t = now() + .02, n = Math.max(3, Math.min(12, Math.round(amount / 20)));
      for (let k = 0; k < n; k++) {
        const at = t + .9 * (1 - Math.cbrt(1 - k / n));
        tone(at, 1568 + k * 30, .06, { gain: .06, attack: .002 });
        tone(at + .03, 2093 + k * 40, .09, { gain: .05, attack: .002 });
      }
    },
    oops() { // "uh-oh" – soft and friendly
      const t = now();
      tone(t, hz(67), .18, { type: 'triangle', hold: true, attack: .02, release: .08, gain: .11 });
      tone(t + .24, hz(64), .3, { type: 'triangle', hold: true, attack: .02, release: .25, gain: .1, to: hz(62), glide: .45, vib: [5, 4] });
    },
    tap() { tone(now(), 620, .05, { to: 900, gain: .055, attack: .003 }); },
  };
  const now = () => ctx.currentTime + .005;
  function play(name, data = {}) {
    if (!ctx || ctx.state !== 'running' || !S('sfx') || !SFX[name]) return;
    SFX[name](data);
  }

  // ----- Vibration (Android; quietly skipped where phones don't support it) -----
  const BUZZ = { land: 8, drop: 15, lines: 30, bomb: [40, 30, 60], secondChance: [20, 60, 20], levelComplete: [30, 40, 30, 40, 60], oops: 40 };
  function buzz(name) {
    if (!BUZZ[name] || !S('vibrate') || !navigator.vibrate) return;
    try { navigator.vibrate(BUZZ[name]); } catch (e) { /* not allowed – ignore */ }
  }

  ['pointerdown', 'touchend', 'mousedown', 'keydown'].forEach(ev => window.addEventListener(ev, unlock, true));
  document.addEventListener('visibilitychange', () => { // silence in the background
    if (!ctx) return;
    if (document.hidden) ctx.suspend().catch(() => {}); else ctx.resume().catch(() => {});
  });
  Events.on('fx', ({ name, ...data }) => { play(name, data); buzz(name); });
  Events.on('move', ({ dx }) => { if (dx) play('move'); });
  Events.on('rotate', () => play('rotate'));
  // A soft pop for every button (boosters have their own sounds).
  document.addEventListener('click', e => { const b = e.target.closest('button'); if (b && !b.classList.contains('booster')) play('tap'); }, true);
  return { play, applyVolumes, unlock, state: () => (ctx ? ctx.state : 'off'), tune: () => (track ? track.name : null), TUNES };
})();

/* ---------- 8. Scene ---------- */
// World backgrounds, painted in code: a static picture plus a few gently
// moving things (petals, dust, bubbles, snow, twinkling stars).
const Scene = (() => {
  const TAU = Math.PI * 2;
  const seeded = seed => () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function vgrad(g, H, stops) {
    const gr = g.createLinearGradient(0, 0, 0, H);
    stops.forEach(([o, c]) => gr.addColorStop(o, c));
    return gr;
  }
  function puff(g, x, y, r, color) { // a soft cartoon cloud
    g.fillStyle = color;
    for (const [dx, dy, k] of [[0, 0, 1], [-.9, .25, .7], [.9, .25, .72], [-.45, -.3, .75], [.45, -.35, .7]]) {
      g.beginPath(); g.arc(x + dx * r, y + dy * r, r * k, 0, TAU); g.fill();
    }
  }
  function hill(g, W, H, y0, y1, bump, fill) {
    g.beginPath(); g.moveTo(0, y0);
    g.bezierCurveTo(W * .3, y0 - bump, W * .6, y1 + bump * .4, W, y1);
    g.lineTo(W, H); g.lineTo(0, H); g.closePath();
    g.fillStyle = fill; g.fill();
  }
  function flower(g, x, y, r, petal) {
    g.fillStyle = petal;
    for (let i = 0; i < 5; i++) { const a = i * TAU / 5; g.beginPath(); g.arc(x + Math.cos(a) * r, y + Math.sin(a) * r, r * .75, 0, TAU); g.fill(); }
    g.fillStyle = '#FFB000'; g.beginPath(); g.arc(x, y, r * .6, 0, TAU); g.fill();
  }
  function sun(g, x, y, r, inner, outer, glow) {
    const gl = g.createRadialGradient(x, y, r * .5, x, y, r * 3);
    gl.addColorStop(0, glow); gl.addColorStop(1, 'rgba(255, 255, 255, 0)');
    g.fillStyle = gl; g.beginPath(); g.arc(x, y, r * 3, 0, TAU); g.fill();
    const s = g.createRadialGradient(x - r * .3, y - r * .3, r * .1, x, y, r);
    s.addColorStop(0, inner); s.addColorStop(1, outer);
    g.fillStyle = s; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill();
  }

  const PAINT = [
    function meadow(g, W, H, R) {
      g.fillStyle = vgrad(g, H, [[0, '#3FB4FF'], [.55, '#A5E2FF'], [1, '#E2F7FF']]); g.fillRect(0, 0, W, H);
      const u = Math.min(W, 420);
      sun(g, W * .82, Math.min(H * .1, 90), u * .09, '#FFFBD0', '#FFC93C', 'rgba(255, 236, 140, .75)');
      for (let i = 0; i < 4 + H / 300; i++) puff(g, R() * W, H * (.06 + R() * .5), u * (.05 + R() * .04), 'rgba(255, 255, 255, .95)');
      hill(g, W, H, H * .7, H * .64, H * .05, '#8FE36A');
      hill(g, W, H, H * .8, H * .77, H * .04, vgrad(g, H, [[.75, '#62D646'], [1, '#2F9E2A']]));
      const petals = ['#FF6FB1', '#FFFFFF', '#FFD23F', '#B57CFF', '#FF8A3D'];
      for (let i = 0; i < 26 + W / 12; i++) flower(g, R() * W, H * (.8 + R() * .19), 3 + R() * 4, petals[i % petals.length]);
      g.strokeStyle = '#2F9E2A'; g.lineWidth = 2; g.lineCap = 'round';
      for (let i = 0; i < 30; i++) { const x = R() * W, y = H * (.72 + R() * .27); g.beginPath(); g.moveTo(x, y); g.lineTo(x - 3, y - 8); g.moveTo(x, y); g.lineTo(x + 3, y - 9); g.stroke(); }
    },
    function kingdom(g, W, H, R) {
      g.fillStyle = vgrad(g, H, [[0, '#FF5E8A'], [.35, '#FF8F4D'], [.62, '#FFC85A'], [.7, '#FFE08A']]); g.fillRect(0, 0, W, H);
      const u = Math.min(W, 420);
      sun(g, W * .5, H * .66, u * .2, '#FFF6C0', '#FFA23A', 'rgba(255, 200, 90, .7)');
      g.fillStyle = 'rgba(196, 80, 110, .75)'; g.beginPath(); g.moveTo(0, H * .67);
      for (let x = 0; x <= W; x += W / 6) g.quadraticCurveTo(x + W / 12, H * (.6 + R() * .04), x + W / 6, H * .67);
      g.lineTo(W, H); g.lineTo(0, H); g.fill();
      g.fillStyle = vgrad(g, H, [[.66, '#F6BC52'], [1, '#C9792B']]); g.fillRect(0, H * .68, W, H * .32);
      g.strokeStyle = '#A85E1E'; g.lineWidth = 2; g.lineCap = 'round';
      for (let i = 0; i < 40; i++) { const x = R() * W, y = H * (.7 + R() * .29); g.beginPath(); g.moveTo(x, y); g.lineTo(x + 2, y - 7); g.stroke(); }
      for (const [fx, fy, k] of [[.18, .72, 1], [.8, .76, 1.25], [.55, .7, .7]]) { // acacia trees
        const x = W * fx, y = H * fy, s = u * .11 * k;
        g.strokeStyle = '#5A2E1A'; g.lineWidth = s * .14;
        g.beginPath(); g.moveTo(x, y); g.lineTo(x, y - s * 1.1); g.lineTo(x - s * .5, y - s * 1.6); g.moveTo(x, y - s * 1.1); g.lineTo(x + s * .55, y - s * 1.65); g.stroke();
        g.fillStyle = '#3F6B1F'; g.beginPath(); g.ellipse(x, y - s * 1.75, s * 1.2, s * .32, 0, 0, TAU); g.fill();
        g.fillStyle = '#5E8F2A'; g.beginPath(); g.ellipse(x - s * .1, y - s * 1.85, s * 1.0, s * .22, 0, 0, TAU); g.fill();
      }
      g.strokeStyle = 'rgba(110, 40, 60, .8)'; g.lineWidth = 2;
      for (let i = 0; i < 4; i++) { const x = W * (.2 + R() * .6), y = H * (.12 + R() * .3); g.beginPath(); g.moveTo(x - 6, y - 3); g.quadraticCurveTo(x - 3, y - 6, x, y); g.quadraticCurveTo(x + 3, y - 6, x + 6, y - 3); g.stroke(); }
    },
    function ocean(g, W, H, R) {
      g.fillStyle = vgrad(g, H, [[0, '#3FDAF5'], [.4, '#1593D6'], [1, '#0A3E85']]); g.fillRect(0, 0, W, H);
      g.fillStyle = 'rgba(255, 255, 255, .1)';
      for (let i = 0; i < 5; i++) { const x = W * (i / 5 + R() * .1); g.beginPath(); g.moveTo(x, 0); g.lineTo(x + W * .08, 0); g.lineTo(x + W * .25, H * .8); g.lineTo(x + W * .1, H * .8); g.fill(); }
      g.strokeStyle = 'rgba(255, 255, 255, .45)'; g.lineWidth = 1.5;
      for (let i = 0; i < 18; i++) { g.beginPath(); g.arc(R() * W, R() * H * .8, 2 + R() * 6, 0, TAU); g.stroke(); }
      const coral = (x, y, len, ang, w, color, depth) => {
        if (depth === 0) return;
        const x2 = x + Math.cos(ang) * len, y2 = y + Math.sin(ang) * len;
        g.strokeStyle = color; g.lineWidth = w; g.lineCap = 'round';
        g.beginPath(); g.moveTo(x, y); g.lineTo(x2, y2); g.stroke();
        coral(x2, y2, len * .72, ang - .45, w * .72, color, depth - 1);
        coral(x2, y2, len * .72, ang + .4, w * .72, color, depth - 1);
      };

/* ---------- 9. Render ---------- */
const Render = (() => {
  let board, ctx, next, nctx, frame, bg = null, cell = 24, dpr = 1, shook = false;

  let view = { a: 1, b: 0, c: 0, d: 1, e: 0, f: 0 };

  function viewFor(S) {

    next = document.getElementById('next'); nctx = next.getContext('2d');
    frame = document.getElementById('frame');
  }
  function resize() {
    const S = Game.state;
    view = viewFor(S);
    const sideways = S.gravity !== 'down';
    const sc = sideways ? S.rows : S.cols, sr = sideways ? S.cols : S.rows; // screen columns / rows
    const play = document.getElementById('play');
    const cs = getComputedStyle(play);
    const w = play.clientWidth - CHROME;
    const h = play.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - CHROME - FRAME_SHADOW;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    cell = Math.max(10, Math.floor(Math.min(w / sc, h / sr)));
    const W = cell * sc, H = cell * sr;
    board.style.width = W + 'px'; board.style.height = H + 'px';
    board.width = Math.round(W * dpr); board.height = Math.round(H * dpr);
    next.width = Math.round(NEXT_W * dpr); next.height = Math.round(NEXT_H * dpr);
    Art.clear();
    // Pre-draw the empty board in the world's colors: gradient, soft checker,
    // dots, and an inner shadow on the side the pieces come from.
    const theme = WORLDS[Math.min(Levels.world(S.level), WORLDS.length - 1)];

/* ---------- 10. Input ---------- */
// Gestures are turned into the logical frame first, so on sideways key levels

// Every player action is announced as Events 'input' { action, via } so the
// Phase 2 tutorial can watch which control mode the player succeeds with.
const Input = (() => {
  let g = null; // current gesture
  let modeOverride = null; // Phase 2: the tutorial may pick the mode for level 1

  const playing = () => Game.state.status === 'playing' && Game.state.piece;
  const act = (action, ok) => { if (ok !== false) Events.emit('input', { action, via: mode() }); return ok; };

  // cell, relative to where the finger started, and stops flush against walls
  // and other pieces. Moving the finger along the fall turns on fast fall (the
  // piece does not follow it); moving back or lifting returns to normal speed.
  function dragMove(dx, y, cell) {
    const col = Math.round(dx / cell);
    for (let i = col - g.col; i > 0 && Game.move(1, 0); i--) act('move');
    for (let i = col - g.col; i < 0 && Game.move(-1, 0); i++) act('move');
    g.col = col;
    const th = Math.max(24 * reach(), cell * .8);
    if (!g.fast) {
      g.refY = Math.min(g.refY, y); // measure from the farthest-back point since the last stop
      if (y - g.refY > th) { g.peakY = y; fastFall(true); }
    } else {
      g.peakY = Math.max(g.peakY, y);
      if (g.peakY - y > th * .6) { g.refY = y; fastFall(false); }
    }
  }
  // Swipes: across the fall moves one column right away; along the fall =
  // fast fall for as long as the finger stays on the screen.
  function swipeMove(dx, dy, cell) {
    if (g.fast) return;
    const th = Math.max(24 * reach(), cell * .8);
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax > ay && ax >= th) { g.done = true; act('move', Game.move(dx > 0 ? 1 : -1, 0)); }
    else if (ay > ax && dy >= th) fastFall(true);
  }
  function onUp(e) {
    if (!g || e.pointerId !== g.id) return;
    const gest = g; g = null;
    if (gest.fast) Game.setFastFall(false); // lifting the finger: back to normal speed
    if (gest.done || !playing() || Game.state.pieceId !== gest.pieceId) return;
    const [x, y] = toLogical(e.clientX, e.clientY);
    gest.samples.push([x, y, performance.now()]);
    if (!gest.moved && performance.now() - gest.t0 < 350) act('rotate', Game.rotate());
    else if (isFlick(gest, x, y)) act('hard-drop', Game.hardDrop());
  }
  function onCancel(e) {
    if (!g || e.pointerId !== g.id) return;
    if (g.fast) Game.setFastFall(false);
    g = null;
  }

  // Keys come from Settings (defaults: arrows, Space, Esc). The four arrow-like
  // actions are screen directions that follow the board on key levels: across
  // the fall = move, toward the fall = fast fall while held, against the fall
  // = rotate – so on sideways levels "move left" may rotate, as the arrows do.
  const KEY_VEC = { left: [-1, 0], right: [1, 0], rotate: [0, -1], speed: [0, 1] };
  const actionOf = code => Object.keys(Store.get().settings.keys).find(a => Store.get().settings.keys[a] === code);
  function onKey(e) {
    if (UI.current !== 'game' || UI.capturing) return;
    const action = actionOf(e.code);
    if (!action) return;
    e.preventDefault();
    if (action === 'pause') { if (!e.repeat) UI.togglePause(); return; }
    if (!playing()) return;
    if (action === 'drop') { if (!e.repeat) Game.hardDrop(); return; } // holding never drops twice
    const [x, y] = toLogical(...KEY_VEC[action]);
    if (x) Game.move(x, 0);
    else if (y > 0) Game.setFastFall(true);
    else Game.rotate();
  }
  function onKeyUp(e) {
    const action = actionOf(e.code);
    if (KEY_VEC[action] && toLogical(...KEY_VEC[action])[1] > 0) Game.setFastFall(false);
  }
  function init() {
    const area = document.getElementById('game'); // the whole game screen is the touch area
    area.addEventListener('pointerdown', onDown);
    area.addEventListener('pointermove', onMove);
    area.addEventListener('pointerup', onUp);
    area.addEventListener('pointercancel', onCancel);
    area.addEventListener('touchmove', e => e.preventDefault(), { passive: false }); // stop iOS scroll/bounce
    window.addEventListener('keydown', onKey);
    window.addEventListener('keyup', onKeyUp);
  }
  return { init, setModeOverride: m => { modeOverride = m; } };
})();

  // ----- Boosters during a level -----

    ui.aiming = true; Game.freeze(true);
    $('frame').classList.add('aiming');
    renderBoosters();
  }
  function stopAim() {
    if (!ui.aiming) return;
    ui.aiming = false; Game.freeze(false);
    $('frame').classList.remove('aiming');
    renderBoosters();
  }
  ui.aimAt = (clientX, clientY) => {
    const cell = Render.cellAt(clientX, clientY);
    if (!cell) { stopAim(); return; } // tapping outside the board cancels
    if (Game.bomb(cell[0], cell[1])) { Store.useItem('bomb'); Events.emit('booster', { id: 'bomb' }); stopAim(); }
  };
  function openShopFromGame() {
    stopAim();
    if (Game.state.status === 'playing') Game.pause();
    Shop.open('coins', () => { show('game'); if (Game.state.status === 'paused') $('pauseOverlay').hidden = false; });
  }
  // Called every frame while playing: the Slow-mo button shows time left.
  ui.tick = () => {
    const btn = document.querySelector('.booster[data-id="slow"]');
    if (!btn) return;
    const left = Game.state.slowT / CONFIG.slowMoMs;
    btn.classList.toggle('running', left > 0);
    btn.querySelector('.ring circle').style.strokeDasharray = `${(left * 100).toFixed(1)} 100`;
  };
  // Key levels: a short arrow shows which way pieces fall; the game waits for it.
  function showDirection() {
    const S = Game.state, intro = $('dirIntro');
    clearTimeout(introTimer);
    if (!S.key) { intro.hidden = true; return; }
    intro.className = 'dir-intro ' + S.gravity;
    intro.hidden = false;
    intro.firstElementChild.style.animation = 'none';
    void intro.offsetWidth; // restart the CSS animation
    intro.firstElementChild.style.animation = '';
    Game.freeze(true);
    introTimer = setTimeout(() => { intro.hidden = true; Game.freeze(false); }, 1400);
  }
  function updateHud() {
    const S = Game.state;
    $('hudLevel').innerHTML = (S.key ? KEY : '') + S.level;
    $('hudLevelBox').classList.toggle('key', S.key);
    $('hudScore').textContent = S.score;
    const rows = $('rows');
    if (!rows.children.length) {
      for (let i = 0; i < CONFIG.rowsPerLevel; i++) {
        const pip = document.createElement('i');
        pip.style.setProperty('--c', PIECES[TYPES[i % TYPES.length]].color);
        rows.appendChild(pip);
      }
    }
    [...rows.children].forEach((pip, i) => pip.classList.toggle('on', i < S.lines));
    const what = S.key ? 'Columns' : 'Rows';
    rows.setAttribute('aria-label', `${what}: ${Math.min(S.lines, CONFIG.rowsPerLevel)} of ${CONFIG.rowsPerLevel}`);
  }
  function togglePause() {
    const S = Game.state;
    if (S.status === 'playing') { stopAim(); Game.pause(); $('pauseOverlay').hidden = false; }
    else if (S.status === 'paused') { Game.resume(); $('pauseOverlay').hidden = true; }
  }
  // Counts a number up from 0 (about 0.9 s), for the coins on "Well done!".
  function countUp(el, to) {
    const t0 = performance.now(), dur = 900;
    const step = now => {
      const q = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - q, 3);
      el.textContent = Math.round(to * e);
      if (q < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function onLevelComplete({ level, score, base }) {
    stopAim();
    const got = Game.stars(base);
    const first = !Levels.stars(level); // coins only for the first completion
    const coins = first ? Economy.coinsFor(level, base) : 0;
    Store.recordLevel(level, got, score);
    if (coins) Store.addCoins(coins);
    const coinLine = $('winCoins');
    coinLine.hidden = !coins;
    coinLine.firstElementChild.textContent = '0';
    coinLine.setAttribute('aria-label', `${coins} coins earned`);
    if (coins) setTimeout(() => { countUp(coinLine.firstElementChild, coins); Effects.coinRain(coinLine, coins); Events.emit('fx', { name: 'coins', amount: coins }); }, 700);
    // Key levels, first time: a treasure chest of boosters and a new special animal.
    const prize = $('winPrize');
    prize.hidden = !(first && Levels.isKey(level));
    if (!prize.hidden) {
      const items = Economy.chest(), sp = Cast.specialFor(level);
      Store.addItems(items);
      Store.unlockSpecial(level);
      $('prizeItems').innerHTML = Object.keys(items).map((id, i) => `<span style="--i:${i}" aria-label="${BOOSTERS[id].name}">${BOOSTERS[id].icon}</span>`).join('');
      $('friendArt').innerHTML = '';
      $('friendArt').appendChild(Art.pieceCanvas(Cast.special(level), 24));
      $('friendName').textContent = sp.name;
      prize.classList.remove('play'); void prize.offsetWidth; prize.classList.add('play');
    }
    updateHud();
    $('winStars').innerHTML = star(got >= 1) + star(got >= 2) + star(got >= 3);
    $('winScore').textContent = score;
    // Next: the main path continues after the level (or after the level a key level branches from).
    const next = Levels.num(level) + 1, nextOpen = next <= CONFIG.levelCount && Levels.unlocked(next);
    nextLevel = next;
    $('nextLevelBtn').hidden = !nextOpen;
    // At the end of a world whose next world is still locked: show the star progress.
    const lockNote = $('winLock');
    if (!nextOpen && next <= CONFIG.levelCount) {
      const p = Levels.unlockProgress(Levels.world(next));
      lockNote.innerHTML = `${LOCK}<span>${p.have}/${p.need}</span>${star(true)}`;
      lockNote.setAttribute('aria-label', `Next world locked: ${p.have} of ${p.need} stars`);
      lockNote.hidden = false;
    } else lockNote.hidden = true;
    const chest = !prize.hidden;
    setTimeout(() => { $('winOverlay').hidden = false; Events.emit('fx', { name: 'winScreen', stars: got, chest }); }, 350);
  }
  function onGameOver({ score }) {
    stopAim();
    Store.recordScore(score);
    // Second chance: offered only if owned and not used yet in this level.
    const n = Store.count('chance');
    $('chanceBtn').hidden = !n || Game.state.chanceUsed;
    $('chanceCount').textContent = n;
    const buddy = $('overBuddy'); // a smiling animal, never a scary screen
    buddy.innerHTML = '';
    buddy.appendChild(Art.pieceCanvas('O', 52));
    setTimeout(() => { $('overOverlay').hidden = false; Events.emit('fx', { name: 'oops' }); }, 350);
  }

  function init() {
    document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => show(b.dataset.go)));
    initSettings();
    $('pauseBtn').addEventListener('click', togglePause);
    $('resumeBtn').addEventListener('click', togglePause);
    $('pauseRestart').addEventListener('click', () => startLevel(lastLevel));
    $('pauseMap').addEventListener('click', () => { $('pauseOverlay').hidden = true; show('map'); });
    $('nextLevelBtn').addEventListener('click', () => startLevel(nextLevel));
    $('mapZoo').addEventListener('click', () => show('zoo'));
    $('winRetry').addEventListener('click', () => startLevel(lastLevel));
    $('winMap').addEventListener('click', () => { $('winOverlay').hidden = true; show('map'); });
    $('overRetry').addEventListener('click', () => startLevel(lastLevel));
    $('overMap').addEventListener('click', () => { $('overOverlay').hidden = true; show('map'); });
    $('chanceBtn').addEventListener('click', () => {
      if (Store.count('chance') && Game.secondChance()) {
        Store.useItem('chance');
        Events.emit('booster', { id: 'chance' });
        $('overOverlay').hidden = true;
        renderBoosters();
      }
    });
    $('mapShop').addEventListener('click', () => Shop.open('coins', () => show('map')));

    Events.on('lines', updateHud);
    Events.on('levelComplete', onLevelComplete);
    Events.on('gameOver', onGameOver);

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && Game.state.status === 'playing') togglePause();
    });
    window.addEventListener('resize', () => {
      if (ui.current === 'game') { Scene.resize(); Render.resize(); Effects.sizeScreen(); }
      else if (ui.current === 'map') renderMap();
      else if (ui.current === 'home') renderHome();
    });
  }
  return Object.assign(ui, { init, show, togglePause, startLevel, coinChip });
})();

/* ---------- 11b. Shop ---------- */
// Two tabs: the coin shop (boosters for game coins) and the real-money shop
// (coin packs, starter pack – via Payments, test mode for now). Kid-friendly:
// no timers, no pop-ups, it only opens when the player taps the shop.
const Shop = (() => {
  const $ = id => document.getElementById(id);
  const NUM_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine'];
  const reduced = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  let tab = 'coins', onBack = null, gate = null;

  function open(which, back) {
    tab = which || 'coins'; onBack = back;
    UI.show('shop');
    render();
  }
  function renderHeader() {
    const c = Store.get().coins;
    $('shopCoins').innerHTML = UI.coinChip(c);
    $('shopCoins').setAttribute('aria-label', `${c} coins`);
    document.querySelectorAll('#shop .tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
    const inv = $('inventory');
    inv.innerHTML = Object.entries(BOOSTERS).map(([id, b]) =>
      `<span class="inv" data-id="${id}" aria-label="${b.name}: ${Store.count(id)}"><span class="ico">${b.icon}</span><b>${Store.count(id)}</b></span>`).join('');
  }
  function render() {
    renderHeader();
    const body = $('shopBody');
    body.scrollTop = 0;
    if (tab === 'coins') {
      const coins = Store.get().coins;
      body.innerHTML = Object.entries(BOOSTERS).map(([id, b]) => {
        const [n, bundlePrice] = b.bundle;
        const buy = (qty, price) => `<button class="btn buy${coins < price ? ' short' : ''}" data-id="${id}" data-qty="${qty}" data-price="${price}" aria-label="Buy ${qty} ${b.name} for ${price} coins">
            <span class="qty">×${qty}</span><span class="price">${UI.coinChip(price)}</span></button>`;
        return `<div class="card item"><span class="big-ico">${b.icon}</span><b class="name">${b.name}</b>
          <div class="buys">${buy(1, b.price)}${buy(n, bundlePrice)}</div></div>`;
      }).join('');
      body.querySelectorAll('.buy').forEach(btn => btn.addEventListener('click', () => buyWithCoins(btn)));
    } else {
      const products = Payments.products().filter(p => !(p.once && Store.get().starterBought));
      const banner = Payments.TEST_MODE ? '<p class="test-mode">Test mode: purchases are free</p>' : '';
      body.innerHTML = banner + products.map(p => {
        if (p.kind === 'starter') {
          const items = Object.entries(p.items).map(([id, n]) => `<span>${BOOSTERS[id].icon}×${n}</span>`).join('');
          return `<div class="card pack starter"><span class="big-ico">🎁</span><b class="name">Starter pack</b>
            <div class="contents">${UI.coinChip(p.coins)}${items}</div>
            <button class="btn primary real" data-id="${p.id}" aria-label="Starter pack for ${p.price}">${p.price}</button></div>`;
        }
        return `<div class="card pack coins-pack size${p.size}">${p.bonus ? `<span class="bonus">${p.bonus}</span>` : ''}
          <span class="stack">${'<i class="coin" aria-hidden="true"></i>'.repeat(p.size)}</span>
          <b class="amount">${p.coins}</b>
          <button class="btn primary real" data-id="${p.id}" aria-label="${p.coins} coins for ${p.price}">${p.price}</button></div>`;
      }).join('');
      body.querySelectorAll('.real').forEach(btn => btn.addEventListener('click', () => askGrownUp(btn)));
    }
  }

  function buyWithCoins(btn) {
    const { id } = btn.dataset, qty = +btn.dataset.qty, price = +btn.dataset.price;
    if (!Store.spendCoins(price)) { btn.classList.remove('nope'); void btn.offsetWidth; btn.classList.add('nope'); return; }
    Store.addItems({ [id]: qty });
    Events.emit('purchase', { id, qty, currency: 'coins' });
    const rect = btn.getBoundingClientRect(); // before the cards are redrawn
    render();
    flyTo(BOOSTERS[id].icon, rect, document.querySelector(`.inv[data-id="${id}"]`));
  }

  // Parental gate: "What is seven times eight?" – a young child can't answer alone.
  function askGrownUp(btn) {
    const a = 3 + Math.floor(Math.random() * 7), b = 3 + Math.floor(Math.random() * 7);
    gate = { answer: a * b, id: btn.dataset.id, from: btn };
    $('gateQ').textContent = `What is ${NUM_WORDS[a]} times ${NUM_WORDS[b]}?`;
    $('gateInput').value = '';
    $('gate').hidden = false;
    setTimeout(() => $('gateInput').focus(), 50);
  }
  function closeGate() { $('gate').hidden = true; gate = null; }
  async function checkGate() {
    if (!gate) return;
    const ok = parseInt($('gateInput').value, 10) === gate.answer;
    const { id, from } = gate;
    closeGate();
    if (!ok) return; // wrong answer: back to the shop, nothing bought
    const result = await Payments.purchase(id);
    if (!result.ok) return;
    const p = result.product;
    if (p.coins) Store.addCoins(p.coins);
    if (p.items) Store.addItems(p.items);
    if (p.once) Store.setStarterBought();
    Events.emit('purchase', { id, currency: 'real', test: Payments.TEST_MODE });
    const fromRect = from.getBoundingClientRect();
    render();
    flyTo(p.items ? '🎁' : '', fromRect, $('shopCoins'));
    if (p.items) Object.keys(p.items).forEach((k, i) => setTimeout(() => flyTo(BOOSTERS[k].icon, fromRect, document.querySelector(`.inv[data-id="${k}"]`)), 120 * (i + 1)));
  }

  // A happy little flight from the buy button into the inventory (or coin counter).
  function flyTo(icon, from, target) {
    if (!target) return;
    const a = from.getBoundingClientRect ? from.getBoundingClientRect() : from, b = target.getBoundingClientRect();
    const pop = () => { target.classList.remove('pop'); void target.offsetWidth; target.classList.add('pop'); };
    if (reduced) { pop(); return; }
    const el = document.createElement('span');
    el.className = 'flyer';
    el.innerHTML = icon || '<i class="coin"></i>';
    document.body.appendChild(el);
    const x0 = a.left + a.width / 2, y0 = a.top + a.height / 2, x1 = b.left + b.width / 2, y1 = b.top + b.height / 2;
    const anim = el.animate([
      { transform: `translate(${x0}px, ${y0}px) translate(-50%, -50%) scale(1)` },
      { transform: `translate(${(x0 + x1) / 2}px, ${Math.min(y0, y1) - 80}px) translate(-50%, -50%) scale(1.5) rotate(-15deg)`, offset: .45 },
      { transform: `translate(${x1}px, ${y1}px) translate(-50%, -50%) scale(.6)` },
    ], { duration: 650, easing: 'ease-in-out' });
    anim.onfinish = () => { el.remove(); pop(); };
  }

  function init() {
    document.querySelectorAll('#shop .tab').forEach(t => t.addEventListener('click', () => { tab = t.dataset.tab; render(); }));
    $('shopBack').addEventListener('click', () => { closeGate(); (onBack || (() => UI.show('map')))(); });
    $('gateCancel').addEventListener('click', closeGate);
    $('gateOk').addEventListener('click', checkGate);
    $('gateInput').addEventListener('keydown', e => { if (e.key === 'Enter') checkGate(); });
  }
  return { init, open };
})();

/* ---------- 12. Boot ---------- */
(function boot() {
  Scene.init();
  Render.init();
  Input.init();
  UI.init();
  Shop.init();
  Effects.sizeScreen();
  UI.show('home');
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(100, now - last);
    last = now;
    if (UI.current === 'game') { Game.update(dt); Effects.update(dt); Scene.update(dt); Scene.draw(); Render.draw(); Effects.drawScreen(); UI.tick(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
